name: Direct TREE receipt binding checks
on:
  push:
    branches: [feature/paid-continue-delivery]
    paths:
      - 'services/canopy-credits/reader/**'
      - 'services/canopy-credits/continue-product.mjs'
      - 'services/canopy-credits/direct-continue-verifier.mjs'
      - 'services/canopy-credits/mainnet-payment.mjs'
      - 'services/canopy-credits/mainnet-reader.mjs'
      - '.github/workflows/direct-checkout-binding.yml'
permissions:
  contents: read
jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked reader SDK without install scripts
        run: npm ci --prefix services/canopy-credits/reader --ignore-scripts --no-audit --no-fund
      - name: Exact direct receipt, quote and existing checkout tests
        run: node --test --test-reporter=spec services/canopy-credits/reader/checkout/tests/*.test.mjs services/canopy-credits/reader/transport.test.mjs
