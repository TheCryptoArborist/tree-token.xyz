name: Verify original-NFT publication page
on:
  pull_request:
    paths:
      - 'scripts/multichain/original-publish-core.mjs'
      - 'play/multichaintest/original/**'
      - 'tests/multichain-original-publish.test.mjs'
      - 'docs/multichain/one-slot-vault/publication-bytecode.json'
      - '.github/workflows/verify-original-publication.yml'
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test tests/multichain-original-publish.test.mjs tests/one-slot-publication.test.mjs
      - run: |
          node_modules/.bin/esbuild scripts/multichain/original-publish-core.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/original-core.js
          cmp /tmp/original-core.js play/multichaintest/original/core.js
          node --check play/multichaintest/original/app.js
          git diff --check
