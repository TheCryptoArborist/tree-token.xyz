name: Run complete live TREE exposure snapshot

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/live-total-tree-exposure-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Build complete verified Liquid plus LP snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/live-total-tree-exposure-snapshot.ts <<'TS'
          import { scanSuiGraphqlLeaderboard } from '../netlify/lib/sui-graphql-leaderboard-provider.ts';
          import { scanSuiDexV2TreeLp } from '../netlify/lib/suidex-v2-tree-lp-provider.ts';
          import { scanSuiDexV3TreeLp } from '../netlify/lib/suidex-v3-tree-lp-provider.ts';
          import { scanTurbosTreeLp } from '../netlify/lib/turbos-tree-lp-provider.ts';
          import { buildVerifiedExposureSnapshot } from '../netlify/lib/tree-exposure-aggregator.ts';
          import { LP_MAXI_BADGE, LP_PROVIDER_BADGE } from '../netlify/lib/tree-exposure-types.ts';

          const direct = await scanSuiGraphqlLeaderboard({
            endpoint: 'https://graphql.mainnet.sui.io/graphql',
            pageSize: 50,
            maxPages: 5_000,
            maxScanMs: 840_000,
            maxRetries: 6,
            progressIntervalPages: 100,
            includeExposureCandidates: true,
            onProgress: (progress) => {
              if (progress.pagesScanned > 0 && progress.pagesScanned % 100 === 0) {
                console.log(`Direct TREE progress: pages=${progress.pagesScanned} objects=${progress.objectsScanned} owners=${progress.uniqueAddressOwners}`);
              }
            },
          });
          if (direct.outcome !== 'complete' || !direct.exposureCandidates) {
            console.log(JSON.stringify({ stage: 'direct', outcome: direct.outcome, coverage: direct.coverage, warnings: direct.warnings }, null, 2));
            process.exit(1);
          }

          const suiDexV2 = await scanSuiDexV2TreeLp();
          const suiDexV3 = await scanSuiDexV3TreeLp();
          const turbos = await scanTurbosTreeLp();

          const snapshot = buildVerifiedExposureSnapshot({
            directEntries: direct.exposureCandidates,
            directTreeComplete: direct.outcome === 'complete',
            venueResults: { suiDexV2, suiDexV3, turbos },
            generatedAt: new Date().toISOString(),
            limit: 50,
          });

          const venueSummary = Object.fromEntries(
            Object.entries({ suiDexV2, suiDexV3, turbos }).map(([venue, result]) => [venue, {
              outcome: result.outcome,
              wallets: result.positions.length,
              positions: result.positions.reduce((sum, item) => sum + item.positionCount, 0),
              principalTreeRaw: result.positions.reduce((sum, item) => sum + BigInt(item.lpTreeRaw), 0n).toString(),
              coverage: result.coverage,
              warnings: result.warnings,
            }]),
          );
          const top50TotalRaw = snapshot.entries.reduce((sum, entry) => sum + BigInt(entry.totalExposureRaw), 0n).toString();
          const top50LiquidRaw = snapshot.entries.reduce((sum, entry) => sum + BigInt(entry.liquidTreeRaw), 0n).toString();
          const top50LpRaw = snapshot.entries.reduce((sum, entry) => sum + BigInt(entry.lpTreeRaw), 0n).toString();
          const badgeCounts = {
            lpProvider: snapshot.entries.filter((entry) => entry.badges.includes(LP_PROVIDER_BADGE)).length,
            lpMaxi: snapshot.entries.filter((entry) => entry.badges.includes(LP_MAXI_BADGE)).length,
          };

          console.log(JSON.stringify({
            direct: {
              outcome: direct.outcome,
              pagesScanned: direct.coverage.pagesScanned,
              objectsScanned: direct.coverage.objectsScanned,
              verifiedAddressOwners: direct.verifiedAddressOwners,
              eligibleDirectOwners: direct.eligibleRankedOwners,
              exposureCandidateCount: direct.exposureCandidates.length,
              addressOwnedRaw: direct.reconciliation.addressOwnedRaw,
            },
            venues: venueSummary,
            snapshot: {
              outcome: snapshot.outcome,
              generatedAt: snapshot.generatedAt,
              methodologyVersion: snapshot.methodologyVersion,
              displayedCount: snapshot.entries.length,
              eligibleOwnerCount: snapshot.eligibleOwnerCount,
              coverage: snapshot.coverage,
              top50TotalRaw,
              top50LiquidRaw,
              top50LpRaw,
              badgeCounts,
              rank50Cutoff: snapshot.entries.at(-1)?.totalExposure || null,
              rank50CutoffRaw: snapshot.entries.at(-1)?.totalExposureRaw || null,
              topFive: snapshot.entries.slice(0, 5).map((entry) => ({
                rank: entry.rank,
                totalExposure: entry.totalExposure,
                liquidTree: entry.liquidTree,
                lpTree: entry.lpTree,
                lpBreakdown: entry.lpBreakdown,
                badges: entry.badges,
              })),
              warnings: snapshot.warnings,
            },
          }, null, 2));

          if (snapshot.outcome !== 'complete' || snapshot.entries.length !== 50 || !snapshot.coverage.totalExposureComplete) {
            process.exit(1);
          }
          TS
          npx --yes tsx scripts/live-total-tree-exposure-snapshot.ts

      - name: Remove temporary live snapshot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/live-total-tree-exposure-snapshot.yml scripts/live-total-tree-exposure-snapshot.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete live TREE exposure snapshot"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
