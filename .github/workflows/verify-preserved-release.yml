name: Verify preserved release guards

on:
  pull_request:
    paths:
      - 'scripts/release-preserved-production.mjs'
      - 'tests/preserved-release.test.mjs'
      - '.github/workflows/verify-preserved-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/preserved-release.test.mjs
      - run: git diff --check
