name: Inspect Aftermath TREE pools
on:
  push:
    branches:
      - feature/tree-liquidity-graph
    paths:
      - '.github/workflows/inspect-aftermath-tree-pools.yml'
      - 'scripts/inspect-aftermath-tree-pools.mjs'
      - 'netlify/lib/aftermath-tree-discovery.ts'
      - 'netlify/lib/tree-venue-discovery.ts'
      - 'netlify/lib/tree-swap-route.ts'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/inspect-aftermath-tree-pools.mjs
