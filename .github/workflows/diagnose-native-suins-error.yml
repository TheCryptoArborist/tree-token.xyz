name: Diagnose native SuiNS lookup errors

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/diagnose-native-suins-error.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0

      - name: Install diagnostic transport without saving
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @protobuf-ts/grpc-transport @grpc/grpc-js

      - name: Categorize native gRPC errors without printing wallets
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/diagnose-suins.mjs" <<'JS'
          import { ChannelCredentials } from '@grpc/grpc-js';
          import { GrpcTransport } from '@protobuf-ts/grpc-transport';
          import { SuiGrpcClient } from '@mysten/sui/grpc';

          const response = await fetch('https://tree-token.xyz/api/tree-leaderboard');
          if (!response.ok) throw new Error(`Leaderboard HTTP ${response.status}`);
          const payload = await response.json();
          const wallets = (payload.entries || []).slice(0, 3).map((entry) => entry.wallet);
          if (wallets.length !== 3) throw new Error('Expected three leaderboard wallets.');

          const client = new SuiGrpcClient({
            network: 'mainnet',
            transport: new GrpcTransport({
              host: 'fullnode.mainnet.sui.io:443',
              channelCredentials: ChannelCredentials.createSsl(),
            }),
          });

          const output = [];
          for (let index = 0; index < wallets.length; index += 1) {
            try {
              const result = await client.core.defaultNameServiceName({ address: wallets[index] });
              output.push({ index, outcome: 'fulfilled', resolved: Boolean(result?.name), nameLength: result?.name?.length || 0 });
            } catch (error) {
              const source = error && typeof error === 'object' ? error : {};
              output.push({
                index,
                outcome: 'rejected',
                constructor: error?.constructor?.name || null,
                name: source.name || null,
                code: source.code ?? source.status ?? source.rpcCode ?? null,
                message: String(source.message || error || '').slice(0, 300),
                keys: Object.keys(source).sort(),
              });
            }
          }
          console.log(JSON.stringify(output, null, 2));
          JS
          (cd "$GITHUB_WORKSPACE" && node "$RUNNER_TEMP/diagnose-suins.mjs")

      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-native-suins-error.yml
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add .github/workflows/diagnose-native-suins-error.yml
          git commit -m "Remove temporary native SuiNS diagnostic"
          git push origin HEAD:feature/command-center-ui-v2
