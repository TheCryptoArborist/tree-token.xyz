name: Verify production TREE leaderboard bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production deployment and first scheduled refresh
        shell: bash
        run: |
          set -euo pipefail
          base="https://tree-token.xyz"
          sleep 150

          for path in "/" "/dapp/" "/api/tree-dashboard" "/api/tree-chart?range=24h" "/api/tree-leaderboard"; do
            code=$(curl -L -sS -o /tmp/tree-response -w '%{http_code}' "${base}${path}")
            echo "HTTP ${code} ${path}"
            test "$code" = "200"
          done

          for attempt in $(seq 1 40); do
            payload=$(curl -fsS "${base}/api/tree-leaderboard")
            status=$(jq -r '.status // "unknown"' <<<"$payload")
            refresh=$(jq -r '.refreshState // "idle"' <<<"$payload")
            pages=$(jq -r '(.coverage.pagesScanned // .refreshStatus.pagesScanned // 0)' <<<"$payload")
            objects=$(jq -r '(.coverage.objectsScanned // .refreshStatus.objectsScanned // 0)' <<<"$payload")
            rows=$(jq -r '(.displayedCount // 0)' <<<"$payload")
            echo "Status=${status}; Refresh=${refresh}; Pages=${pages}; Objects=${objects}; Rows=${rows}"

            if [[ "$status" == "ok" || "$status" == "stale" ]] && [[ "$refresh" == "complete" ]]; then
              jq -e '
                .provider == "sui-graphql-snapshot" and
                .methodologyVersion == "direct-tree-sui-graphql-poc-v2" and
                .coinDecimals == 6 and
                .totalSupplyRaw == "1000000000000000" and
                .coverage.coinMetadataVerified == true and
                .coverage.reachedEnd == true and
                .coverage.scanComplete == true and
                .reconciliation.valid == true and
                (.displayedCount > 0 and .displayedCount <= 50) and
                ((.entries | length) > 0)
              ' <<<"$payload" >/dev/null

              jq '{
                status,
                refreshState,
                provider,
                snapshotGeneratedAt,
                methodologyVersion,
                coinDecimals,
                totalSupplyRaw,
                verifiedAddressOwners,
                eligibleRankedOwners,
                displayedCount,
                excludedCoinObjects,
                excludedUniqueOwners,
                pagesScanned: .coverage.pagesScanned,
                objectsScanned: .coverage.objectsScanned,
                addressOwnedCoinObjects: .coverage.addressOwnedCoinObjects,
                elapsedMs: .coverage.elapsedMs,
                reachedEnd: .coverage.reachedEnd,
                scanComplete: .coverage.scanComplete,
                reconciliationValid: .reconciliation.valid,
                addressOwnedTree: .reconciliation.addressOwnedTree,
                addressOwnedPercentOfTotal: .reconciliation.addressOwnedPercentOfTotal,
                nonAddressOwnedOrEmbeddedTreeEstimate: .reconciliation.nonAddressOwnedOrEmbeddedTreeEstimate,
                message
              }' <<<"$payload"
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for the verified production TREE leaderboard snapshot."
          exit 1
