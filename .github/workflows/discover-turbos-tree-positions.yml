name: Discover Turbos TREE pools and positions

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/discover-turbos-tree-positions.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Enumerate official Turbos pools and all position NFTs
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false turbos-clmm-sdk@4.0.1
          cat > scripts/discover-turbos-tree-positions.ts <<'TS'
          import { ChannelCredentials } from '@grpc/grpc-js';
          import { GrpcTransport } from '@protobuf-ts/grpc-transport';
          import { SuiGrpcClient } from '@mysten/sui/grpc';
          import { Network, TurbosSdk } from 'turbos-clmm-sdk';

          const GRAPHQL = 'https://graphql.mainnet.sui.io/graphql';
          const TREE = '0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::tree';
          const NFT_TYPE = '0x91bfbc386a41afcfd9b2533058d7e915a1d3829089cc268ff4333d54d6339ca1::position_nft::TurbosPositionNFT';
          type Rec = Record<string, unknown>;
          const record = (value: unknown): Rec => value && typeof value === 'object' && !Array.isArray(value) ? value as Rec : {};
          const normalizeType = (value: unknown) => {
            if (typeof value !== 'string') return '';
            const parts = value.toLowerCase().replace(/\s+/g, '').split('::');
            if (parts.length !== 3) return '';
            const address = parts[0].replace(/^0x/, '').replace(/^0+/, '') || '0';
            return `0x${address}::${parts[1]}::${parts[2]}`;
          };
          const normalizeId = (value: unknown) => typeof value === 'string' && /^(0x)?[0-9a-f]{64}$/i.test(value)
            ? (value.startsWith('0x') ? value.toLowerCase() : `0x${value.toLowerCase()}`)
            : null;
          const sleep = (ms: number) => new Promise((resolve) => setTimeout(resolve, ms));

          const sdk = new TurbosSdk(Network.mainnet);
          const config = await sdk.contract.getConfig();
          const allPools = await sdk.pool.getPools(true);
          const treePools = allPools.filter((pool) => pool.types.some((type) => normalizeType(type) === TREE));
          const treePoolIds = new Set(treePools.map((pool) => pool.objectId.toLowerCase()));

          async function graphql(query: string, variables: Rec) {
            for (let attempt = 0; attempt < 7; attempt += 1) {
              try {
                const response = await fetch(GRAPHQL, {
                  method: 'POST',
                  headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
                  body: JSON.stringify({ query, variables }),
                });
                if (response.status === 429 || response.status >= 500) {
                  if (attempt === 6) throw new Error(`GraphQL HTTP ${response.status}`);
                  await sleep(Math.min(10_000, 500 * (2 ** attempt)));
                  continue;
                }
                if (!response.ok) throw new Error(`GraphQL HTTP ${response.status}`);
                const payload = record(await response.json());
                const errors = Array.isArray(payload.errors) ? payload.errors : [];
                if (errors.length) throw new Error(errors.map((item) => String(record(item).message || 'GraphQL error')).join(' | '));
                return record(payload.data);
              } catch (error) {
                if (attempt === 6) throw error;
                await sleep(Math.min(10_000, 500 * (2 ** attempt)));
              }
            }
            throw new Error('GraphQL retries exhausted.');
          }

          const query = `query Scan($first: Int!, $after: String, $type: String!) {
            objects(first: $first, after: $after, filter: { type: $type }) {
              pageInfo { hasNextPage endCursor }
              nodes {
                address
                owner {
                  __typename
                  ... on AddressOwner { address { address } }
                  ... on ObjectOwner { address { address } }
                }
                asMoveObject { contents { json } }
              }
            }
          }`;

          const matches: Array<{ objectId: string; owner: Rec; json: Rec }> = [];
          let after: string | null = null;
          let scanned = 0;
          let pages = 0;
          let reachedEnd = false;
          for (let page = 0; page < 2_000; page += 1) {
            const data = await graphql(query, { first: 50, after, type: NFT_TYPE });
            const connection = record(data.objects);
            const nodes = Array.isArray(connection.nodes) ? connection.nodes.filter((item): item is Rec => Boolean(item && typeof item === 'object')) : [];
            scanned += nodes.length;
            pages = page + 1;
            for (const node of nodes) {
              const objectId = normalizeId(node.address);
              const json = record(record(record(node.asMoveObject).contents).json);
              const poolId = normalizeId(json.pool_id);
              const hasTreeType = normalizeType(json.coin_type_a) === TREE || normalizeType(json.coin_type_b) === TREE;
              if (objectId && (hasTreeType || Boolean(poolId && treePoolIds.has(poolId)))) {
                matches.push({ objectId, owner: record(node.owner), json });
              }
            }
            const pageInfo = record(connection.pageInfo);
            if (pageInfo.hasNextPage !== true) { reachedEnd = true; break; }
            if (typeof pageInfo.endCursor !== 'string' || !pageInfo.endCursor) break;
            after = pageInfo.endCursor;
            if ((page + 1) % 100 === 0) console.log(`Turbos NFT scan progress: pages=${page + 1} objects=${scanned} matches=${matches.length}`);
          }

          const grpc = new SuiGrpcClient({
            network: 'mainnet',
            transport: new GrpcTransport({ host: 'fullnode.mainnet.sui.io:443', channelCredentials: ChannelCredentials.createSsl() }),
          });
          const referencedPositions = [];
          for (const match of matches) {
            const positionId = normalizeId(match.json.position_id);
            if (!positionId) continue;
            const { object } = await grpc.core.getObject({ objectId: positionId, include: { json: true } });
            referencedPositions.push({ nftId: match.objectId, positionId, type: object?.type, owner: object?.owner, json: object?.json });
          }

          console.log(JSON.stringify({
            contract: {
              PackageIdOriginal: config.PackageIdOriginal,
              Positions: config.Positions,
              PoolTableId: config.PoolTableId,
            },
            allPoolCount: allPools.length,
            treePools: treePools.map((pool) => ({
              objectId: pool.objectId,
              type: pool.type,
              types: pool.types,
              coin_a: pool.coin_a,
              coin_b: pool.coin_b,
              liquidity: pool.liquidity,
              sqrt_price: pool.sqrt_price,
              tick_current_index: pool.tick_current_index,
              unlocked: pool.unlocked,
            })),
            scan: { reachedEnd, pages, scanned, matchCount: matches.length },
            matches,
            referencedPositions,
          }, null, 2));
          if (!reachedEnd) process.exitCode = 1;
          TS
          npx --yes tsx scripts/discover-turbos-tree-positions.ts

      - name: Remove temporary discovery workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/discover-turbos-tree-positions.yml scripts/discover-turbos-tree-positions.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Turbos TREE position discovery"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
