name: Persist SuiNS gRPC dependencies

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/persist-suins-grpc-dependencies.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0

      - name: Add explicit native gRPC dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --save @grpc/grpc-js @protobuf-ts/grpc-transport
          rm -f .github/workflows/persist-suins-grpc-dependencies.yml
          git diff --check

      - name: Validate explicit dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          node -e "const pkg=require('./package.json'); if(!pkg.dependencies['@grpc/grpc-js']||!pkg.dependencies['@protobuf-ts/grpc-transport']) process.exit(1)"
          git diff --check

      - name: Commit dependency declarations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/persist-suins-grpc-dependencies.yml
          git commit -m "Declare native gRPC dependencies for SuiNS"
          git push origin HEAD:feature/command-center-ui-v2
