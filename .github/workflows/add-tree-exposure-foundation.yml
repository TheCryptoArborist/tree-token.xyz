name: Build verified TREE exposure foundation

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/add-tree-exposure-foundation.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Apply exposure foundation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-tree-exposure-foundation.py
          rm -f scripts/apply-tree-exposure-foundation.py .github/workflows/add-tree-exposure-foundation.yml
          git diff --check

      - name: Validate exposure foundation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python - <<'PY'
          from pathlib import Path
          provider = Path('netlify/lib/suidex-v2-tree-lp-provider.ts').read_text(encoding='utf-8')
          aggregator = Path('netlify/lib/tree-exposure-aggregator.ts').read_text(encoding='utf-8')
          assert 'SUIDEX_V2_TREE_POOL_ID' in provider
          assert 'reserve1' in provider
          assert 'total_supply' in provider
          assert 'StakingPosition' in provider
          assert 'lpRawToTreeRaw' in provider
          assert 'Total verified TREE exposure is incomplete' in aggregator
          assert 'lp-provider' in Path('netlify/lib/tree-exposure-types.ts').read_text(encoding='utf-8')
          assert 'lp-maxi' in Path('netlify/lib/tree-exposure-types.ts').read_text(encoding='utf-8')
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in Path('dapp/app.js').read_text(encoding='utf-8')
          PY
          git diff --check

      - name: Commit exposure foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Add verified TREE exposure foundation"
          git push origin HEAD:feature/leaderboard-exposure-v1
