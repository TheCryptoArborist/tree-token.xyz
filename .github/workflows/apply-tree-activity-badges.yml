name: Integrate verified TREE activity badges

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/apply-tree-activity-badges.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0
      - name: Apply badge integration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-tree-activity-badges.py
          rm -f scripts/apply-tree-activity-badges.py .github/workflows/apply-tree-activity-badges.yml
          git diff --check
      - name: Validate badge providers and existing safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          runner = Path('netlify/lib/tree-exposure-scan-runner.ts').read_text(encoding='utf-8')
          cache = Path('netlify/lib/tree-exposure-cache.ts').read_text(encoding='utf-8')
          app = Path('dapp/app.js').read_text(encoding='utf-8')
          assert 'scanTreeTradingActivity' in runner
          assert 'scanTreeBurnContributions' in runner
          assert "DIAMOND_HANDS_BADGE" in runner and "BURNED_BADGE" in runner
          assert 'activity30d' in cache and 'burnedTreeRaw' in cache
          assert "label: 'Burned'" in app
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          PY
          git diff --check
      - name: Commit badge integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Add verified TREE activity badges"
          git push origin HEAD:feature/leaderboard-exposure-v1
