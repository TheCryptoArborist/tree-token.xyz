name: Probe TREE leaderboard LP object types

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/probe-tree-exposure-object-types.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Aggregate candidate LP and position object types
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/probe-tree-exposure.mjs" <<'JS'
          const RPC = 'https://fullnode.mainnet.sui.io:443';
          const TREE = '0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          const leaderboardResponse = await fetch('https://tree-token.xyz/api/tree-leaderboard');
          if (!leaderboardResponse.ok) throw new Error(`Leaderboard HTTP ${leaderboardResponse.status}`);
          const leaderboard = await leaderboardResponse.json();
          const wallets = (leaderboard.entries || []).map((entry) => entry.wallet).filter(Boolean).slice(0, 50);
          if (wallets.length !== 50) throw new Error(`Expected 50 leaderboard wallets; received ${wallets.length}`);

          let requestId = 0;
          async function rpc(method, params, attempt = 0) {
            const response = await fetch(RPC, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: ++requestId, method, params }),
            });
            if ((response.status === 429 || response.status >= 500) && attempt < 5) {
              await new Promise((resolve) => setTimeout(resolve, Math.min(10_000, 750 * 2 ** attempt)));
              return rpc(method, params, attempt + 1);
            }
            if (!response.ok) throw new Error(`${method} HTTP ${response.status}`);
            const payload = await response.json();
            if (payload.error) throw new Error(`${method}: ${payload.error.message || 'RPC error'}`);
            return payload.result;
          }

          async function ownedTypes(owner) {
            const rows = [];
            let cursor = null;
            for (let page = 0; page < 5; page += 1) {
              const result = await rpc('suix_getOwnedObjects', [
                owner,
                null,
                { showType: true, showContent: false, showOwner: false, showDisplay: false },
                cursor,
                50,
              ]);
              for (const item of result.data || []) {
                const type = item?.data?.type;
                if (typeof type === 'string') rows.push(type);
              }
              if (!result.hasNextPage || !result.nextCursor) break;
              cursor = result.nextCursor;
            }
            return rows;
          }

          const typeStats = new Map();
          let cursor = 0;
          const concurrency = 5;
          async function worker() {
            while (cursor < wallets.length) {
              const index = cursor++;
              const types = await ownedTypes(wallets[index]);
              const unique = new Set(types);
              for (const type of types) {
                const current = typeStats.get(type) || { objects: 0, owners: 0 };
                current.objects += 1;
                typeStats.set(type, current);
              }
              for (const type of unique) typeStats.get(type).owners += 1;
              await new Promise((resolve) => setTimeout(resolve, 120));
            }
          }
          await Promise.all(Array.from({ length: concurrency }, () => worker()));

          const frameworkPrefixes = [
            '0x2::coin::Coin<',
            '0x2::kiosk::',
            '0x2::package::',
            '0x2::display::',
            '0x2::dynamic_field::',
            '0x2::transfer_policy::',
          ];
          const keyword = /(position|liquidity|pool|farm|stake|vault|lp_|_lp|receipt|locked)/i;
          const rows = [...typeStats.entries()].map(([type, stats]) => ({ type, ...stats }));
          const treeRelated = rows.filter((row) => row.type.includes(TREE));
          const candidate = rows.filter((row) => keyword.test(row.type) && !frameworkPrefixes.some((prefix) => row.type.startsWith(prefix)));
          const nonFramework = rows
            .filter((row) => !row.type.startsWith('0x2::') && !row.type.startsWith('0x1::'))
            .sort((a, b) => b.owners - a.owners || b.objects - a.objects)
            .slice(0, 80);

          console.log(JSON.stringify({
            walletsScanned: wallets.length,
            distinctObjectTypes: rows.length,
            treeRelatedTypes: treeRelated.sort((a, b) => b.owners - a.owners || b.objects - a.objects),
            keywordCandidateTypes: candidate.sort((a, b) => b.owners - a.owners || b.objects - a.objects),
            topNonFrameworkTypes: nonFramework,
          }, null, 2));
          JS
          node "$RUNNER_TEMP/probe-tree-exposure.mjs"

      - name: Remove temporary probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-tree-exposure-object-types.yml
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add .github/workflows/probe-tree-exposure-object-types.yml
          git commit -m "Record TREE exposure object-type discovery"
          git push origin HEAD:feature/leaderboard-exposure-v1
