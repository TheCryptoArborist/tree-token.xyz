name: Fix 360px Command Center overflow

on:
  push:
    branches:
      - feature/leaderboard-badges-v1
    paths:
      - '.github/workflows/fix-360-mobile-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-badges-v1
          fetch-depth: 0
      - name: Contain mobile ticker and remove hidden fallback geometry
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('dapp/styles.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* 360px overflow containment */'
          css = (
              '\n\n/* 360px overflow containment */\n'
              'html,body,.app-shell{max-width:100vw}\n'
              '.leaderboard-fallback-table{display:none!important;contain:strict!important;max-width:1px!important}\n'
              '@media(max-width:760px){\n'
              '  .market-ribbon{width:100%;max-width:100vw;min-width:0;gap:14px;padding-inline:10px;overscroll-behavior-inline:contain;scrollbar-width:none}\n'
              '  .market-ribbon::-webkit-scrollbar{display:none}\n'
              '  .market-ribbon>span{flex:0 0 auto}\n'
              '}\n'
          )
          if marker not in text:
              text += css
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-360-mobile-overflow.yml
          git diff --check
      - name: Validate build and existing safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          grep -q '360px overflow containment' dapp/styles.css
          grep -q 'leaderboard-fallback-table{display:none!important' dapp/styles.css
          grep -q 'DAPP_SWAP_EXECUTION_ENABLED = false' dapp/app.js
          git diff --check
      - name: Commit mobile containment fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Fix 360px Command Center overflow"
          git push origin HEAD:feature/leaderboard-badges-v1
