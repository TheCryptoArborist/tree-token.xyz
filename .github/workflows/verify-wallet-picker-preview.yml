name: Verify Slush wallet picker Deploy Preview

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/verify-wallet-picker-preview.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Verify selector, provider switching, and disconnect-forget
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const BASE = 'https://deploy-preview-8--tree-token.netlify.app';
          const QA_ADDRESS = `0x${'a'.repeat(64)}`;

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.CHROME,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const results = [];
            for (const viewport of [{ width: 1280, height: 900 }, { width: 390, height: 844 }, { width: 360, height: 800 }]) {
              const page = await browser.newPage();
              const errors = [];
              page.on('console', (message) => {
                const text = message.text();
                const expectedNetworkNoise = /metadata|api\.slush\.app|fullnode\.mainnet\.sui\.io|Failed to load resource/i.test(text);
                if (message.type() === 'error' && !expectedNetworkNoise) errors.push(`console:${text}`);
              });
              page.on('pageerror', (error) => errors.push(`pageerror:${error.message}`));
              await page.setViewport(viewport);
              await page.goto(`${BASE}/dapp/?wallet_preview_qa=2`, { waitUntil: 'networkidle2', timeout: 120000 });
              await page.waitForFunction(() => typeof window.openWalletManager === 'function', { timeout: 120000 });

              await page.evaluate(async (address) => {
                const { getWallets } = await import('https://esm.run/@mysten/wallet-standard@0.13.0');
                const account = {
                  address,
                  publicKey: new Uint8Array(32),
                  chains: ['sui:mainnet'],
                  features: ['sui:signAndExecuteTransaction'],
                };
                const listeners = new Set();
                const wallet = {
                  version: '1.0.0',
                  name: 'QA Phantom',
                  icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg"/>',
                  chains: ['sui:mainnet'],
                  accounts: [],
                  features: {
                    'standard:connect': {
                      version: '1.0.0',
                      connect: async () => {
                        wallet.accounts = [account];
                        for (const listener of listeners) listener({ accounts: [account] });
                        return { accounts: [account] };
                      },
                    },
                    'standard:disconnect': {
                      version: '1.0.0',
                      disconnect: async () => {
                        wallet.accounts = [];
                        for (const listener of listeners) listener({ accounts: [] });
                      },
                    },
                    'standard:events': {
                      version: '1.0.0',
                      on: (_event, listener) => {
                        listeners.add(listener);
                        return () => listeners.delete(listener);
                      },
                    },
                    'sui:signAndExecuteTransaction': {
                      version: '2.0.0',
                      signAndExecuteTransaction: async () => ({ digest: 'qa' }),
                    },
                  },
                };
                window.__qaUnregister = getWallets().register(wallet);
              }, QA_ADDRESS);

              await page.click('#dappWallet');
              await page.waitForSelector('#treeWalletDialog[open]', { timeout: 120000 });
              await page.click('[data-wallet-refresh]');
              await page.waitForFunction(() => [...document.querySelectorAll('.tree-wallet-option-copy strong')].some((node) => node.textContent === 'QA Phantom'), { timeout: 120000 });

              const disconnected = await page.evaluate(() => {
                const dialog = document.querySelector('#treeWalletDialog');
                const slush = document.querySelector('[data-slush-link]');
                const rect = dialog.getBoundingClientRect();
                return {
                  slushLabel: slush?.textContent?.trim() || '',
                  slushHref: slush?.href || '',
                  walletNames: [...document.querySelectorAll('.tree-wallet-option-copy strong')].map((node) => node.textContent.trim()),
                  playerAddress: window.playerAddress || null,
                  dialogWithinViewport: rect.left >= -1 && rect.right <= innerWidth + 1,
                  documentWidth: document.documentElement.scrollWidth,
                  viewportWidth: innerWidth,
                };
              });
              if (!/slush/i.test(disconnected.slushLabel)) throw new Error(`Slush option missing: ${JSON.stringify(disconnected)}`);
              if (!disconnected.slushHref.startsWith('https://my.slush.app/browse/https://deploy-preview-8--tree-token.netlify.app/dapp/')) throw new Error(`Slush link invalid: ${JSON.stringify(disconnected)}`);
              if (!disconnected.walletNames.includes('QA Phantom')) throw new Error(`Registered wallet missing: ${JSON.stringify(disconnected)}`);
              if (disconnected.playerAddress !== null) throw new Error('Chooser auto-connected a wallet.');
              if (!disconnected.dialogWithinViewport || disconnected.documentWidth > disconnected.viewportWidth + 1) throw new Error(`Disconnected dialog overflow: ${JSON.stringify(disconnected)}`);

              await page.evaluate(() => {
                const button = [...document.querySelectorAll('.tree-wallet-option')]
                  .find((node) => node.querySelector('.tree-wallet-option-copy strong')?.textContent === 'QA Phantom');
                button.click();
              });
              await page.waitForFunction((address) => window.playerAddress === address, { timeout: 120000 }, QA_ADDRESS);
              await page.waitForFunction(() => !document.querySelector('#treeWalletDialog')?.open, { timeout: 120000 });
              await page.click('#dappWallet');
              await page.waitForSelector('#treeWalletDialog[open]', { timeout: 120000 });

              const managed = await page.evaluate(() => ({
                title: document.querySelector('#treeWalletTitle')?.textContent?.trim(),
                current: document.querySelector('[data-wallet-current]')?.textContent?.trim(),
                switchVisible: !document.querySelector('[data-wallet-switch]')?.hidden,
                disconnectText: document.querySelector('[data-wallet-disconnect]')?.textContent?.trim(),
                playerAddress: window.playerAddress,
              }));
              if (managed.title !== 'Manage Wallet' || !managed.current.includes('QA Phantom') || managed.playerAddress !== QA_ADDRESS) throw new Error(`Manage state invalid: ${JSON.stringify(managed)}`);
              if (!managed.switchVisible || !/disconnect.*forget/i.test(managed.disconnectText)) throw new Error(`Manage controls missing: ${JSON.stringify(managed)}`);

              await page.click('[data-wallet-disconnect]');
              await page.waitForFunction(() => window.playerAddress === null, { timeout: 120000 });
              const cleared = await page.evaluate(() => ({
                playerAddress: window.playerAddress,
                currentWallet: window.currentWallet,
                oldAddress: sessionStorage.getItem('suiAddr'),
                newAddress: sessionStorage.getItem('tree:sui:address'),
                oldName: sessionStorage.getItem('suiName'),
                newName: sessionStorage.getItem('tree:sui:wallet-name'),
              }));
              if (Object.values(cleared).some((value) => value !== null)) throw new Error(`Disconnect did not forget site state: ${JSON.stringify(cleared)}`);
              if (errors.length) throw new Error(`Unexpected browser errors: ${JSON.stringify(errors)}`);

              results.push({ viewport, disconnected, managed, cleared });
              await page.close();
            }
            await browser.close();
            console.log(JSON.stringify({ classification: 'SLUSH_WALLET_PREVIEW_VALID', results }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
