name: Fix Turbos Move type canonicalization

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/fix-turbos-type-canonicalization.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Restrict address canonicalization to Move type address positions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('netlify/lib/turbos-tree-lp-provider.ts')
          text = path.read_text(encoding='utf-8')
          old = "  return compact.replace(/(0x)?[0-9a-f]+(?=::)/g, (address) => canonicalAddress(address));"
          new = "  return compact.replace(/(^|[<,])((?:0x)?[0-9a-f]+)(?=::)/g, (_match, prefix: string, address: string) => `${prefix}${canonicalAddress(address)}`);"
          if old not in text:
              raise SystemExit('Expected Turbos canonicalization line was not found.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-turbos-type-canonicalization.yml
          git diff --check

      - name: Build and run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do
            echo "Running $test"
            npx --yes tsx "$test"
          done
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Fix Turbos Move type canonicalization"
          git push origin HEAD:feature/leaderboard-exposure-v1
