name: Add TREE tier supply percentages

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/add-tier-supply-percentages.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0

      - name: Add supply-percentage context to tiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app_path = Path('dapp/app.js')
          app = app_path.read_text(encoding='utf-8')

          old_constants = """const TREE_BASE_UNITS = 10n ** BigInt(TREE_DECIMALS);
          const TIER_DEFINITIONS = ["""
          new_constants = """const TREE_BASE_UNITS = 10n ** BigInt(TREE_DECIMALS);
          const TREE_TOTAL_SUPPLY_RAW = 1_000_000_000n * TREE_BASE_UNITS;
          const TIER_DEFINITIONS = ["""
          if old_constants not in app:
              raise SystemExit('TREE tier constants anchor not found')
          app = app.replace(old_constants, new_constants, 1)

          compact_anchor = """function compactTree(value) {
            const numeric = Number(String(value ?? '').replace(/,/g, ''));
            if (!Number.isFinite(numeric)) return '—';
            return new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 }).format(numeric);
          }

          function tierForRaw(raw) {"""
          compact_replacement = """function compactTree(value) {
            const numeric = Number(String(value ?? '').replace(/,/g, ''));
            if (!Number.isFinite(numeric)) return '—';
            return new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 }).format(numeric);
          }

          function formatSupplyPercentFromRaw(raw, maximumFractionDigits = 5) {
            if (raw === null || raw === undefined) return '—';
            const value = BigInt(raw);
            const precision = 10n ** BigInt(maximumFractionDigits);
            const scaled = value * 100n * precision / TREE_TOTAL_SUPPLY_RAW;
            const whole = scaled / precision;
            const fraction = (scaled % precision).toString().padStart(maximumFractionDigits, '0').replace(/0+$/, '');
            return `${whole}${fraction ? `.${fraction}` : ''}%`;
          }

          function tierThresholdLabel(tier) {
            if (tier.topRank) return `Top ${tier.topRank}`;
            if (tier.minimumRaw === 0n) return 'Under 10K TREE';
            return `${tier.qualification} TREE`;
          }

          function tierSupplyShareLabel(tier) {
            if (tier.topRank) {
              const cutoffEntry = rankCutoff(tier.topRank);
              const cutoffRaw = parseTreeRaw(cutoffEntry);
              return cutoffRaw === null
                ? 'Top 5 · cutoff updates with each verified snapshot'
                : `Current #${tier.topRank} cutoff: ${compactTree(cutoffEntry.directTree)} TREE · ${formatSupplyPercentFromRaw(cutoffRaw)} of supply`;
            }
            if (tier.minimumRaw === 0n) return 'Below 0.001% of the 1B supply';
            return `${formatSupplyPercentFromRaw(tier.minimumRaw)}+ of the 1B supply`;
          }

          function tierForRaw(raw) {"""
          if compact_anchor not in app:
              raise SystemExit('compactTree anchor not found')
          app = app.replace(compact_anchor, compact_replacement, 1)

          old_render = """    const range = document.createElement('div'); range.className = 'tier-range'; range.textContent = tier.topRank ? 'Highest verified tier' : 'Direct TREE threshold';
              identity.append(name, range);
              const cutoff = document.createElement('div'); cutoff.className = 'tier-cutoff'; cutoff.textContent = tier.topRank ? `Top ${tier.topRank}` : `${tier.qualification} TREE`;"""
          new_render = """    const range = document.createElement('div'); range.className = 'tier-range'; range.textContent = tierSupplyShareLabel(tier);
              identity.append(name, range);
              const cutoff = document.createElement('div'); cutoff.className = 'tier-cutoff'; cutoff.textContent = tierThresholdLabel(tier);"""
          if old_render not in app:
              raise SystemExit('tier ladder render anchor not found')
          app = app.replace(old_render, new_render, 1)

          old_export = "export { DAPP_SWAP_EXECUTION_ENABLED, TIER_DEFINITIONS, formatTreePrice, readDashboardCache, renderLeaderboard, tierForEntry, updateYourRank, writeDashboardCache };"
          new_export = "export { DAPP_SWAP_EXECUTION_ENABLED, TIER_DEFINITIONS, formatSupplyPercentFromRaw, formatTreePrice, readDashboardCache, renderLeaderboard, tierForEntry, updateYourRank, writeDashboardCache };"
          if old_export not in app:
              raise SystemExit('app export anchor not found')
          app = app.replace(old_export, new_export, 1)
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('dapp/index.html')
          html = index_path.read_text(encoding='utf-8')
          old_card = '<article class="tier-ladder-card"><div class="card-title-row"><div><span class="rank-kicker">TIER LADDER</span><h3>Climb the Canopy</h3></div><span>Cutoffs update with every verified snapshot.</span></div><div class="tier-ladder" id="tierLadder"><p class="muted">Loading verified tier cutoffs…</p></div></article>'
          new_card = '<article class="tier-ladder-card"><div class="card-title-row"><div><span class="rank-kicker">TIER LADDER</span><h3>Climb the Canopy</h3></div><span>Thresholds map to TREE\'s fixed 1B supply.</span></div><div class="tier-ladder" id="tierLadder"><p class="muted">Loading verified tier cutoffs…</p></div><p class="tier-method-note">Each tier displays both its TREE requirement and its share of the fixed 1,000,000,000-token supply. Champion Tree is reserved for the Top 5. This preview still uses direct address-owned TREE; verified LP exposure will be added separately.</p></article>'
          if old_card not in html:
              raise SystemExit('tier ladder card anchor not found')
          html = html.replace(old_card, new_card, 1)
          index_path.write_text(html, encoding='utf-8')

          styles_path = Path('dapp/styles.css')
          styles = styles_path.read_text(encoding='utf-8').rstrip()
          styles += """

          /* Tier supply calibration */
          .tier-row .tier-range{margin-top:2px;white-space:normal;line-height:1.35;color:var(--muted)}
          .tier-method-note{margin:13px 2px 0;padding:10px 12px;border-left:3px solid var(--cyan);border-radius:0 9px 9px 0;background:rgba(53,200,255,.045);color:var(--muted);font-size:.76rem;line-height:1.55}
          @media(max-width:760px){.tier-row{align-items:start}.tier-row .tier-range{display:block}}
          """
          styles_path.write_text(styles, encoding='utf-8')

          test_path = Path('tests/leaderboard-ui-state.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          old_import = "const { TIER_DEFINITIONS, renderLeaderboard, tierForEntry } = await import('../dapp/app.js');"
          new_import = "const { TIER_DEFINITIONS, formatSupplyPercentFromRaw, renderLeaderboard, tierForEntry } = await import('../dapp/app.js');"
          if old_import not in test:
              raise SystemExit('tier test import anchor not found')
          test = test.replace(old_import, new_import, 1)
          tier_case_anchor = "tierCases.forEach(([directTree, expected]) => assert.equal(tierForEntry({ rank: 6, directTree }).name, expected));\n"
          tier_percent_tests = """tierCases.forEach(([directTree, expected]) => assert.equal(tierForEntry({ rank: 6, directTree }).name, expected));
          assert.equal(formatSupplyPercentFromRaw(50_000_000n * 1_000_000n), '5%');
          assert.equal(formatSupplyPercentFromRaw(25_000_000n * 1_000_000n), '2.5%');
          assert.equal(formatSupplyPercentFromRaw(2_500_000n * 1_000_000n), '0.25%');
          assert.equal(formatSupplyPercentFromRaw(250_000n * 1_000_000n), '0.025%');
          assert.equal(formatSupplyPercentFromRaw(10_000n * 1_000_000n), '0.001%');
          """
          if tier_case_anchor not in test:
              raise SystemExit('tier percent test anchor not found')
          test = test.replace(tier_case_anchor, tier_percent_tests, 1)
          markup_anchor = "assert.equal(dappMarkup.includes('Unique excluded protocol/system owners'), true);\n"
          markup_new = """assert.equal(dappMarkup.includes('Unique excluded protocol/system owners'), true);
          assert.equal(dappMarkup.includes('fixed 1,000,000,000-token supply'), true);
          assert.equal(dappMarkup.includes('verified LP exposure will be added separately'), true);
          """
          if markup_anchor not in test:
              raise SystemExit('tier markup test anchor not found')
          test = test.replace(markup_anchor, markup_new, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          rm -f .github/workflows/add-tier-supply-percentages.yml

      - name: Validate tier supply calibration
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          git diff --check
          python - <<'PY'
          from pathlib import Path
          app = Path('dapp/app.js').read_text(encoding='utf-8')
          html = Path('dapp/index.html').read_text(encoding='utf-8')
          css = Path('dapp/styles.css').read_text(encoding='utf-8')
          assert 'TREE_TOTAL_SUPPLY_RAW = 1_000_000_000n * TREE_BASE_UNITS' in app
          assert 'formatSupplyPercentFromRaw' in app
          assert '5%+ of the 1B supply' not in app
          assert 'tierSupplyShareLabel' in app
          assert 'fixed 1,000,000,000-token supply' in html
          assert 'verified LP exposure will be added separately' in html
          assert '.tier-method-note{' in css
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          assert 'scripts/swap.js' not in html
          PY

      - name: Commit tier supply calibration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add dapp/app.js dapp/index.html dapp/styles.css tests/leaderboard-ui-state.test.mjs .github/workflows/add-tier-supply-percentages.yml
          git commit -m "Show TREE tier thresholds as supply percentages"
          git push origin HEAD:feature/command-center-ui-v2
