name: Apply Command Center UI V2

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/command-center-ui-v2-bootstrap.yml'
      - '.ui-v2/**'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0

      - name: Reconstruct UI payload
        shell: bash
        run: |
          set -euo pipefail
          cat .ui-v2/payload-*.b64 | base64 --decode > /tmp/tree-command-center-ui-v2.tar.gz
          tar -xzf /tmp/tree-command-center-ui-v2.tar.gz
          python -m py_compile .ui-v2/apply.py

      - name: Apply UI V2
        shell: bash
        run: |
          set -euo pipefail
          python .ui-v2/apply.py
          rm -f .ui-v2/payload-*.b64
          rmdir .ui-v2 2>/dev/null || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Validate JavaScript and tests
        shell: bash
        run: |
          set -euo pipefail
          node --check dapp/app.js
          node --check scripts/profile-studio.js
          node --check scripts/canopy-draw.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do
            npx --yes tsx "$test"
          done
          git diff --check

      - name: Validate UI structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          homepage = Path('index.html').read_text(encoding='utf-8')
          dapp = Path('dapp/index.html').read_text(encoding='utf-8')
          app = Path('dapp/app.js').read_text(encoding='utf-8')

          ids = re.findall(r'\bid="([^"]+)"', dapp)
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          assert not duplicates, f'duplicate DApp IDs: {duplicates}'

          assert 'Open Command Center' in homepage
          assert 'href="/dapp/"' in homepage
          assert 'command-center-preview' in homepage
          assert 'YOUR CANOPY RANK' in dapp
          assert 'TIER LADDER' in dapp
          assert 'TOP 50' in dapp
          assert 'leaderboardCards' in dapp
          assert 'shareRank' in dapp
          assert 'downloadRankCard' in app
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          assert 'scripts/swap.js' not in dapp
          PY

      - name: Commit UI V2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Redesign TREE Command Center experience"
          git push origin HEAD:feature/command-center-ui-v2
