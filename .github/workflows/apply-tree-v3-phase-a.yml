name: Apply native TREE V3 Phase A

on:
  push:
    branches:
      - feature/tree-native-v3-v1
    paths:
      - '.github/workflows/apply-tree-v3-phase-a.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-native-v3-v1
          fetch-depth: 0

      - name: Finish the native V3 workspace and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          html_path = Path('dapp/index.html')
          html = html_path.read_text(encoding='utf-8')
          script = '  <script type="module" src="v3-workspace.js"></script>\n'
          if script.strip() not in html:
              marker = '  <script type="module" src="panel-router.js"></script>\n'
              if marker not in html:
                  raise SystemExit('Could not locate panel-router script marker.')
              html = html.replace(marker, script + marker, 1)
          html_path.write_text(html, encoding='utf-8')

          source_path = Path('dapp/v3-workspace.js')
          source = source_path.read_text(encoding='utf-8')

          old = """function formatUsd(value) {
            const numeric = Number(value);
            if (!Number.isFinite(numeric)) return 'Not verified';
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: numeric >= 100000 ? 'compact' : 'standard', maximumFractionDigits: numeric >= 1000 ? 1 : 2 }).format(numeric);
          }
          """.replace('          ', '')
          new = """function formatUsd(value) {
            if (value === null || value === undefined || value === '') return 'Not verified';
            const numeric = Number(value);
            if (!Number.isFinite(numeric)) return 'Not verified';
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: numeric >= 100000 ? 'compact' : 'standard', maximumFractionDigits: numeric >= 1000 ? 1 : 2 }).format(numeric);
          }
          """.replace('          ', '')
          if old not in source:
              raise SystemExit('Could not locate formatUsd implementation.')
          source = source.replace(old, new, 1)

          old = """function resolveWalletAddress() {
            const preferred = ['treeWallet', 'treeWalletManager', 'TREEWallet', 'walletManager', 'suiWalletManager'];
          """.replace('          ', '')
          new = """function resolveWalletAddress() {
            const direct = safeAddress(window.playerAddress) || addressFromCandidate(window.currentAccount);
            if (direct) return direct;
            const preferred = ['treeWallet', 'treeWalletManager', 'TREEWallet', 'walletManager', 'suiWalletManager'];
          """.replace('          ', '')
          if old not in source:
              raise SystemExit('Could not locate resolveWalletAddress implementation.')
          source = source.replace(old, new, 1)

          old = "document.getElementById('v3PoolApr').textContent = Number.isFinite(Number(analytics.aprPercent)) ? `${Number(analytics.aprPercent).toFixed(1)}%` : 'Not verified';"
          new = "document.getElementById('v3PoolApr').textContent = analytics.aprPercent !== null && analytics.aprPercent !== undefined && analytics.aprPercent !== '' && Number.isFinite(Number(analytics.aprPercent)) ? `${Number(analytics.aprPercent).toFixed(1)}%` : 'Not verified';"
          if old not in source:
              raise SystemExit('Could not locate APR rendering.')
          source = source.replace(old, new, 1)

          old = "for (const eventName of ['tree-wallet-change', 'tree:wallet-change', 'wallet-change', 'wallet:change', 'sui-wallet-change', 'walletConnected', 'walletDisconnected']) {"
          new = "for (const eventName of ['tree:wallet-changed', 'tree-wallet-change', 'tree:wallet-change', 'wallet-change', 'wallet:change', 'sui-wallet-change', 'walletConnected', 'walletDisconnected']) {"
          if old not in source:
              raise SystemExit('Could not locate wallet event list.')
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/v3-workspace-source.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          marker = "assert.ok(css.includes('.v3-tabs'));\n"
          additions = (
              "assert.ok(source.includes('window.playerAddress'));\n"
              "assert.ok(source.includes(\"'tree:wallet-changed'\"));\n"
              "assert.ok(source.includes(\"value === null || value === undefined || value === ''\"));\n"
          )
          if additions not in test:
              if marker not in test:
                  raise SystemExit('Could not locate V3 source test marker.')
              test = test.replace(marker, additions + marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          rm -f .github/workflows/inspect-suidex-v3-chain.yml
          rm -f .github/workflows/inspect-suidex-v3-interface.yml
          rm -f .github/workflows/apply-tree-v3-phase-a.yml

      - name: Validate build, functions, source, and existing safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/v3-workspace.js
          node tests/v3-workspace-source.test.mjs
          node tests/v3-workspace-html-load.test.mjs
          npx --yes tsx tests/tree-v3-overview.test.ts
          npx --yes esbuild netlify/functions/tree-v3-overview.ts --bundle --platform=node --format=esm --outfile=/tmp/tree-v3-overview.mjs
          for test in tests/*.test.mjs; do node "$test"; done
          for test in tests/*.test.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          html = Path('dapp/index.html').read_text(encoding='utf-8')
          source = Path('dapp/v3-workspace.js').read_text(encoding='utf-8')
          assert html.count('src="v3-workspace.js"') == 1
          assert Path('dapp/v3-workspace.css').exists()
          assert Path('dapp/v3-workspace.js').exists()
          assert Path('netlify/functions/tree-v3-overview.ts').exists()
          assert not Path('.github/workflows/inspect-suidex-v3-chain.yml').exists()
          assert not Path('.github/workflows/inspect-suidex-v3-interface.yml').exists()
          assert not Path('.github/workflows/apply-tree-v3-phase-a.yml').exists()
          assert 'tree:wallet-changed' in source
          assert 'window.playerAddress' in source
          assert Path('dapp/swap-router.js').exists()
          PY
          git diff --check

      - name: Commit the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Finish native read-only TREE V3 workspace"
          git push origin HEAD:feature/tree-native-v3-v1
