name: Expand TREE leaderboard tier ladder

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/expand-tree-tier-ladder.yml'

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0

      - name: Apply expanded TREE tier system
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('dapp/app.js')
          app = app_path.read_text(encoding='utf-8')

          tier_pattern = re.compile(r"const TIER_DEFINITIONS = \[\n.*?\n\];", re.S)
          if len(tier_pattern.findall(app)) != 1:
              raise SystemExit('Expected one TIER_DEFINITIONS block.')
          new_tiers = """const TREE_BASE_UNITS = 10n ** BigInt(TREE_DECIMALS);
          const TIER_DEFINITIONS = [
            { name: 'Champion Tree', icon: '🏆', css: 'tier-champion', topRank: 5, minimumRaw: null, qualification: 'Top 5' },
            { name: 'Ancient Grove', icon: '🏛️', css: 'tier-ancient', minimumRaw: 50_000_000n * TREE_BASE_UNITS, qualification: '50M+' },
            { name: 'Redwood Royalty', icon: '👑', css: 'tier-redwood', minimumRaw: 25_000_000n * TREE_BASE_UNITS, qualification: '25M+' },
            { name: 'Giant Sequoia', icon: '🌲', css: 'tier-sequoia', minimumRaw: 10_000_000n * TREE_BASE_UNITS, qualification: '10M+' },
            { name: 'Forest Titan', icon: '💪', css: 'tier-titan', minimumRaw: 5_000_000n * TREE_BASE_UNITS, qualification: '5M+' },
            { name: 'Canopy Guardian', icon: '🛡️', css: 'tier-guardian', minimumRaw: 2_500_000n * TREE_BASE_UNITS, qualification: '2.5M+' },
            { name: 'Heritage Oak', icon: '🌳', css: 'tier-heritage', minimumRaw: 1_000_000n * TREE_BASE_UNITS, qualification: '1M+' },
            { name: 'Forest Keeper', icon: '🍃', css: 'tier-keeper', minimumRaw: 500_000n * TREE_BASE_UNITS, qualification: '500K+' },
            { name: 'TREE-mendous', icon: '⚡', css: 'tier-tremendous', minimumRaw: 250_000n * TREE_BASE_UNITS, qualification: '250K+' },
            { name: 'Branch Manager', icon: '💼', css: 'tier-branch', minimumRaw: 100_000n * TREE_BASE_UNITS, qualification: '100K+' },
            { name: 'Deep Roots', icon: '🪵', css: 'tier-roots', minimumRaw: 50_000n * TREE_BASE_UNITS, qualification: '50K+' },
            { name: 'Sapling', icon: '🌱', css: 'tier-sapling', minimumRaw: 10_000n * TREE_BASE_UNITS, qualification: '10K+' },
            { name: 'Seedling', icon: '🌰', css: 'tier-seedling', minimumRaw: 0n, qualification: '0+' },
          ];"""
          app = tier_pattern.sub(new_tiers, app, count=1)

          helper_pattern = re.compile(r"function tierForEntry\(entry\) \{.*?\n\}\n\nfunction currentLeaderboardRow", re.S)
          if len(helper_pattern.findall(app)) != 1:
              raise SystemExit('tierForEntry helper block was not found exactly once.')
          new_helpers = """function tierForRaw(raw) {
            if (raw === null || raw === undefined) return null;
            const value = BigInt(raw);
            return TIER_DEFINITIONS.slice(1).find((tier) => value >= tier.minimumRaw) || TIER_DEFINITIONS.at(-1);
          }

          function tierForEntry(entry) {
            const rank = Number(entry?.rank);
            const champion = TIER_DEFINITIONS[0];
            if (Number.isInteger(rank) && rank >= 1 && rank <= champion.topRank) return champion;
            return tierForRaw(parseTreeRaw(entry));
          }

          function membersForTier(tier) {
            return leaderboardEntries.filter((entry) => tierForEntry(entry)?.name === tier.name);
          }

          function nextTierFor(tier) {
            const index = TIER_DEFINITIONS.indexOf(tier);
            return index > 0 ? TIER_DEFINITIONS[index - 1] : null;
          }

          function currentLeaderboardRow"""
          app = helper_pattern.sub(new_helpers, app, count=1)

          rank_block_pattern = re.compile(r"  if \(row\) \{\n.*?\n    return;\n  \}\n\n  const cutoff = rankCutoff\(50\);", re.S)
          if len(rank_block_pattern.findall(app)) != 1:
              raise SystemExit('Rank detail block was not found exactly once.')
          new_rank_block = """  if (row) {
            const tier = tierForEntry(row);
            const currentRaw = parseTreeRaw(row);
            const nextTier = nextTierFor(tier);
            setText('rankTierIcon', tier?.icon || '🌿'); setText('rankTierName', tier?.name || row.tier || 'Ranked'); setText('rankPosition', `#${row.rank}`);
            setText('rankDirectTree', `${row.directTree} TREE`); setText('rankSupplyPercent', `${row.supplyPercent ?? '—'}% of total supply · ${row.coinObjectCount ?? '—'} Coin<TREE> objects`);
            if (!nextTier) {
              setText('rankNextTier', 'Champion Tree'); setText('rankNextRequirement', 'Highest TREE leaderboard tier reached.');
              const progress = elementById('rankProgressBar'); if (progress?.style) progress.style.width = '100%';
            } else {
              const targetEntry = nextTier.topRank ? rankCutoff(nextTier.topRank) : null;
              const targetRaw = nextTier.topRank ? parseTreeRaw(targetEntry) : nextTier.minimumRaw;
              let need = 0n;
              if (currentRaw !== null && targetRaw !== null) {
                need = nextTier.topRank
                  ? (targetRaw >= currentRaw ? targetRaw - currentRaw + 1n : 0n)
                  : (targetRaw > currentRaw ? targetRaw - currentRaw : 0n);
              }
              setText('rankNextTier', nextTier.name);
              const requirement = nextTier.topRank
                ? (need > 0n ? `Need ${formatTreeRaw(need)} more TREE to reach the current Champion Tree cutoff.` : 'Current balance meets the Champion Tree cutoff.')
                : (need > 0n ? `Need ${formatTreeRaw(need)} more TREE to reach the ${nextTier.qualification} TREE threshold.` : `Current balance meets the ${nextTier.name} threshold.`);
              setText('rankNextRequirement', requirement);
              const progress = elementById('rankProgressBar'); if (progress?.style) progress.style.width = `${percentageToward(currentRaw, targetRaw)}%`;
            }
            return;
          }

          const cutoff = rankCutoff(50);"""
          app = rank_block_pattern.sub(new_rank_block, app, count=1)

          app = app.replace(
              "setText('rankNextTier', 'Forest Keeper'); setText('rankNextRequirement', 'Connect a wallet to calculate progress.');",
              "setText('rankNextTier', 'Seedling'); setText('rankNextRequirement', 'Connect a wallet to calculate progress.');",
              1,
          )
          app = app.replace(
              "setText('rankNextTier', 'Forest Keeper');\n  if (connectedTreeBalanceRaw !== null && cutoffRaw !== null)",
              "setText('rankNextTier', 'Top 50 Entry');\n  if (connectedTreeBalanceRaw !== null && cutoffRaw !== null)",
              1,
          )

          ladder_pattern = re.compile(r"function renderTierLadder\(\) \{.*?\n\}\n\nfunction renderLeaderboardCards", re.S)
          if len(ladder_pattern.findall(app)) != 1:
              raise SystemExit('renderTierLadder block was not found exactly once.')
          new_ladder = """function renderTierLadder() {
            const container = elementById('tierLadder');
            if (!container?.replaceChildren) return;
            const currentTier = tierForEntry(currentLeaderboardRow());
            if (!leaderboardEntries.length) {
              const empty = document.createElement('p'); empty.className = 'muted'; empty.textContent = 'Tier counts appear after a complete verified snapshot.'; container.replaceChildren(empty); return;
            }
            const rows = TIER_DEFINITIONS.map((tier) => {
              const members = membersForTier(tier);
              const row = document.createElement('div'); row.className = `tier-row ${tier.css}${currentTier?.name === tier.name ? ' current' : ''}`;
              const icon = document.createElement('span'); icon.className = 'tier-icon'; icon.textContent = tier.icon;
              const identity = document.createElement('div');
              const name = document.createElement('div'); name.className = 'tier-name'; name.textContent = tier.name;
              const range = document.createElement('div'); range.className = 'tier-range'; range.textContent = tier.topRank ? 'Highest verified tier' : 'Direct TREE threshold';
              identity.append(name, range);
              const cutoff = document.createElement('div'); cutoff.className = 'tier-cutoff'; cutoff.textContent = tier.topRank ? `Top ${tier.topRank}` : `${tier.qualification} TREE`;
              const count = document.createElement('div'); count.className = 'tier-count'; count.textContent = String(members.length); count.title = `${members.length} displayed owner${members.length === 1 ? '' : 's'} in this tier`;
              row.append(icon, identity, cutoff, count); return row;
            });
            container.replaceChildren(...rows);
          }

          function renderLeaderboardCards"""
          app = ladder_pattern.sub(new_ladder, app, count=1)

          old_card_tier = """    const tier = document.createElement('div'); tier.className = 'leader-tier'; tier.textContent = `${tierForEntry(entry)?.icon || '🌿'} ${entry.tier}`;
              identity.append(walletLine, tier);"""
          new_card_tier = """    const tierDefinition = tierForEntry(entry);
              const tier = document.createElement('div'); tier.className = `leader-tier ${tierDefinition?.css || ''}`.trim(); tier.textContent = `${tierDefinition?.icon || '🌿'} ${tierDefinition?.name || entry.tier || 'Ranked'}`;
              identity.append(walletLine, tier);"""
          if old_card_tier not in app:
              raise SystemExit('Leaderboard card tier block was not found.')
          app = app.replace(old_card_tier, new_card_tier, 1)

          share_pattern = re.compile(r"function rankShareText\(\) \{.*?\n\}", re.S)
          if len(share_pattern.findall(app)) != 1:
              raise SystemExit('rankShareText block was not found exactly once.')
          new_share = """function rankShareText() {
            const row = currentLeaderboardRow();
            if (!row) return 'I’m checking the verified TREE Canopy Leaderboard on the TREE Command Center. https://tree-token.xyz/dapp/#leaderboard';
            const tier = tierForEntry(row)?.name || row.tier || 'Ranked';
            return `I’m #${row.rank} on the verified TREE Canopy Leaderboard — ${tier} with ${row.directTree} direct TREE. https://tree-token.xyz/dapp/#leaderboard`;
          }"""
          app = share_pattern.sub(new_share, app, count=1)

          old_card_line = "ctx.fillText(row.tier.toUpperCase(), 90, 540);"
          new_card_line = "ctx.fillText((tierForEntry(row)?.name || row.tier || 'Ranked').toUpperCase(), 90, 540);"
          if old_card_line not in app:
              raise SystemExit('Rank-card tier line was not found.')
          app = app.replace(old_card_line, new_card_line, 1)

          update_pattern = re.compile(r"  const row = currentLeaderboardRow\(\);\n  if \(!row\) \{ output\.textContent = 'Wallet is outside the displayed Top 50\.'; renderRankDetail\(null\); return; \}\n  output\.textContent = leaderboardStatus === 'stale'\n    \? `#\$\{row\.rank\} · \$\{row\.tier\} · Last verified snapshot`\n    : `#\$\{row\.rank\} · \$\{row\.tier\}`;", re.S)
          if len(update_pattern.findall(app)) != 1:
              raise SystemExit('updateYourRank tier output block was not found exactly once.')
          new_update = """  const row = currentLeaderboardRow();
            if (!row) { output.textContent = 'Wallet is outside the displayed Top 50.'; renderRankDetail(null); return; }
            const tier = tierForEntry(row)?.name || row.tier || 'Ranked';
            output.textContent = leaderboardStatus === 'stale'
              ? `#${row.rank} · ${tier} · Last verified snapshot`
              : `#${row.rank} · ${tier}`;"""
          app = update_pattern.sub(new_update, app, count=1)

          old_fallback = "[entry.rank, shortened(entry.wallet), entry.directTree, entry.supplyPercent === null || entry.supplyPercent === undefined ? '—' : `${entry.supplyPercent}%`, entry.tier]"
          new_fallback = "[entry.rank, shortened(entry.wallet), entry.directTree, entry.supplyPercent === null || entry.supplyPercent === undefined ? '—' : `${entry.supplyPercent}%`, tierForEntry(entry)?.name || entry.tier || 'Ranked']"
          if old_fallback not in app:
              raise SystemExit('Fallback leaderboard tier column was not found.')
          app = app.replace(old_fallback, new_fallback, 1)

          old_export = "export { DAPP_SWAP_EXECUTION_ENABLED, formatTreePrice, readDashboardCache, renderLeaderboard, updateYourRank, writeDashboardCache };"
          new_export = "export { DAPP_SWAP_EXECUTION_ENABLED, TIER_DEFINITIONS, formatTreePrice, readDashboardCache, renderLeaderboard, tierForEntry, updateYourRank, writeDashboardCache };"
          if old_export not in app:
              raise SystemExit('DApp export block was not found.')
          app = app.replace(old_export, new_export, 1)
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('dapp/index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('<strong id="rankNextTier">Forest Keeper</strong>', '<strong id="rankNextTier">Seedling</strong>', 1)
          index = index.replace('Cutoffs update with every verified snapshot.', 'Direct-TREE thresholds; counts update with every verified snapshot.', 1)
          index_path.write_text(index, encoding='utf-8')

          css_path = Path('dapp/styles.css')
          css = css_path.read_text(encoding='utf-8')
          old_count = ".tier-row .tier-range,.tier-row .tier-count{color:var(--muted);font:.72rem var(--mono)}.tier-row .tier-cutoff{color:var(--gold);font:800 .78rem var(--mono);text-align:right}"
          new_count = ".tier-row .tier-range{color:var(--muted);font:.72rem var(--mono)}.tier-row .tier-count{display:grid;place-items:center;min-width:27px;height:24px;padding:0 7px;border-radius:7px;background:rgba(53,200,255,.13);color:var(--cyan);font:850 .72rem var(--mono)}.tier-row .tier-cutoff{color:var(--gold);font:800 .78rem var(--mono);text-align:right}"
          if old_count not in css:
              raise SystemExit('Tier count CSS block was not found.')
          css = css.replace(old_count, new_count, 1)

          old_colors = ".tier-ancient .tier-name{color:#ffe981}.tier-sequoia .tier-name{color:#ffb86b}.tier-heritage .tier-name{color:#d4a9ff}.tier-guardian .tier-name{color:#76dcff}.tier-keeper .tier-name{color:#68f4a3}"
          new_colors = ".tier-champion .tier-name,.leader-tier.tier-champion{color:#ffe981}.tier-ancient .tier-name,.leader-tier.tier-ancient{color:#ffd36e}.tier-redwood .tier-name,.leader-tier.tier-redwood{color:#ff8f78}.tier-sequoia .tier-name,.leader-tier.tier-sequoia{color:#ffb86b}.tier-titan .tier-name,.leader-tier.tier-titan{color:#c89cff}.tier-guardian .tier-name,.leader-tier.tier-guardian{color:#76dcff}.tier-heritage .tier-name,.leader-tier.tier-heritage{color:#d9a66d}.tier-keeper .tier-name,.leader-tier.tier-keeper{color:#68f4a3}.tier-tremendous .tier-name,.leader-tier.tier-tremendous{color:#b9ff5c}.tier-branch .tier-name,.leader-tier.tier-branch{color:#67e6cf}.tier-roots .tier-name,.leader-tier.tier-roots{color:#e5ad65}.tier-sapling .tier-name,.leader-tier.tier-sapling{color:#8df2a9}.tier-seedling .tier-name,.leader-tier.tier-seedling{color:#9fb4a7}"
          if old_colors not in css:
              raise SystemExit('Existing tier color CSS block was not found.')
          css = css.replace(old_colors, new_colors, 1)

          old_leader_tier = ".leader-tier{margin-top:3px;color:var(--muted);font:.68rem var(--mono);text-transform:uppercase;letter-spacing:.06em}"
          new_leader_tier = ".leader-tier{display:inline-flex;align-items:center;width:max-content;max-width:100%;margin-top:5px;padding:3px 7px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(255,255,255,.035);color:var(--muted);font:750 .66rem var(--mono);text-transform:uppercase;letter-spacing:.055em;white-space:normal}"
          if old_leader_tier not in css:
              raise SystemExit('Leaderboard tier CSS block was not found.')
          css = css.replace(old_leader_tier, new_leader_tier, 1)
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/leaderboard-ui-state.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace("const { renderLeaderboard } = await import('../dapp/app.js');", "const { TIER_DEFINITIONS, renderLeaderboard, tierForEntry } = await import('../dapp/app.js');", 1)
          test = test.replace("assert.equal(element('yourRank').textContent, '#1 · Ancient Grove · Last verified snapshot');", "assert.equal(element('yourRank').textContent, '#1 · Champion Tree · Last verified snapshot');", 1)
          test = test.replace("assert.equal(element('yourRank').textContent, '#1 · Ancient Grove');", "assert.equal(element('yourRank').textContent, '#1 · Champion Tree');", 1)
          test_anchor = "const fixtureEntry = { rank: 1, wallet: window.playerAddress, directTree: '1234.56789', supplyPercent: '0.000123456', tier: 'Ancient Grove' };\n"
          if test_anchor not in test:
              raise SystemExit('Leaderboard fixture anchor was not found.')
          tier_tests = """
          assert.equal(TIER_DEFINITIONS.length, 13);
          assert.equal(tierForEntry({ rank: 1, directTree: '1' }).name, 'Champion Tree');
          const tierCases = [
            ['50000000', 'Ancient Grove'], ['25000000', 'Redwood Royalty'], ['10000000', 'Giant Sequoia'],
            ['5000000', 'Forest Titan'], ['2500000', 'Canopy Guardian'], ['1000000', 'Heritage Oak'],
            ['500000', 'Forest Keeper'], ['250000', 'TREE-mendous'], ['100000', 'Branch Manager'],
            ['50000', 'Deep Roots'], ['10000', 'Sapling'], ['0', 'Seedling'],
          ];
          tierCases.forEach(([directTree, expected]) => assert.equal(tierForEntry({ rank: 6, directTree }).name, expected));
          """
          test = test.replace(test_anchor, test_anchor + tier_tests, 1)
          test_path.write_text(test, encoding='utf-8')

          Path('.github/workflows/expand-tree-tier-ladder.yml').unlink()
          PY

      - name: Validate expanded tier ladder
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          git diff --check
          python - <<'PY'
          from pathlib import Path
          app = Path('dapp/app.js').read_text(encoding='utf-8')
          css = Path('dapp/styles.css').read_text(encoding='utf-8')
          markup = Path('dapp/index.html').read_text(encoding='utf-8')
          expected = ['Champion Tree','Ancient Grove','Redwood Royalty','Giant Sequoia','Forest Titan','Canopy Guardian','Heritage Oak','Forest Keeper','TREE-mendous','Branch Manager','Deep Roots','Sapling','Seedling']
          for name in expected:
              assert name in app, name
          assert 'World Tree' not in app
          assert 'const TREE_BASE_UNITS' in app
          assert 'tierForEntry' in app
          assert 'tier-champion' in css and 'tier-seedling' in css
          assert 'Direct-TREE thresholds; counts update with every verified snapshot.' in markup
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          assert 'scripts/swap.js' not in markup
          assert not Path('.github/workflows/expand-tree-tier-ladder.yml').exists()
          PY

      - name: Commit expanded tier ladder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Expand TREE leaderboard tier ladder"
          git push origin HEAD:feature/command-center-ui-v2
