name: Verify simplified TREE homepage Deploy Preview

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/verify-simple-tree-homepage-preview.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Verify published simplified homepage
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const BASE = 'https://deploy-preview-9--tree-token.netlify.app';
          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const results = [];
            for (const viewport of [{ width: 1440, height: 1000 }, { width: 390, height: 844 }, { width: 360, height: 800 }]) {
              const page = await browser.newPage();
              const errors = [];
              page.on('console', (message) => {
                const text = message.text();
                const expected = /api\.slush\.app|metadata|Failed to load resource/i.test(text);
                if (message.type() === 'error' && !expected) errors.push(text);
              });
              page.on('pageerror', (error) => errors.push(`pageerror:${error.message}`));
              await page.setViewport(viewport);
              await page.goto(`${BASE}/?simple_preview=1`, { waitUntil: 'networkidle2', timeout: 120000 });
              await page.waitForSelector('html.home-simple', { timeout: 120000 });
              await page.waitForFunction(() => document.querySelector('[data-home-market="price"]')?.textContent?.startsWith('$'), { timeout: 120000 });
              const state = await page.evaluate(() => ({
                nav: [...document.querySelectorAll('.simple-site-nav a')].map((node) => ({ label: node.textContent.trim(), href: node.getAttribute('href') })),
                heroTitle: document.querySelector('.simple-hero h1')?.textContent?.trim(),
                mainSections: document.querySelectorAll('main > section').length,
                stats: document.querySelectorAll('.simple-stat-strip article').length,
                utilities: document.querySelectorAll('.simple-live-row a').length,
                price: document.querySelector('[data-home-market="price"]')?.textContent,
                marketCap: document.querySelector('[data-home-market="marketCap"]')?.textContent,
                liquidity: document.querySelector('[data-home-market="liquidity"]')?.textContent,
                oldLauncher: document.querySelectorAll('.home-launcher,.home-action-card').length,
                popup: Boolean(document.querySelector('.launch-popup')),
                fab: Boolean(document.querySelector('.fab-group')),
                overflow: document.documentElement.scrollWidth - innerWidth,
              }));
              const labels = ['Home','App','About','Tokenomics','Roadmap','FAQ','Docs'];
              if (state.nav.map((item) => item.label).join('|') !== labels.join('|')) throw new Error(`Navigation mismatch: ${JSON.stringify(state)}`);
              if (state.nav.some((item) => item.href.startsWith('#'))) throw new Error(`Homepage nav still scrolls: ${JSON.stringify(state)}`);
              if (state.heroTitle !== 'Grow with the TREE ecosystem.' || state.mainSections !== 2 || state.stats !== 5 || state.utilities !== 3) throw new Error(`Homepage hierarchy invalid: ${JSON.stringify(state)}`);
              if (!state.price.startsWith('$') || !state.marketCap.startsWith('$') || !state.liquidity.startsWith('$')) throw new Error(`Live data missing: ${JSON.stringify(state)}`);
              if (state.oldLauncher || state.popup || state.fab || state.overflow > 1 || errors.length) throw new Error(`Homepage regression: ${JSON.stringify({state, errors})}`);
              if (viewport.width <= 390) {
                await page.click('.simple-menu-button');
                if (!await page.$eval('.simple-site-nav', (node) => node.classList.contains('open'))) throw new Error('Mobile navigation did not open.');
              }
              results.push({ viewport, state });
              await page.close();
            }
            for (const path of ['/about/','/tokenomics/','/roadmap/','/faq/','/documents/']) {
              const page = await browser.newPage();
              await page.goto(`${BASE}${path}`, { waitUntil: 'networkidle2', timeout: 120000 });
              const state = await page.evaluate(() => ({ title: document.title, hero: document.querySelector('.info-hero h1')?.textContent?.trim(), overflow: document.documentElement.scrollWidth - innerWidth }));
              if (!state.hero || state.overflow > 1) throw new Error(`Information route invalid ${path}: ${JSON.stringify(state)}`);
              await page.close();
            }
            const dapp = await browser.newPage();
            await dapp.goto(`${BASE}/dapp/?simple_preview=1`, { waitUntil: 'networkidle2', timeout: 120000 });
            await dapp.waitForFunction(() => document.querySelectorAll('.leader-card').length === 50, { timeout: 120000 });
            const dappState = await dapp.evaluate(() => ({ leaders: document.querySelectorAll('.leader-card').length, nav: [...document.querySelectorAll('.app-nav b')].map((node) => node.textContent.trim()), overflow: document.documentElement.scrollWidth - innerWidth }));
            if (dappState.leaders !== 50 || dappState.overflow > 1) throw new Error(`Command Center regression: ${JSON.stringify(dappState)}`);
            await dapp.close();
            await browser.close();
            console.log(JSON.stringify({ classification: 'TREE_SIMPLE_HOMEPAGE_PREVIEW_VALID', results, dappState }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Verify public preview routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /about/ /tokenomics/ /roadmap/ /faq/ /documents/ /dapp/ /api/tree-dashboard /api/tree-exposure-preview /api/tree-badges-preview; do
            url="https://deploy-preview-9--tree-token.netlify.app${path}"
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 60 "$url")
            echo "$code $url"
            [[ "$code" == '200' ]]
          done