name: Retry TREE Sui gRPC migration

on:
  push:
    branches:
      - feature/tree-aggregated-swap-v1
    paths:
      - '.github/workflows/retry-migrate-tree-swap-grpc.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-aggregated-swap-v1
          fetch-depth: 0

      - name: Apply the Sui v2 gRPC migration
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          wallet_path = Path('scripts/wallet.js')
          wallet = wallet_path.read_text(encoding='utf-8')
          wallet, count = re.subn(
              r"import \{ getWallets \} from 'https://esm\.run/@mysten/wallet-standard@0\.13\.0';\nimport \{ SuiClient \} from 'https://esm\.run/@mysten/sui@1\.43\.0/client';",
              """import {
            getWallets,
            signAndExecuteTransaction as walletSignAndExecuteTransaction,
          } from 'https://esm.run/@mysten/wallet-standard@0.21.3';
          import { SuiGrpcClient } from 'https://esm.run/@mysten/sui@2.23.1/grpc';""",
              wallet,
              count=1,
          )
          if count != 1:
              raise SystemExit('Legacy wallet imports were not found exactly once.')
          wallet = wallet.replace("const WALLET_STANDARD_URL = 'https://esm.run/@mysten/wallet-standard@0.13.0';", "const WALLET_STANDARD_URL = 'https://esm.run/@mysten/wallet-standard@0.21.3';", 1)
          wallet, count = re.subn(
              r"function _getClient\(\) \{\n  if \(!_suiClient\) _suiClient = new SuiClient\(\{ url: RPC_URL \}\);\n  return _suiClient;\n\}",
              """function _getClient() {
            if (!_suiClient) {
              _suiClient = new SuiGrpcClient({ network: NETWORK, baseUrl: RPC_URL });
            }
            return _suiClient;
          }""",
              wallet,
              count=1,
          )
          if count != 1:
              raise SystemExit('Legacy wallet client factory was not found exactly once.')
          wallet, count = re.subn(
              r"async function getBalance\(\) \{\n  if \(!window\.playerAddress\) throw new Error\('Wallet not connected'\);\n  const balance = await _getClient\(\)\.getBalance\(\{ owner: window\.playerAddress, coinType: '0x2::sui::SUI' \}\);\n  return BigInt\(balance\.totalBalance\);\n\}",
              """async function getBalance() {
            if (!window.playerAddress) throw new Error('Wallet not connected');
            const { balance } = await _getClient().core.getBalance({
              owner: window.playerAddress,
              coinType: '0x2::sui::SUI',
            });
            return BigInt(balance.balance);
          }""",
              wallet,
              count=1,
          )
          if count != 1:
              raise SystemExit('Legacy wallet balance reader was not found exactly once.')
          wallet, count = re.subn(
              r"async function signAndExecuteTransactionBlock\(txb\) \{[\s\S]*?\n\}",
              """async function signAndExecuteTransactionBlock(transaction) {
            if (!_wallet || !_address || !_account) throw new Error('Wallet not connected');
            if (!getSuiSignFeature(_wallet)) throw new Error('Wallet does not support Sui transaction signing.');
            return walletSignAndExecuteTransaction(_wallet, {
              account: _account,
              chain: CHAIN,
              transaction,
            });
          }""",
              wallet,
              count=1,
          )
          if count != 1:
              raise SystemExit('Legacy wallet execution wrapper was not found exactly once.')
          if '@mysten/sui@1.43.0' in wallet or 'new SuiClient' in wallet or '_getClient().getBalance' in wallet:
              raise SystemExit('Legacy wallet client code remains after migration.')
          wallet_path.write_text(wallet, encoding='utf-8')

          swap_path = Path('dapp/swap-router.js')
          swap = swap_path.read_text(encoding='utf-8')
          swap, count = re.subn(
              r"import \{ Transaction \} from 'https://esm\.run/@mysten/sui@1\.43\.0/transactions';\nimport \{ SuiClient \} from 'https://esm\.run/@mysten/sui@1\.43\.0/client';",
              """import { Transaction } from 'https://esm.run/@mysten/sui@2.23.1/transactions';
          import { SuiGrpcClient } from 'https://esm.run/@mysten/sui@2.23.1/grpc';""",
              swap,
              count=1,
          )
          if count != 1:
              raise SystemExit('Legacy swap imports were not found exactly once.')
          swap = swap.replace("const client = new SuiClient({ url: RPC_URL });", "const client = new SuiGrpcClient({ network: 'mainnet', baseUrl: RPC_URL });", 1)

          balance_pattern = r"const \[sui, tree\] = await Promise\.all\(\[\s*client\.getBalance\(\{ owner: address, coinType: SUI_TYPE \}\),\s*client\.getBalance\(\{ owner: address, coinType: TREE_TYPE \}\),\s*\]\);\s*state\.balances = \{ sui: BigInt\(sui\.totalBalance \|\| '0'\), tree: BigInt\(tree\.totalBalance \|\| '0'\) \};"
          balance_replacement = """const [sui, tree] = await Promise.all([
              client.core.getBalance({ owner: address, coinType: SUI_TYPE }),
              client.core.getBalance({ owner: address, coinType: TREE_TYPE }),
            ]);
            state.balances = {
              sui: BigInt(sui.balance.balance || '0'),
              tree: BigInt(tree.balance.balance || '0'),
            };"""
          swap, count = re.subn(balance_pattern, balance_replacement, swap, count=1)
          if count != 1:
              raise SystemExit('Legacy swap balance reader was not found exactly once.')

          swap, count = re.subn(
              r"async function getAllCoins\(owner, coinType\) \{[\s\S]*?\n\}\n\nasync function ownedCoinForAmount",
              """async function getAllCoins(owner, coinType) {
            const coins = [];
            let cursor = null;
            do {
              const page = await client.core.listCoins({ owner, coinType, cursor, limit: 50 });
              coins.push(...(page.objects || []));
              cursor = page.hasNextPage ? page.cursor : null;
            } while (cursor);
            return coins
              .filter((coin) => BigInt(coin.balance || '0') > 0n)
              .sort((left, right) => BigInt(right.balance || '0') > BigInt(left.balance || '0') ? 1 : -1);
          }

          async function ownedCoinForAmount""",
              swap,
              count=1,
          )
          if count != 1:
              raise SystemExit('Legacy swap coin pagination was not found exactly once.')

          swap, count = re.subn(
              r"function validateRoute\(route, amountIn\) \{[\s\S]*?\n\}\n\nasync function buildV2Transaction",
              """function validateRoute(route, amountIn) {
            if (!route || route.type !== 'direct') throw new Error('Only a direct TREE route can be executed in this release.');
            if (BigInt(route.amountIn) !== amountIn) throw new Error('The route amount no longer matches the form.');
            const input = normalizeType(route.tokenIn);
            const output = normalizeType(route.tokenOut);
            const sui = normalizeType(SUI_TYPE);
            const tree = normalizeType(TREE_TYPE);
            if (!((input === sui && output === tree) || (input === tree && output === sui))) throw new Error('The route token pair is not SUI/TREE.');
            if (route.executionKind === 'suidex-v2-direct' && route.pairId !== V2_POOL) throw new Error('Unexpected SuiDex V2 pool.');
            if (route.executionKind === 'suidex-v3-direct' && route.pairId !== V3_POOL) throw new Error('Unexpected SuiDex V3 pool.');
            if (!['suidex-v2-direct', 'suidex-v3-direct'].includes(route.executionKind)) throw new Error('Unsupported route venue.');
            if (BigInt(route.minAmountOut) <= 0n) throw new Error('The route does not contain a valid minimum output.');
          }

          async function buildV2Transaction""",
              swap,
              count=1,
          )
          if count != 1:
              raise SystemExit('Route validation block was not found exactly once.')

          start = swap.find('function dryRunSucceeded(result) {')
          end = swap.find('\nasync function executeSwap()', start)
          if start < 0 or end < 0:
              raise SystemExit('Legacy simulation and finality helpers were not found.')
          helpers = """function coreTransaction(result) {
            if (result?.$kind === 'Transaction') return result.Transaction;
            return result?.Transaction || null;
          }

          function coreFailureMessage(result, fallback = 'Sui transaction failed.') {
            const failedError = result?.FailedTransaction?.status?.error;
            if (typeof failedError === 'string') return failedError;
            if (failedError?.message) return failedError.message;
            const effectsError = coreTransaction(result)?.effects?.status?.error;
            if (typeof effectsError === 'string') return effectsError;
            if (effectsError?.message) return effectsError.message;
            return fallback;
          }

          function coreTransactionSucceeded(result) {
            return coreTransaction(result)?.effects?.status?.success === true;
          }

          function extractDigest(result) {
            return result?.digest || result?.Transaction?.digest || result?.effects?.transactionDigest || result?.transactionBlockDigest || null;
          }

          async function waitForFinality(digest) {
            return client.core.waitForTransaction({
              digest,
              timeout: 60_000,
              include: { effects: true, balanceChanges: true },
            });
          }

          function transactionSucceeded(result) {
            return coreTransactionSucceeded(result);
          }
          """
          swap = swap[:start] + helpers + swap[end:]

          simulation_pattern = r"const bytes = await tx\.build\(\{ client \}\);\s*const dryRun = await client\.dryRunTransactionBlock\(\{ transactionBlock: bytes \}\);\s*if \(!dryRunSucceeded\(dryRun\)\) throw new Error\(dryRun\?\.effects\?\.status\?\.error \|\| 'Transaction simulation failed\.'\);"
          simulation_replacement = """const bytes = await tx.build({ client });
            const simulation = await client.core.simulateTransaction({
              transaction: bytes,
              include: { effects: true, balanceChanges: true },
            });
            if (!coreTransactionSucceeded(simulation)) {
              throw new Error(coreFailureMessage(simulation, 'Transaction simulation failed.'));
            }"""
          swap, count = re.subn(simulation_pattern, simulation_replacement, swap, count=1)
          if count != 1:
              raise SystemExit('Legacy dry-run call was not found exactly once.')
          swap = swap.replace("if (!transactionSucceeded(final)) throw new Error(final?.effects?.status?.error || 'The transaction did not finalize successfully.');", "if (!transactionSucceeded(final)) throw new Error(coreFailureMessage(final, 'The transaction did not finalize successfully.'));", 1)

          for legacy in ['@mysten/sui@1.43.0', 'new SuiClient', 'client.getCoins(', 'client.getBalance(', 'dryRunTransactionBlock', 'waitForTransactionBlock']:
              if legacy in swap:
                  raise SystemExit(f'Legacy swap client code remains: {legacy}')
          swap_path.write_text(swap, encoding='utf-8')

          source_path = Path('tests/tree-swap-client-source.test.mjs')
          source = source_path.read_text(encoding='utf-8')
          source = source.replace('assert.equal(swap.includes("dryRunTransactionBlock"), true);', "assert.equal(swap.includes('client.core.simulateTransaction'), true);")
          source = source.replace("assert.equal(swap.includes('waitForTransactionBlock'), true);", "assert.equal(swap.includes('client.core.waitForTransaction'), true);")
          source = source.replace("assert.equal(quote.includes(\"path: '/api/tree-swap-quote'\"), true);", """assert.equal(quote.includes(\"path: '/api/tree-swap-quote'\"), true);
          assert.equal(swap.includes('@mysten/sui@2.23.1/grpc'), true);
          assert.equal(swap.includes('SuiGrpcClient'), true);
          assert.equal(swap.includes('@mysten/sui@1.43.0'), false);
          assert.equal(swap.includes('dryRunTransactionBlock'), false);
          assert.equal(swap.includes('waitForTransactionBlock'), false);""", 1)
          source_path.write_text(source, encoding='utf-8')

          wallet_test_path = Path('tests/wallet-manager-source.test.mjs')
          wallet_test = wallet_test_path.read_text(encoding='utf-8')
          anchor = "assert.match(wallet, /@mysten\\/slush-wallet@1\\.1\\.8/);"
          additions = """assert.match(wallet, /@mysten\\/slush-wallet@1\\.1\\.8/);
          assert.match(wallet, /@mysten\\/wallet-standard@0\\.21\\.3/);
          assert.match(wallet, /@mysten\\/sui@2\\.23\\.1\\/grpc/);
          assert.match(wallet, /walletSignAndExecuteTransaction/);
          assert.match(wallet, /_getClient\(\)\.core\.getBalance/);
          assert.doesNotMatch(wallet, /new SuiClient|@mysten\\/sui@1\\.43\\.0\\/client/);"""
          if anchor not in wallet_test:
              raise SystemExit('Wallet source-test anchor was not found.')
          wallet_test_path.write_text(wallet_test.replace(anchor, additions, 1), encoding='utf-8')

          Path('tests/sui-grpc-client-migration.test.mjs').write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const wallet = await readFile('scripts/wallet.js', 'utf8');
          const swap = await readFile('dapp/swap-router.js', 'utf8');
          for (const source of [wallet, swap]) {
            assert.equal(source.includes('@mysten/sui@1.43.0'), false);
            assert.equal(source.includes('dryRunTransactionBlock'), false);
            assert.equal(source.includes('waitForTransactionBlock'), false);
          }
          assert.equal(wallet.includes('SuiGrpcClient'), true);
          assert.equal(wallet.includes('walletSignAndExecuteTransaction'), true);
          assert.equal(wallet.includes('.core.getBalance'), true);
          assert.equal(swap.includes('SuiGrpcClient'), true);
          assert.equal(swap.includes('.core.getBalance'), true);
          assert.equal(swap.includes('.core.listCoins'), true);
          assert.equal(swap.includes('.core.simulateTransaction'), true);
          assert.equal(swap.includes('.core.waitForTransaction'), true);
          assert.equal(swap.includes('result?.FailedTransaction'), true);
          console.log('Sui gRPC client migration: PASS');
          """, encoding='utf-8')
          PY
          rm -f .github/workflows/migrate-tree-swap-grpc.yml .github/workflows/retry-migrate-tree-swap-grpc.yml
          git diff --check

      - name: Validate build, tests, and source safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check scripts/wallet.js
          node --check dapp/swap-router.js
          node --check dapp/app.js
          node tests/sui-grpc-client-migration.test.mjs
          node tests/tree-swap-client-source.test.mjs
          npx --yes tsx tests/tree-swap-route.test.ts
          node tests/wallet-manager-core.test.mjs
          node tests/wallet-manager-source.test.mjs
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          git diff --check

      - name: Verify browser gRPC imports and reads
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core@24
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tree-grpc-retry.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const exposure = await (await fetch('https://tree-token.xyz/api/tree-exposure')).json();
            const owner = exposure.entries?.find((entry) => /^0x[0-9a-f]{64}$/i.test(entry.wallet || entry.address || ''))?.wallet || exposure.entries?.[0]?.address;
            if (!owner) throw new Error('No public owner was available for a gRPC read test.');
            const browser = await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page = await browser.newPage();
            const errors=[];
            page.on('pageerror',(error)=>errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/dapp/#swap',{waitUntil:'networkidle2',timeout:120000});
            const result = await page.evaluate(async (owner) => {
              const {SuiGrpcClient}=await import('https://esm.run/@mysten/sui@2.23.1/grpc');
              const client=new SuiGrpcClient({network:'mainnet',baseUrl:'https://fullnode.mainnet.sui.io:443'});
              const {balance}=await client.core.getBalance({owner,coinType:'0x2::sui::SUI'});
              const coins=await client.core.listCoins({owner,coinType:'0x2::sui::SUI',limit:1});
              return {balance:balance.balance,coinCount:coins.objects.length,hasNextPage:coins.hasNextPage,swapModule:Boolean(window.TREE_PANEL_ROUTER)};
            },owner);
            if(errors.length)throw new Error(JSON.stringify(errors));
            if(!/^\d+$/.test(result.balance)||!Number.isInteger(result.coinCount))throw new Error(JSON.stringify(result));
            await browser.close();
            console.log(JSON.stringify({classification:'TREE_GRPC_BROWSER_READS_VALID',owner:`${owner.slice(0,8)}…${owner.slice(-6)}`,result},null,2));
          })().catch((error)=>{console.error(error);process.exit(1)});
          NODE
          git checkout -- package.json package-lock.json 2>/dev/null || true

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Migrate TREE swaps to Sui gRPC"
          git push origin HEAD:feature/tree-aggregated-swap-v1