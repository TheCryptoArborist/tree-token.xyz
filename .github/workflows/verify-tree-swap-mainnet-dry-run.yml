name: Verify TREE swap builders against Sui Mainnet

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/verify-tree-swap-mainnet-dry-run.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Verify best-route quotes and all V2/V3 transaction dry runs
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const PREVIEW = 'https://deploy-preview-11--tree-token.netlify.app';
          const PRODUCTION = 'https://tree-token.xyz';
          const RPC = 'https://fullnode.mainnet.sui.io:443';
          const SUI = '0x2::sui::SUI';
          const TREE = '0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchRetry(url, options = {}, attempts = 8) {
            let error;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, options);
                if (response.status >= 500 && attempt < attempts) throw new Error(`HTTP ${response.status}`);
                return response;
              } catch (caught) {
                error = caught;
                if (attempt < attempts) await sleep(Math.min(700 * 2 ** (attempt - 1), 5000));
              }
            }
            throw error;
          }

          async function json(url, options = {}) {
            const response = await fetchRetry(url, options);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`${url} returned non-JSON: ${text.slice(0, 200)}`); }
            return { status: response.status, body };
          }

          async function rpc(method, params) {
            const result = await json(RPC, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
            });
            if (result.status !== 200 || result.body.error) throw new Error(`${method}: ${JSON.stringify(result.body.error || result.body)}`);
            return result.body.result;
          }

          function quoteUrl(tokenIn, tokenOut, amountIn) {
            return `${PREVIEW}/api/tree-swap-quote?${new URLSearchParams({ tokenIn, tokenOut, amountIn, slippageBps: '100' })}`;
          }

          async function findOwner() {
            const result = await json(`${PRODUCTION}/api/tree-exposure`);
            const payload = result.body;
            if (result.status !== 200 || !['ok', 'stale'].includes(payload.status) || !Array.isArray(payload.entries) || payload.entries.length !== 50) throw new Error(`Production exposure snapshot unavailable: ${JSON.stringify({ status: result.status, payloadStatus: payload.status, entries: payload.entries?.length })}`);
            for (const entry of payload.entries) {
              const owner = entry.wallet || entry.address;
              const liquidTree = BigInt(entry.liquidTreeRaw || entry.directTreeRaw || '0');
              if (!/^0x[0-9a-f]{64}$/i.test(owner || '') || liquidTree < 1_000_000_000_000n) continue;
              const balance = await rpc('suix_getBalance', [owner, SUI]);
              if (BigInt(balance?.totalBalance || '0') >= 2_000_000_000n) return owner;
            }
            throw new Error('No public ranked wallet satisfied the dry-run balance requirements.');
          }

          (async () => {
            const buy = await json(quoteUrl(SUI, TREE, '1000000000'));
            const sell = await json(quoteUrl(TREE, SUI, '100000000000'));
            for (const [name, result] of [['buy', buy], ['sell', sell]]) {
              const payload = result.body;
              if (result.status !== 200 || payload.status !== 'ok') throw new Error(`${name} quote failed: ${JSON.stringify(result)}`);
              const venues = new Set(payload.routes?.map((route) => route.venue));
              if (payload.routes?.length < 2 || !venues.has('suidex') || !venues.has('v3')) throw new Error(`${name} quote did not include both direct TREE venues.`);
            }
            if (buy.body.decimalsIn !== 9 || buy.body.decimalsOut !== 6 || sell.body.decimalsIn !== 6 || sell.body.decimalsOut !== 9) throw new Error('SUI/TREE decimals are incorrect.');

            const owner = await findOwner();
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            await page.goto(`${PREVIEW}/dapp/#swap`, { waitUntil: 'networkidle2', timeout: 120000 });
            await page.waitForSelector('#swapAmountIn', { timeout: 120000 });
            await page.type('#swapAmountIn', '1');
            await page.waitForFunction(() => document.querySelectorAll('.swap-route-candidate').length >= 2, { timeout: 120000 });
            const ui = await page.evaluate(() => ({
              active: document.body.dataset.activePanel,
              output: document.querySelector('#swapAmountOut')?.value,
              route: document.querySelector('#swapRouteLabel')?.textContent,
              candidates: document.querySelectorAll('.swap-route-candidate').length,
              action: document.querySelector('#buyTree')?.textContent,
              actionDisabled: document.querySelector('#buyTree')?.disabled,
              overflow: document.documentElement.scrollWidth - innerWidth,
            }));
            if (ui.active !== 'swap' || !ui.output || ui.candidates < 2 || ui.action !== 'Connect Wallet' || ui.actionDisabled || ui.overflow > 1) throw new Error(`Published swap UI failed: ${JSON.stringify(ui)}`);

            const dryRuns = await page.evaluate(async ({ owner, buyQuote, sellQuote, rpcUrl }) => {
              const swapModule = await import('/dapp/swap-router.js');
              const { SuiClient } = await import('https://esm.run/@mysten/sui@1.43.0/client');
              const client = new SuiClient({ url: rpcUrl });
              const results = [];
              for (const [direction, quote] of Object.entries({ buy: buyQuote, sell: sellQuote })) {
                for (const route of quote.routes) {
                  try {
                    const transaction = await swapModule.buildTransaction(owner, route, BigInt(quote.amountIn));
                    const bytes = await transaction.build({ client });
                    const dryRun = await client.dryRunTransactionBlock({ transactionBlock: bytes });
                    results.push({ direction, venue: route.venueLabel, executionKind: route.executionKind, status: dryRun?.effects?.status?.status || null, error: dryRun?.effects?.status?.error || null });
                  } catch (error) {
                    results.push({ direction, venue: route.venueLabel, executionKind: route.executionKind, status: 'builder-error', error: error?.message || String(error) });
                  }
                }
              }
              return results;
            }, { owner, buyQuote: buy.body, sellQuote: sell.body, rpcUrl: RPC });
            await browser.close();
            if (dryRuns.length !== 4 || dryRuns.some((result) => result.status !== 'success')) throw new Error(`Dry-run verification failed: ${JSON.stringify(dryRuns)}`);

            console.log(JSON.stringify({
              classification: 'TREE_SWAP_MAINNET_DRY_RUN_VERIFIED',
              owner: `${owner.slice(0, 8)}…${owner.slice(-6)}`,
              buy: { selected: buy.body.selectedRoute.venueLabel, amountOut: buy.body.selectedRoute.amountOut, routes: buy.body.routes.map((route) => ({ venue: route.venueLabel, amountOut: route.amountOut, impact: route.priceImpactPercent })) },
              sell: { selected: sell.body.selectedRoute.venueLabel, amountOut: sell.body.selectedRoute.amountOut, routes: sell.body.routes.map((route) => ({ venue: route.venueLabel, amountOut: route.amountOut, impact: route.priceImpactPercent })) },
              dryRuns,
              ui,
            }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Verify public preview routes
        shell: bash
        run: |
          set -euo pipefail
          quote='https://deploy-preview-11--tree-token.netlify.app/api/tree-swap-quote?tokenIn=0x2%3A%3Asui%3A%3ASUI&tokenOut=0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf%3A%3Atree%3A%3ATREE&amountIn=1000000000&slippageBps=100'
          for url in 'https://deploy-preview-11--tree-token.netlify.app/' 'https://deploy-preview-11--tree-token.netlify.app/dapp/' "$quote"; do
            code=$(curl --retry 8 --retry-all-errors --retry-delay 1 --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 60 "$url")
            echo "$code $url"
            [[ "$code" == '200' ]]
          done