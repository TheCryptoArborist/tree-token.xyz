name: Probe ranked wallets for V3 and Turbos positions

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/probe-ranked-v3-turbos-positions.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Inspect matching position objects owned by current Top 50
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/probe-ranked-v3-turbos.ts <<'TS'
          import { ChannelCredentials } from '@grpc/grpc-js';
          import { GrpcTransport } from '@protobuf-ts/grpc-transport';
          import { SuiGrpcClient } from '@mysten/sui/grpc';

          const TREE = '6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          const TARGETS = {
            candidateV3: '0xb5f529c1dcda6580a61bf7ee9fbd524b50be62f11044d137c8202c8cbace9e56::position::Position',
            turbosNft: '0x91bfbc386a41afcfd9b2533058d7e915a1d3829089cc268ff4333d54d6339ca1::position_nft::TurbosPositionNFT',
          } as const;
          type Rec = Record<string, unknown>;
          const record = (value: unknown): Rec => value && typeof value === 'object' && !Array.isArray(value) ? value as Rec : {};
          const client = new SuiGrpcClient({
            network: 'mainnet',
            transport: new GrpcTransport({ host: 'fullnode.mainnet.sui.io:443', channelCredentials: ChannelCredentials.createSsl() }),
          });

          const leaderboardResponse = await fetch('https://tree-token.xyz/api/tree-leaderboard');
          if (!leaderboardResponse.ok) throw new Error(`Leaderboard HTTP ${leaderboardResponse.status}`);
          const leaderboard = await leaderboardResponse.json() as { entries?: Array<{ wallet: string }> };
          const wallets = (leaderboard.entries || []).map((entry) => entry.wallet).filter(Boolean).slice(0, 50);
          if (wallets.length !== 50) throw new Error(`Expected 50 leaderboard wallets, received ${wallets.length}`);

          function summarize(value: unknown, depth = 0): unknown {
            if (depth > 6) return '[depth-limit]';
            if (Array.isArray(value)) return { kind: 'array', length: value.length, sample: value.slice(0, 2).map((item) => summarize(item, depth + 1)) };
            if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value as Rec).slice(0, 120).map(([key, child]) => [key, summarize(child, depth + 1)]));
            if (typeof value === 'string' && /^(0x)?[0-9a-f]{64}$/i.test(value)) return '[address-or-object-id]';
            return value;
          }
          function numericLeaves(value: unknown, path = '', out: Array<{ path: string; value: string }> = []) {
            if (out.length >= 120) return out;
            if (Array.isArray(value)) value.slice(0, 5).forEach((item, index) => numericLeaves(item, `${path}[${index}]`, out));
            else if (value && typeof value === 'object') for (const [key, child] of Object.entries(value as Rec)) numericLeaves(child, path ? `${path}.${key}` : key, out);
            else if ((typeof value === 'string' && /^-?\d+$/.test(value)) || typeof value === 'number') out.push({ path, value: String(value) });
            return out;
          }
          function referencedIds(value: unknown, path = '', out: Array<{ path: string; id: string }> = []) {
            if (Array.isArray(value)) value.forEach((item, index) => referencedIds(item, `${path}[${index}]`, out));
            else if (value && typeof value === 'object') for (const [key, child] of Object.entries(value as Rec)) referencedIds(child, path ? `${path}.${key}` : key, out);
            else if (typeof value === 'string' && /^(0x)?[0-9a-f]{64}$/i.test(value)) out.push({ path, id: value.startsWith('0x') ? value : `0x${value}` });
            return out;
          }

          const matches: Record<string, Array<{ objectId: string; ownerIndex: number }>> = { candidateV3: [], turbosNft: [] };
          let walletCursor = 0;
          async function scanWallets() {
            while (walletCursor < wallets.length) {
              const ownerIndex = walletCursor++;
              let cursor: string | undefined;
              for (let page = 0; page < 6; page += 1) {
                const result = await client.core.listOwnedObjects({ owner: wallets[ownerIndex], cursor, limit: 50 });
                for (const object of result.objects || []) {
                  for (const [label, type] of Object.entries(TARGETS)) {
                    if (object.type === type && object.objectId) matches[label].push({ objectId: object.objectId, ownerIndex });
                  }
                }
                if (!result.cursor) break;
                cursor = result.cursor;
              }
            }
          }
          await Promise.all(Array.from({ length: 5 }, () => scanWallets()));

          const report: Rec = { walletsScanned: wallets.length, matches: {} };
          for (const [label, items] of Object.entries(matches)) {
            const objects = [];
            const poolRefs = new Map<string, Set<string>>();
            for (const item of items.slice(0, 20)) {
              const { object } = await client.core.getObject({ objectId: item.objectId, include: { json: true } });
              if (!object) continue;
              const json = object.json;
              const refs = referencedIds(json);
              refs.forEach(({ path, id }) => {
                const paths = poolRefs.get(id) || new Set<string>();
                paths.add(path); poolRefs.set(id, paths);
              });
              objects.push({ ownerIndex: item.ownerIndex, type: object.type, schema: summarize(json), numericLeaves: numericLeaves(json), referencePaths: refs.map(({ path }) => path) });
            }
            const referencedObjects = [];
            for (const [id, paths] of [...poolRefs.entries()].slice(0, 60)) {
              try {
                const { object } = await client.core.getObject({ objectId: id, include: { json: true } });
                if (!object) continue;
                const type = String(object.type || '');
                referencedObjects.push({ paths: [...paths], type, containsTree: type.toLowerCase().includes(TREE), schema: summarize(object.json), numericLeaves: numericLeaves(object.json) });
              } catch { /* Address, deleted object, or inaccessible reference. */ }
            }
            report.matches[label] = { objectCount: items.length, samples: objects, referencedObjects };
          }
          console.log(JSON.stringify(report, null, 2));
          TS
          npx --yes tsx scripts/probe-ranked-v3-turbos.ts
          rm -f scripts/probe-ranked-v3-turbos.ts

      - name: Remove temporary probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-ranked-v3-turbos-positions.yml scripts/probe-ranked-v3-turbos.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Complete ranked-wallet V3 and Turbos discovery"
          git push origin HEAD:feature/leaderboard-exposure-v1
