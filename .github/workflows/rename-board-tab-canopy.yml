name: Rename TREE Board tab to Canopy

on:
  push:
    branches:
      - feature/tree-navigation-v2
    paths:
      - '.github/workflows/rename-board-tab-canopy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-navigation-v2
          fetch-depth: 0

      - name: Apply the tree-themed tab label
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          html_path = Path('dapp/index.html')
          html = html_path.read_text(encoding='utf-8')
          old_tab = '<a href="#leaderboard"><span aria-hidden="true">♛</span><b>Board</b></a>'
          new_tab = '<a href="#leaderboard"><span aria-hidden="true">🌳</span><b>Canopy</b></a>'
          if old_tab not in html:
              raise SystemExit('Could not locate the existing Board tab.')
          html_path.write_text(html.replace(old_tab, new_tab, 1), encoding='utf-8')

          router_path = Path('dapp/panel-router.js')
          router = router_path.read_text(encoding='utf-8')
          old_label = "leaderboard: 'Board',"
          new_label = "leaderboard: 'Canopy',"
          if old_label not in router:
              raise SystemExit('Could not locate the Board panel label.')
          router_path.write_text(router.replace(old_label, new_label, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/rename-board-tab-canopy.yml
          git diff --check

      - name: Validate the navigation change
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node --check dapp/panel-router.js
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          markup = Path('dapp/index.html').read_text(encoding='utf-8')
          router = Path('dapp/panel-router.js').read_text(encoding='utf-8')
          assert '<span aria-hidden="true">🌳</span><b>Canopy</b>' in markup
          assert '<b>Board</b>' not in markup
          assert "leaderboard: 'Canopy'" in router
          assert "leaderboard: 'Board'" not in router
          assert 'href="#leaderboard"' in markup
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in Path('dapp/app.js').read_text(encoding='utf-8')
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Rename the Board tab to Canopy"
          git push origin HEAD:feature/tree-navigation-v2