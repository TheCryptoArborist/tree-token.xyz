name: Extract Turbos TREE position creation events

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/extract-turbos-creation-events.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Print concise creation event and created-object summary
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/extract-turbos-creation-events.ts <<'TS'
          const GRAPHQL = 'https://graphql.mainnet.sui.io/graphql';
          const DIGEST = 'DaVTXHY6yAXGKravH2uzuCXbXkErtJBXsawrrgnPGcic';
          const query = `query Transaction($digest: String!) {
            transaction(digest: $digest) {
              digest
              sender { address }
              effects {
                status
                timestamp
                events(first: 50) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    sequenceNumber
                    transactionModule { name package { address } }
                    contents { type { repr } json }
                  }
                }
                objectChanges(first: 50) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    address
                    idCreated
                    idDeleted
                    outputState {
                      version
                      owner { __typename }
                      asMoveObject { contents { type { repr } json } }
                    }
                  }
                }
              }
            }
          }`;
          const response = await fetch(GRAPHQL, {
            method: 'POST',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables: { digest: DIGEST } }),
          });
          if (!response.ok) throw new Error(`GraphQL HTTP ${response.status}`);
          const payload = await response.json() as any;
          if (payload.errors?.length) throw new Error(payload.errors.map((item: any) => item.message).join(' | '));
          const transaction = payload.data?.transaction;
          if (!transaction) throw new Error('Transaction not returned.');
          const events = (transaction.effects?.events?.nodes || []).map((event: any) => ({
            sequenceNumber: event.sequenceNumber,
            module: event.transactionModule?.name || null,
            package: event.transactionModule?.package?.address || null,
            type: event.contents?.type?.repr || null,
            json: event.contents?.json ?? null,
          }));
          const changes = (transaction.effects?.objectChanges?.nodes || [])
            .filter((change: any) => change.idCreated || change.outputState)
            .map((change: any) => ({
              address: change.address,
              idCreated: Boolean(change.idCreated),
              idDeleted: Boolean(change.idDeleted),
              version: change.outputState?.version ?? null,
              ownerKind: change.outputState?.owner?.__typename || null,
              type: change.outputState?.asMoveObject?.contents?.type?.repr || null,
              json: change.outputState?.asMoveObject?.contents?.json ?? null,
            }));
          console.log('TURBOS_CREATION_SUMMARY=' + JSON.stringify({
            digest: transaction.digest,
            sender: transaction.sender?.address || null,
            status: transaction.effects?.status || null,
            timestamp: transaction.effects?.timestamp || null,
            eventPageInfo: transaction.effects?.events?.pageInfo || null,
            objectChangePageInfo: transaction.effects?.objectChanges?.pageInfo || null,
            events,
            changes,
          }));
          TS
          npx --yes tsx scripts/extract-turbos-creation-events.ts

      - name: Remove temporary extractor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/extract-turbos-creation-events.yml scripts/extract-turbos-creation-events.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Turbos creation event extraction"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
