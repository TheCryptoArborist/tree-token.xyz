name: Probe verified SuiDex V2 TREE LP accounting

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/probe-suidex-v2-tree-lp.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Install native gRPC transport for object inspection
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @grpc/grpc-js @protobuf-ts/grpc-transport

      - name: Inspect SuiDex V2 pool, LP coins, and farm positions
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/probe-suidex-v2-tree-lp.ts <<'TS'
          import { ChannelCredentials } from '@grpc/grpc-js';
          import { GrpcTransport } from '@protobuf-ts/grpc-transport';
          import { SuiGrpcClient } from '@mysten/sui/grpc';

          const GRAPHQL = 'https://graphql.mainnet.sui.io/graphql';
          const TREE = '0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          const SUI = '0x2::sui::SUI';
          const PACKAGE = '0xbfac5e1c6bf6ef29b12f7723857695fd2f4da9a11a7d88162c15e9124c243a4a';
          const LP_TYPE = `${PACKAGE}::pair::LPCoin<${SUI},${TREE}>`;
          const LP_COIN_TYPE = `0x2::coin::Coin<${LP_TYPE}>`;
          const FARM_TYPE = `${PACKAGE}::farm::StakingPosition<${LP_TYPE}>`;
          const POOL_ID = '0x35a1be1f01f9edf7f5221d226f357d194d43c28f2a65cb38640935518d9a5bfc';

          const client = new SuiGrpcClient({
            network: 'mainnet',
            transport: new GrpcTransport({
              host: 'fullnode.mainnet.sui.io:443',
              channelCredentials: ChannelCredentials.createSsl(),
            }),
          });

          type Json = null | boolean | number | string | Json[] | { [key: string]: Json };

          function summarize(value: unknown, depth = 0): unknown {
            if (depth > 4) return '[depth-limit]';
            if (Array.isArray(value)) return { kind: 'array', length: value.length, sample: value.slice(0, 2).map((item) => summarize(item, depth + 1)) };
            if (value && typeof value === 'object') {
              const object = value as Record<string, unknown>;
              return Object.fromEntries(Object.entries(object).slice(0, 80).map(([key, child]) => [key, summarize(child, depth + 1)]));
            }
            if (typeof value === 'string' && /^0x[0-9a-f]{64}$/i.test(value)) return '[object-id]';
            return value;
          }

          function numericLeaves(value: unknown, path = '', output: Array<{ path: string; value: string }> = []) {
            if (output.length >= 80) return output;
            if (Array.isArray(value)) {
              value.slice(0, 5).forEach((item, index) => numericLeaves(item, `${path}[${index}]`, output));
              return output;
            }
            if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value as Record<string, unknown>)) {
                numericLeaves(child, path ? `${path}.${key}` : key, output);
                if (output.length >= 80) break;
              }
              return output;
            }
            if ((typeof value === 'string' && /^\d+$/.test(value)) || typeof value === 'number') {
              output.push({ path, value: String(value) });
            }
            return output;
          }

          async function graphql(query: string, variables: Record<string, unknown>) {
            const response = await fetch(GRAPHQL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify({ query, variables }),
            });
            if (!response.ok) throw new Error(`GraphQL HTTP ${response.status}`);
            const payload = await response.json() as { data?: unknown; errors?: Array<{ message?: string }> };
            if (payload.errors?.length) throw new Error(payload.errors.map((item) => item.message || 'GraphQL error').join(' | '));
            return payload.data as Record<string, unknown>;
          }

          async function scanType(type: string) {
            const query = `query Scan($first: Int!, $after: String, $type: String!) {
              objects(first: $first, after: $after, filter: { type: $type }) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  address
                  owner {
                    __typename
                    ... on AddressOwner { address { address } }
                    ... on ObjectOwner { address { address } }
                  }
                  asMoveObject { contents { json balance: extract(path: "balance") { json } } }
                }
              }
            }`;
            const nodes: Array<Record<string, unknown>> = [];
            let after: string | null = null;
            for (let page = 0; page < 100; page += 1) {
              const data = await graphql(query, { first: 50, after, type });
              const connection = data.objects as { pageInfo: { hasNextPage: boolean; endCursor?: string | null }; nodes: Array<Record<string, unknown>> };
              nodes.push(...connection.nodes);
              if (!connection.pageInfo.hasNextPage) return { nodes, reachedEnd: true };
              if (!connection.pageInfo.endCursor) return { nodes, reachedEnd: false };
              after = connection.pageInfo.endCursor;
            }
            return { nodes, reachedEnd: false };
          }

          const { object: poolObject } = await client.core.getObject({ objectId: POOL_ID, include: { json: true } });
          if (!poolObject) throw new Error('Known SuiDex V2 pool object was not returned.');

          const metadataQuery = `query Metadata($coinType: String!) {
            coinMetadata(coinType: $coinType) { name symbol decimals supply }
          }`;
          const metadata = (await graphql(metadataQuery, { coinType: LP_TYPE })).coinMetadata as Record<string, unknown> | null;

          const lpCoins = await scanType(LP_COIN_TYPE);
          const farmPositions = await scanType(FARM_TYPE);

          function ownerKind(node: Record<string, unknown>) {
            const owner = node.owner as Record<string, unknown> | null;
            return typeof owner?.__typename === 'string' ? owner.__typename : 'Unknown';
          }

          function balanceOf(node: Record<string, unknown>) {
            const move = node.asMoveObject as Record<string, unknown> | null;
            const contents = move?.contents as Record<string, unknown> | null;
            const extracted = contents?.balance as Record<string, unknown> | null;
            const direct = extracted?.json;
            if (typeof direct === 'string' && /^\d+$/.test(direct)) return BigInt(direct);
            const json = contents?.json as Record<string, unknown> | null;
            const fallback = json?.balance;
            return typeof fallback === 'string' && /^\d+$/.test(fallback) ? BigInt(fallback) : null;
          }

          const lpOwnerKinds = new Map<string, number>();
          let lpRaw = 0n;
          let malformedLpBalances = 0;
          for (const node of lpCoins.nodes) {
            const kind = ownerKind(node);
            lpOwnerKinds.set(kind, (lpOwnerKinds.get(kind) || 0) + 1);
            const balance = balanceOf(node);
            if (balance === null) malformedLpBalances += 1;
            else lpRaw += balance;
          }

          const farmOwnerKinds = new Map<string, number>();
          for (const node of farmPositions.nodes) {
            const kind = ownerKind(node);
            farmOwnerKinds.set(kind, (farmOwnerKinds.get(kind) || 0) + 1);
          }
          const farmSamples = farmPositions.nodes.slice(0, 3).map((node) => {
            const move = node.asMoveObject as Record<string, unknown> | null;
            const contents = move?.contents as Record<string, unknown> | null;
            return {
              ownerKind: ownerKind(node),
              schema: summarize(contents?.json),
              numericLeaves: numericLeaves(contents?.json),
            };
          });

          console.log(JSON.stringify({
            configuration: { poolId: POOL_ID, lpType: LP_TYPE, lpCoinType: LP_COIN_TYPE, farmType: FARM_TYPE },
            pool: {
              type: poolObject.type,
              ownerKind: typeof poolObject.owner === 'string' ? poolObject.owner : Object.keys(poolObject.owner || {})[0] || 'unknown',
              schema: summarize(poolObject.json as Json),
              numericLeaves: numericLeaves(poolObject.json),
            },
            lpMetadata: metadata,
            directLpCoins: {
              reachedEnd: lpCoins.reachedEnd,
              objectCount: lpCoins.nodes.length,
              ownerKinds: Object.fromEntries(lpOwnerKinds),
              aggregateRawLp: lpRaw.toString(),
              malformedBalances: malformedLpBalances,
            },
            farmPositions: {
              reachedEnd: farmPositions.reachedEnd,
              objectCount: farmPositions.nodes.length,
              ownerKinds: Object.fromEntries(farmOwnerKinds),
              samples: farmSamples,
            },
          }, null, 2));
          TS
          npx --yes tsx scripts/probe-suidex-v2-tree-lp.ts
          rm -f scripts/probe-suidex-v2-tree-lp.ts

      - name: Remove temporary probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-suidex-v2-tree-lp.yml scripts/probe-suidex-v2-tree-lp.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Complete SuiDex V2 TREE LP schema discovery"
          git push origin HEAD:feature/leaderboard-exposure-v1
