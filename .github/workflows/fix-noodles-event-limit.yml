name: Fix Noodles pool-event page limit

on:
  push:
    branches:
      - feature/leaderboard-badges-v1
    paths:
      - '.github/workflows/fix-noodles-event-limit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-badges-v1
          fetch-depth: 0
      - name: Apply the documented live event limit
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          provider_path = Path('netlify/lib/tree-activity-index.ts')
          provider = provider_path.read_text(encoding='utf-8')
          replacements = [
              ('const DEFAULT_EVENT_LIMIT = 100;', 'const DEFAULT_EVENT_LIMIT = 50;'),
              ('const limit = Math.max(1, Math.min(100, Math.trunc(options.limit ?? DEFAULT_EVENT_LIMIT)));',
               'const limit = Math.max(1, Math.min(50, Math.trunc(options.limit ?? DEFAULT_EVENT_LIMIT)));'),
          ]
          for old, new in replacements:
              if old not in provider:
                  raise SystemExit(f'Expected provider text not found: {old}')
              provider = provider.replace(old, new, 1)
          provider_path.write_text(provider, encoding='utf-8')

          test_path = Path('tests/tree-activity-index.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old = """  if (url.pathname.endsWith('/pool/event/all')) {
              return new Response(JSON.stringify({"""
          new = """  if (url.pathname.endsWith('/pool/event/all')) {
              assert.equal(url.searchParams.get('limit'), '50');
              return new Response(JSON.stringify({"""
          if old not in test:
              raise SystemExit('Activity fixture insertion point not found.')
          test = test.replace(old, new, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-noodles-event-limit.yml
          git diff --check
      - name: Validate the complete badge stack
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          provider = Path('netlify/lib/tree-activity-index.ts').read_text(encoding='utf-8')
          assert 'const DEFAULT_EVENT_LIMIT = 50;' in provider
          assert 'Math.min(50, Math.trunc(options.limit ?? DEFAULT_EVENT_LIMIT))' in provider
          exposure = Path('netlify/lib/tree-exposure-scan-runner.ts').read_text(encoding='utf-8')
          assert 'scanTreeTradingActivity' not in exposure
          assert 'scanTreeBurnContributions' not in exposure
          PY
          git diff --check
      - name: Commit the live limit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Use the supported Noodles pool-event limit"
          git push origin HEAD:feature/leaderboard-badges-v1
