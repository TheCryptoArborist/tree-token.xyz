name: Apply V3 TREE balance normalization

on:
  push:
    branches:
      - fix/v3-tree-balance-normalization
    paths:
      - scripts/apply-v3-tree-balance-normalization.mjs
      - .github/workflows/apply-v3-tree-balance-normalization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3-tree-balance-normalization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply normalization patch
        run: node scripts/apply-v3-tree-balance-normalization.mjs
      - name: Syntax check
        run: node --check dapp/v3-transactions.js
      - name: Verify expected raw-unit checks
        run: |
          grep -F "rawCoinBalance(client, owner, TREE_COIN_TYPE)" dapp/v3-transactions.js
          grep -F "if (treeBalance < treeRaw)" dapp/v3-transactions.js
      - name: Commit patched transaction handler
        run: |
          if git diff --quiet -- dapp/v3-transactions.js; then
            echo "No V3 balance patch changes required."
            exit 0
          fi
          git config user.name "TREE Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dapp/v3-transactions.js
          git commit -m "Fix V3 TREE balance raw-unit validation"
          git push
