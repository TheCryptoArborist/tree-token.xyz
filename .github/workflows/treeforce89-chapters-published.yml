name: TREE FORCE verify chapter publication
on:
  push:
    branches: [feature/treeforce89-chapters]
    paths: [.github/workflows/treeforce89-chapters-published.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: tree-token-preserved-production-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de09c8c593c791672142ff9d8f2dbf57999b1071
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: treeforce89-chapters-candidate
          run-id: 42064138353
          github-token: ${{ github.token }}
          path: .netlify
      - name: Rebuild and verify the reviewed frontend bytes
        run: node scripts/prepare-treeforce89-chapters-release.mjs
      - name: Verify published files, all 43 functions, schedules, runtime and environment
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/release-treeforce89-chapters.mjs published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treeforce89-chapters-published
          path: .netlify/treeforce89-chapters-candidate.json
          if-no-files-found: error
          retention-days: 7
