name: Check Canopy Board Deploy Preview data state

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-canopy-board-api-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exposure and badge state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://deploy-preview-6--tree-token.netlify.app'
          curl --silent --show-error --location --max-time 60 "$BASE/api/tree-exposure?canopy_layout_status=1" -o /tmp/exposure.json
          curl --silent --show-error --location --max-time 60 "$BASE/api/tree-badges?canopy_layout_status=1" -o /tmp/badges.json
          node <<'NODE'
          const exposure = require('/tmp/exposure.json');
          const badges = require('/tmp/badges.json');
          console.log(JSON.stringify({
            exposure: {
              status: exposure.status,
              refreshState: exposure.refreshState,
              stage: exposure.refreshStatus?.stage,
              snapshotGeneratedAt: exposure.snapshotGeneratedAt,
              displayedCount: exposure.displayedCount,
              message: exposure.message,
            },
            badges: {
              status: badges.status,
              refreshState: badges.refreshState,
              stage: badges.refreshStatus?.stage,
              activityOutcome: badges.refreshStatus?.activityOutcome || badges.source?.activity?.outcome,
              burnOutcome: badges.refreshStatus?.burnOutcome || badges.source?.burns?.outcome,
              snapshotGeneratedAt: badges.snapshotGeneratedAt,
              displayedCount: badges.displayedCount,
              summary: badges.summary,
              message: badges.message,
            },
          }, null, 2));
          NODE
