name: Optimize Turbos exposure refresh

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/optimize-turbos-exposure-refresh.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Apply the verified Turbos pool-index optimization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/optimize-turbos-exposure-refresh.py
          rm -f scripts/optimize-turbos-exposure-refresh.py
          git diff --check

      - name: Validate the optimized exposure stack
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          provider = Path('netlify/lib/turbos-tree-lp-provider.ts').read_text(encoding='utf-8')
          assert 'turbos-tree-principal-pool-index-v2' in provider
          assert 'listDynamicFields' in provider
          assert 'TURBOS_TREE_POOL_IDS' in provider
          assert 'ScanTurbosPositionNfts' not in provider
          assert 'TurbosPositionNFT' in provider
          PY
          git diff --check

      - name: Commit the optimized provider
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Optimize Turbos exposure refresh"
          git push origin HEAD:feature/leaderboard-exposure-v1
