name: Probe TREE aggregated swap route

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/probe-tree-aggregated-route.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public route services
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import requests, json, urllib.parse
          SUI='0x2::sui::SUI'
          TREE='0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE'
          cases=[]
          for direction, token_in, token_out, amount in [
            ('SUI_TO_TREE_1_SUI', SUI, TREE, '1000000000'),
            ('TREE_TO_SUI_100K_TREE', TREE, SUI, '100000000000'),
          ]:
            query=urllib.parse.urlencode({'tokenIn':token_in,'tokenOut':token_out,'amountIn':amount,'slippageBps':'100'})
            urls=[
              f'https://dex.suidex.org/api/v3/route?{query}',
              f'https://suidex-api.suidex.org/api/v1/dex/route?{query}',
              f'https://suidex-api.suidex.org/api/v1/dex/route/build?{query}',
            ]
            for url in urls:
              try:
                response=requests.get(url,timeout=60,headers={'Accept':'application/json','User-Agent':'TREE-Route-Verification/1.0'})
                text=response.text
                parsed=None
                try: parsed=response.json()
                except Exception: pass
                cases.append({'direction':direction,'url':url,'status':response.status_code,'content_type':response.headers.get('content-type'),'body':parsed if parsed is not None else text[:10000]})
              except Exception as error:
                cases.append({'direction':direction,'url':url,'error':str(error)})
          print(json.dumps({'classification':'TREE_ROUTE_PROBE','cases':cases},indent=2))
          PY