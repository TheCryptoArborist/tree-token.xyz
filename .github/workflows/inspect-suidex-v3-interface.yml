name: Inspect SuiDex V3 public interface

on:
  push:
    branches:
      - feature/tree-native-v3-v1
    paths:
      - '.github/workflows/inspect-suidex-v3-interface.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Inspect public requests and frontend source
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const V3_PACKAGE = '0xb5f529c1dcda6580a61bf7ee9fbd524b50be62f11044d137c8202c8cbace9e56';
          const TREE_POOL = '0x39d5ba22e01e45bc4129ec28a0bef52e8fee8db5d07d337adf9540e3cb9074cf';

          (async () => {
            const routes = [
              'https://dex.suidex.org/pools',
              'https://dex.suidex.org/pools/v3/analytics',
              `https://dex.suidex.org/pools/v3/${TREE_POOL}`,
              `https://dex.suidex.org/pools/v3/${TREE_POOL}/add`,
              'https://dex.suidex.org/portfolio',
            ];
            const interesting = /\/api\/|graphql|fullnode|grpc|pool|position|reward|analytics|route/i;
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const output = { pages: [], scripts: [], sourceHits: [] };
            const scriptUrls = new Set();

            for (const url of routes) {
              const page = await browser.newPage();
              const requests = [];
              page.on('response', async (response) => {
                const request = response.request();
                const requestUrl = request.url();
                if (!interesting.test(requestUrl)) return;
                const item = { method: request.method(), status: response.status(), url: requestUrl, contentType: response.headers()['content-type'] || '' };
                if (/json|javascript|text\//i.test(item.contentType) && requestUrl.includes('/api/')) {
                  try {
                    const text = await response.text();
                    item.preview = text.slice(0, 1800);
                  } catch {}
                }
                requests.push(item);
              });
              try {
                await page.goto(url, { waitUntil: 'networkidle2', timeout: 120000 });
                await new Promise((resolve) => setTimeout(resolve, 2500));
                const state = await page.evaluate(({ pool }) => ({
                  title: document.title,
                  text: document.body.innerText.slice(0, 5000),
                  links: [...document.querySelectorAll('a')].map((a) => ({ text: a.textContent?.trim() || '', href: a.href })).filter((item) => /tree|position|liquidity|pool|analytics/i.test(`${item.text} ${item.href}`)).slice(0, 80),
                  scripts: [...document.scripts].map((script) => script.src).filter(Boolean),
                  poolMentions: [...document.querySelectorAll('*')].filter((node) => node.textContent?.includes(pool)).slice(0, 5).map((node) => node.outerHTML.slice(0, 1000)),
                }), { pool: TREE_POOL });
                state.scripts.forEach((src) => scriptUrls.add(src));
                output.pages.push({ url, state, requests });
              } catch (error) {
                output.pages.push({ url, error: error?.message || String(error), requests });
              }
              await page.close();
            }

            const sourceNeedles = [
              V3_PACKAGE.slice(2),
              TREE_POOL.slice(2),
              'open_position',
              'add_liquidity',
              'increase_liquidity',
              'remove_liquidity',
              'collect_fee',
              'collect_fees',
              'claim_reward',
              'claim_rewards',
              'close_position',
              'decrease_liquidity',
            ];
            for (const scriptUrl of [...scriptUrls]) {
              try {
                const response = await fetch(scriptUrl);
                const text = await response.text();
                const hits = [];
                for (const needle of sourceNeedles) {
                  let index = text.toLowerCase().indexOf(needle.toLowerCase());
                  let count = 0;
                  while (index >= 0 && count < 8) {
                    hits.push({ needle, snippet: text.slice(Math.max(0, index - 700), Math.min(text.length, index + needle.length + 1400)) });
                    index = text.toLowerCase().indexOf(needle.toLowerCase(), index + needle.length);
                    count += 1;
                  }
                }
                if (hits.length) output.sourceHits.push({ scriptUrl, hits });
                output.scripts.push({ scriptUrl, status: response.status, bytes: text.length, hits: hits.length });
              } catch (error) {
                output.scripts.push({ scriptUrl, error: error?.message || String(error) });
              }
            }

            await browser.close();
            console.log(JSON.stringify(output, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE