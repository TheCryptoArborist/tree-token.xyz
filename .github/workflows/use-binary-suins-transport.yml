name: Use binary SuiNS transport

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/use-binary-suins-transport.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0
      - name: Configure binary gRPC-web transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          resolver = Path('netlify/lib/suins-name-resolver.ts')
          text = resolver.read_text(encoding='utf-8')
          text = text.replace(
              "import { SuiGrpcClient } from '@mysten/sui/grpc';",
              "import { GrpcWebFetchTransport, SuiGrpcClient } from '@mysten/sui/grpc';",
              1,
          )
          old = """  const client = options.client
            ?? options.clientFactory?.(endpoint)
            ?? new SuiGrpcClient({ network: 'mainnet', baseUrl: endpoint });"""
          new = """  const client = options.client
            ?? options.clientFactory?.(endpoint)
            ?? new SuiGrpcClient({
              network: 'mainnet',
              transport: new GrpcWebFetchTransport({ baseUrl: endpoint, format: 'binary' }),
            });"""
          if old not in text:
              raise SystemExit('SuiNS client construction anchor not found')
          resolver.write_text(text.replace(old, new, 1), encoding='utf-8')

          preview = Path('netlify/functions/tree-leaderboard-preview.ts')
          text = preview.read_text(encoding='utf-8')
          old = """          complete: resolution.complete,
                  generatedAt: resolution.generatedAt,"""
          new = """          complete: resolution.complete,
                  generatedAt: resolution.generatedAt,
                  failureReason: resolution.complete ? null : resolution.networkError,"""
          if old not in text:
              raise SystemExit('Preview identity metadata anchor not found')
          preview.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/use-binary-suins-transport.yml
          git diff --check
      - name: Validate binary transport
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          git diff --check
      - name: Commit transport update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Use binary gRPC transport for SuiNS resolution"
          git push origin HEAD:feature/command-center-ui-v2
