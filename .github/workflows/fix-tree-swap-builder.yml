name: Correct and harden the TREE swap builders

on:
  push:
    branches:
      - feature/tree-aggregated-swap-v1
    paths:
      - '.github/workflows/fix-tree-swap-builder.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-aggregated-swap-v1
          fetch-depth: 0

      - name: Match the verified SuiDex builders exactly
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('dapp/swap-router.js')
          text = path.read_text(encoding='utf-8')
          old_exact = """function exactType(value) {
            return normalizeType(value) === normalizeType(SUI_TYPE) ? SUI_TYPE : TREE_TYPE;
          }"""
          new_exact = """function exactType(value) {
            const normalized = normalizeType(value);
            if (normalized === normalizeType(SUI_TYPE)) return SUI_TYPE;
            if (normalized === normalizeType(TREE_TYPE)) return TREE_TYPE;
            throw new Error('Unsupported coin type in route metadata.');
          }"""
          if old_exact not in text:
              raise SystemExit('Could not locate exactType helper.')
          text = text.replace(old_exact, new_exact, 1)
          old_target = "swap_exact_tokens1_for_token0"
          new_target = "swap_exact_tokens1_for_tokens0"
          if old_target not in text:
              raise SystemExit('Could not locate the reverse V2 target.')
          text = text.replace(old_target, new_target, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/tree-swap-client-source.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          anchor = "assert.equal(swap.includes('ALLOWED_MOVE_PACKAGES'), true);"
          addition = """assert.equal(swap.includes('ALLOWED_MOVE_PACKAGES'), true);
          assert.equal(swap.includes('swap_exact_tokens1_for_tokens0'), true);
          assert.equal(swap.includes('swap_exact_tokens1_for_token0\''), false);
          assert.equal(swap.includes(\"throw new Error('Unsupported coin type in route metadata.')\"), true);"""
          if anchor not in test:
              raise SystemExit('Could not locate swap source-test anchor.')
          test_path.write_text(test.replace(anchor, addition, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-tree-swap-builder.yml
          git diff --check

      - name: Revalidate swap and existing systems
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node --check dapp/swap-router.js
          node --check scripts/wallet.js
          node tests/tree-swap-client-source.test.mjs
          npx --yes tsx tests/tree-swap-route.test.ts
          node tests/wallet-manager-core.test.mjs
          node tests/wallet-manager-source.test.mjs
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          swap = Path('dapp/swap-router.js').read_text(encoding='utf-8')
          assert 'swap_exact_tokens0_for_tokens1' in swap
          assert 'swap_exact_tokens1_for_tokens0' in swap
          assert "swap_exact_tokens1_for_token0'" not in swap
          assert "Unsupported coin type in route metadata" in swap
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in Path('dapp/app.js').read_text(encoding='utf-8')
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Correct and harden the TREE swap builders"
          git push origin HEAD:feature/tree-aggregated-swap-v1