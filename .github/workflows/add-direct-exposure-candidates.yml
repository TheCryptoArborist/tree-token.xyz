name: Expose complete direct TREE candidates for total exposure

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/add-direct-exposure-candidates.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Add complete-only direct exposure candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          provider_path = Path('netlify/lib/sui-graphql-leaderboard-provider.ts')
          text = provider_path.read_text(encoding='utf-8')

          replacements = [
              (
                  "} from './leaderboard-provider.ts';\n",
                  "} from './leaderboard-provider.ts';\nimport type { DirectExposureCandidate } from './tree-exposure-types.ts';\n",
              ),
              (
                  "  randomImpl?: () => number;\n};",
                  "  randomImpl?: () => number;\n  includeExposureCandidates?: boolean;\n};",
              ),
              (
                  "  entries: DirectTreeEntry[];\n  warnings: string[];",
                  "  entries: DirectTreeEntry[];\n  exposureCandidates: DirectExposureCandidate[] | null;\n  warnings: string[];",
              ),
              (
                  "}\n\nexport function reconcile(addressOwnedRaw: bigint, coinDecimals: number, totalSupplyRaw: bigint): Reconciliation {",
                  "}\n\nfunction buildExposureCandidates(candidates: Map<string, Candidate>): DirectExposureCandidate[] {\n"
                  "  return [...candidates.values()]\n"
                  "    .sort((left, right) => compareBigIntDescending(left.raw, right.raw) || left.wallet.localeCompare(right.wallet))\n"
                  "    .map((candidate) => ({\n"
                  "      wallet: candidate.wallet,\n"
                  "      suinsName: null,\n"
                  "      directTreeRaw: candidate.raw.toString(),\n"
                  "      coinObjectCount: candidate.coinObjectCount,\n"
                  "    }));\n"
                  "}\n\nexport function reconcile(addressOwnedRaw: bigint, coinDecimals: number, totalSupplyRaw: bigint): Reconciliation {",
              ),
              (
                  "  const entries = complete && verifiedCoinDecimals !== null && verifiedTotalSupplyRaw !== null\n    ? buildEntries(rankingCandidates, verifiedCoinDecimals, verifiedTotalSupplyRaw)\n    : [];\n  const warnings =",
                  "  const entries = complete && verifiedCoinDecimals !== null && verifiedTotalSupplyRaw !== null\n"
                  "    ? buildEntries(rankingCandidates, verifiedCoinDecimals, verifiedTotalSupplyRaw)\n"
                  "    : [];\n"
                  "  const exposureCandidates = complete && options.includeExposureCandidates\n"
                  "    ? buildExposureCandidates(rankingCandidates)\n"
                  "    : null;\n"
                  "  const warnings =",
              ),
              (
                  "    excludedCount: coverage.excludedCoinObjects,\n    entries,\n    warnings,",
                  "    excludedCount: coverage.excludedCoinObjects,\n    entries,\n    exposureCandidates,\n    warnings,",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one provider match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          provider_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/sui-graphql-leaderboard-provider.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_call = "const complete = await scanSuiGraphqlLeaderboard({ fetchImpl: twoPages.fetchImpl, pageSize: 50, maxPages: 4, maxScanMs: 10_000 });"
          new_call = "const complete = await scanSuiGraphqlLeaderboard({ fetchImpl: twoPages.fetchImpl, pageSize: 50, maxPages: 4, maxScanMs: 10_000, includeExposureCandidates: true });"
          if test.count(old_call) != 1:
              raise SystemExit('Expected complete fixture call was not found exactly once.')
          test = test.replace(old_call, new_call)

          anchor = "assert.equal(complete.entries.some((entry) => entry.wallet === pool), false);\n"
          insertion = (
              anchor
              + "assert.ok(complete.exposureCandidates);\n"
              + "assert.equal(complete.exposureCandidates.length, 3);\n"
              + "assert.equal(complete.exposureCandidates[0].wallet, address('a'));\n"
              + "assert.equal(complete.exposureCandidates[0].directTreeRaw, exactA.toString());\n"
              + "assert.equal(complete.exposureCandidates[0].coinObjectCount, 2);\n"
              + "assert.equal(complete.exposureCandidates.some((entry) => entry.wallet === pool), false);\n"
          )
          if test.count(anchor) != 1:
              raise SystemExit('Expected complete fixture assertion anchor was not found exactly once.')
          test = test.replace(anchor, insertion)

          limited_anchor = "assert.deepEqual(pageLimited.entries, []);\n"
          if test.count(limited_anchor) != 1:
              raise SystemExit('Expected page-limit assertion anchor was not found exactly once.')
          test = test.replace(limited_anchor, limited_anchor + "assert.equal(pageLimited.exposureCandidates, null);\n")
          test_path.write_text(test, encoding='utf-8')
          PY
          rm -f .github/workflows/add-direct-exposure-candidates.yml
          git diff --check

      - name: Build and run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do
            echo "Running $test"
            npx --yes tsx "$test"
          done
          git diff --check

      - name: Commit verified exposure candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Expose complete direct TREE candidates for total exposure"
          git push origin HEAD:feature/leaderboard-exposure-v1
