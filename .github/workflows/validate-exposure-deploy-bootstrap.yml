name: Validate preview deploy exposure bootstrap

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/validate-exposure-deploy-bootstrap.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Build and run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do
            echo "Running $test"
            npx --yes tsx "$test"
          done
          python - <<'PY'
          from pathlib import Path
          event = Path('netlify/functions/tree-exposure-on-deploy.ts').read_text(encoding='utf-8')
          assert 'deploySucceeded' in event
          assert "context !== 'deploy-preview'" in event
          assert 'TREE_EXPOSURE_PREVIEW_BRANCH' in event
          assert 'TREE_EXPOSURE_AUTO_BOOTSTRAP' in event
          assert 'TREE_LEADERBOARD_REFRESH_SECRET' in event
          assert 'runExposureBackgroundWorker' in event
          assert 'readCompleteExposureSnapshot' in event
          PY
          git diff --check

      - name: Remove temporary validation workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-exposure-deploy-bootstrap.yml
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Add preview deploy exposure bootstrap"
          git push origin HEAD:feature/leaderboard-exposure-v1
