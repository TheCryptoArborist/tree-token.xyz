name: Apply isolated TREE badge index architecture

on:
  push:
    branches:
      - feature/leaderboard-badges-v1
    paths:
      - '.github/workflows/apply-badge-index-architecture.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-badges-v1
          fetch-depth: 0

      - name: Separate badge indexing from exposure ranking
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-badge-index-architecture.py
          rm -f scripts/apply-badge-index-architecture.py .github/workflows/apply-badge-index-architecture.yml
          git diff --check

      - name: Validate isolated indexes and existing safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          runner = Path('netlify/lib/tree-exposure-scan-runner.ts').read_text(encoding='utf-8')
          worker = Path('netlify/lib/tree-badge-background-worker.ts').read_text(encoding='utf-8')
          app = Path('dapp/app.js').read_text(encoding='utf-8')
          assert 'scanTreeTradingActivity' not in runner
          assert 'scanTreeBurnContributions' not in runner
          assert 'badgeEntries' not in runner
          assert 'refreshTreeActivityIndex' in worker
          assert 'refreshTreeBurnIndex' in worker
          assert "const badgeUrl = isDeployPreview ? '/api/tree-badges'" in app
          assert 'mergeBehaviorBadgeSnapshot' in app
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          PY
          git diff --check

      - name: Commit isolated badge architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Separate TREE behavioral badge indexes"
          git push origin HEAD:feature/leaderboard-badges-v1
