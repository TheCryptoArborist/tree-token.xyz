name: Verify published TREE swap after sell fix

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/verify-published-tree-swap-after-fix.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Verify published best-route UI and all four Sui simulations
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const BASE='https://deploy-preview-11--tree-token.netlify.app';
          const SUI='0x2::sui::SUI';
          const TREE='0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          const sleep=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
          async function json(url){let error;for(let attempt=1;attempt<=10;attempt++){try{const response=await fetch(url,{headers:{accept:'application/json'}});const text=await response.text();if(!response.ok)throw Error(`HTTP ${response.status}: ${text.slice(0,200)}`);return JSON.parse(text)}catch(caught){error=caught;if(attempt<10)await sleep(Math.min(750*2**(attempt-1),6000))}}throw error}
          const quote=(tokenIn,tokenOut,amountIn)=>json(`${BASE}/api/tree-swap-quote?${new URLSearchParams({tokenIn,tokenOut,amountIn,slippageBps:'100'})}`);
          (async()=>{
            const [buy,sell,exposure]=await Promise.all([quote(SUI,TREE,'100000000'),quote(TREE,SUI,'10000000000'),json(`${BASE}/api/tree-exposure-preview`)]);
            for(const [name,payload] of [['buy',buy],['sell',sell]]){const venues=new Set(payload.routes?.map(route=>route.venue));if(payload.status!=='ok'||payload.routes?.length!==2||!venues.has('suidex')||!venues.has('v3'))throw Error(`${name} quote invalid: ${JSON.stringify(payload)}`);if(payload.selectedRoute.amountOut!==payload.routes[0].amountOut)throw Error(`${name} did not select the highest sorted output.`)}
            if(buy.decimalsIn!==9||buy.decimalsOut!==6||sell.decimalsIn!==6||sell.decimalsOut!==9)throw Error('Incorrect decimals.');
            if(!['ok','stale'].includes(exposure.status)||exposure.entries?.length!==50)throw Error(`Exposure unavailable: ${JSON.stringify({status:exposure.status,entries:exposure.entries?.length})}`);
            const candidates=exposure.entries.map(entry=>entry.wallet||entry.address).filter(owner=>/^0x[0-9a-f]{64}$/i.test(owner||''));
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            const desktop=await browser.newPage();
            const errors=[];desktop.on('pageerror',error=>errors.push(error.message));desktop.on('console',message=>{const text=message.text();if(message.type()==='error'&&!/api\.slush\.app|metadata|Failed to load resource/i.test(text))errors.push(text)});
            await desktop.goto(`${BASE}/dapp/#swap`,{waitUntil:'networkidle2',timeout:120000});
            await desktop.type('#swapAmountIn','0.1');
            await desktop.waitForFunction(()=>document.querySelectorAll('.swap-route-candidate').length===2,{timeout:120000});
            const ui=await desktop.evaluate(()=>({active:document.body.dataset.activePanel,output:document.querySelector('#swapAmountOut')?.value,route:document.querySelector('#swapRouteLabel')?.textContent,candidates:[...document.querySelectorAll('.swap-route-candidate')].map(node=>node.textContent.trim()),minimum:document.querySelector('#swapMinReceived')?.textContent,impact:document.querySelector('#swapPriceImpact')?.textContent,action:document.querySelector('#buyTree')?.textContent,disabled:document.querySelector('#buyTree')?.disabled,overflow:document.documentElement.scrollWidth-innerWidth}));
            if(ui.active!=='swap'||!ui.output||ui.candidates.length!==2||!ui.minimum||!ui.impact||ui.action!=='Connect Wallet'||ui.disabled||ui.overflow>1)throw Error(`Published UI invalid: ${JSON.stringify(ui)}`);
            const verification=await desktop.evaluate(async({candidates,buy,sell,SUI,TREE})=>{const {SuiGrpcClient}=await import('https://esm.run/@mysten/sui@2.23.1/grpc');const swap=await import('/dapp/swap-router.js');const client=new SuiGrpcClient({network:'mainnet',baseUrl:'https://fullnode.mainnet.sui.io:443'});let owner=null;let balances=null;for(const candidate of candidates){const [sui,tree]=await Promise.all([client.core.getBalance({owner:candidate,coinType:SUI}),client.core.getBalance({owner:candidate,coinType:TREE})]);const suiRaw=BigInt(sui.balance.balance||'0');const treeRaw=BigInt(tree.balance.balance||'0');if(suiRaw>=1000000000n&&treeRaw>=10000000000n){owner=candidate;balances={sui:suiRaw.toString(),tree:treeRaw.toString()};break}}if(!owner)throw Error('No simulation owner found.');const results=[];for(const [direction,payload] of Object.entries({buy,sell})){for(const route of payload.routes){try{const tx=await swap.buildTransaction(owner,route,BigInt(payload.amountIn));const bytes=await tx.build({client});const simulated=await client.core.simulateTransaction({transaction:bytes,include:{effects:true,balanceChanges:true}});const transaction=simulated.$kind==='Transaction'?simulated.Transaction:null;results.push({direction,venue:route.venueLabel,kind:simulated.$kind,success:transaction?.effects?.status?.success===true,error:simulated.FailedTransaction?.status?.error?.message||transaction?.effects?.status?.error?.message||transaction?.effects?.status?.error||null,balanceChanges:transaction?.balanceChanges?.length||0})}catch(error){results.push({direction,venue:route.venueLabel,kind:'builder-error',success:false,error:error?.message||String(error),balanceChanges:0})}}}return{owner,balances,results}}, {candidates,buy,sell,SUI,TREE});
            if(errors.length)throw Error(`Browser errors: ${JSON.stringify(errors)}`);if(verification.results.length!==4||verification.results.some(result=>result.kind!=='Transaction'||!result.success))throw Error(`Published simulations failed: ${JSON.stringify(verification)}`);
            const mobile=[];for(const viewport of [{width:390,height:844},{width:360,height:800}]){const page=await browser.newPage();await page.setViewport(viewport);await page.goto(`${BASE}/dapp/#swap`,{waitUntil:'networkidle2',timeout:120000});await page.type('#swapAmountIn','0.1');await page.waitForFunction(()=>document.querySelectorAll('.swap-route-candidate').length===2,{timeout:120000});const state=await page.evaluate(()=>({output:document.querySelector('#swapAmountOut')?.value,candidates:document.querySelectorAll('.swap-route-candidate').length,overflow:document.documentElement.scrollWidth-innerWidth}));if(!state.output||state.candidates!==2||state.overflow>1)throw Error(`Mobile invalid: ${JSON.stringify({viewport,state})}`);mobile.push({viewport,state});await page.close()}
            await browser.close();
            console.log(JSON.stringify({classification:'TREE_PUBLISHED_BEST_ROUTE_SWAP_VERIFIED',buy:{selected:buy.selectedRoute.venueLabel,amountOut:buy.selectedRoute.amountOut,routes:buy.routes.map(route=>({venue:route.venueLabel,amountOut:route.amountOut,impact:route.priceImpactPercent}))},sell:{selected:sell.selectedRoute.venueLabel,amountOut:sell.selectedRoute.amountOut,routes:sell.routes.map(route=>({venue:route.venueLabel,amountOut:route.amountOut,impact:route.priceImpactPercent}))},simulationOwner:`${verification.owner.slice(0,8)}…${verification.owner.slice(-6)}`,balances:verification.balances,simulations:verification.results,ui,mobile},null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Verify public review endpoints
        shell: bash
        run: |
          set -euo pipefail
          quote='https://deploy-preview-11--tree-token.netlify.app/api/tree-swap-quote?tokenIn=0x2%3A%3Asui%3A%3ASUI&tokenOut=0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf%3A%3Atree%3A%3ATREE&amountIn=100000000&slippageBps=100'
          for url in 'https://deploy-preview-11--tree-token.netlify.app/' 'https://deploy-preview-11--tree-token.netlify.app/dapp/' "$quote"; do
            code=$(curl --retry 10 --retry-all-errors --retry-delay 1 --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 60 "$url")
            echo "$code $url"
            [[ "$code" == '200' ]]
          done