name: Diagnose SuiNS preview resolution

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/diagnose-suins-preview.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0

      - name: Probe SuiNS GraphQL endpoints safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen('https://tree-token.xyz/api/tree-leaderboard', timeout=60) as response:
              leaderboard = json.load(response)
          wallets = [entry['wallet'] for entry in leaderboard.get('entries', []) if entry.get('wallet')]
          assert wallets, 'Production leaderboard returned no wallets.'

          endpoints = [
              'https://graphql.mainnet.sui.io/graphql',
              'https://sui-mainnet.mystenlabs.com/graphql',
          ]

          def post(endpoint, payload):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json', 'Accept': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode(errors='replace')
                  try:
                      parsed = json.loads(body)
                  except Exception:
                      parsed = {'body': body[:500]}
                  return error.code, parsed
              except Exception as error:
                  return None, {'networkError': type(error).__name__ + ': ' + str(error)}

          one_query = {
              'query': 'query Resolve($address: SuiAddress!) { address(address: $address) { defaultSuinsName } }',
              'variables': {'address': wallets[0]},
          }
          aliases = wallets[:50]
          definitions = ', '.join(f'$address{i}: SuiAddress!' for i in range(len(aliases)))
          fields = '\n'.join(f'name{i}: address(address: $address{i}) {{ defaultSuinsName }}' for i in range(len(aliases)))
          many_query = {
              'query': f'query ResolveMany({definitions}) {{\n{fields}\n}}',
              'variables': {f'address{i}': wallet for i, wallet in enumerate(aliases)},
          }

          for endpoint in endpoints:
              one_status, one_payload = post(endpoint, one_query)
              many_status, many_payload = post(endpoint, many_query)
              one_errors = [item.get('message', 'unknown') for item in one_payload.get('errors', [])]
              many_errors = [item.get('message', 'unknown') for item in many_payload.get('errors', [])]
              one_name = ((one_payload.get('data') or {}).get('address') or {}).get('defaultSuinsName')
              many_data = many_payload.get('data') or {}
              resolved = sum(1 for item in many_data.values() if isinstance(item, dict) and item.get('defaultSuinsName'))
              print(json.dumps({
                  'endpoint': endpoint,
                  'oneStatus': one_status,
                  'oneErrors': one_errors,
                  'oneResolved': bool(one_name),
                  'manyStatus': many_status,
                  'manyErrors': many_errors[:5],
                  'manyFieldsReturned': len(many_data),
                  'manyResolved': resolved,
              }, indent=2))
          PY

      - name: Remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/diagnose-suins-preview.yml \
            .github/workflows/verify-suins-preview.yml \
            .github/workflows/fix-suins-enrichment-workflow.yml
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary SuiNS diagnostics"
          git push origin HEAD:feature/command-center-ui-v2
