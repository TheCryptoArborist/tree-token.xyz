name: Switch SuiNS resolution to Sui gRPC

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/switch-suins-to-grpc.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0
      - name: Apply gRPC SuiNS resolver
        shell: bash
        run: |
          set -euo pipefail
          python scripts/switch-suins-to-grpc.py
          rm -f scripts/switch-suins-to-grpc.py .github/workflows/switch-suins-to-grpc.yml
          git diff --check
      - name: Validate gRPC SuiNS resolver
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python - <<'PY'
          from pathlib import Path
          resolver = Path('netlify/lib/suins-name-resolver.ts').read_text(encoding='utf-8')
          preview = Path('netlify/functions/tree-leaderboard-preview.ts').read_text(encoding='utf-8')
          worker = Path('netlify/lib/leaderboard-background-worker.ts').read_text(encoding='utf-8')
          assert "SuiGrpcClient" in resolver
          assert "fullnode.mainnet.sui.io:443" in resolver
          assert "isExpectedMissingName" in resolver
          assert "sui-grpc-default-suins-name" in preview
          assert "resolution.complete ? 'public" in preview
          assert "resolveSuins(result.entries.map((entry) => entry.wallet))" in worker
          assert "DAPP_SWAP_EXECUTION_ENABLED = false" in Path('dapp/app.js').read_text(encoding='utf-8')
          PY
          git diff --check
      - name: Commit gRPC SuiNS resolver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Resolve TREE leaderboard SuiNS names through gRPC"
          git push origin HEAD:feature/command-center-ui-v2
