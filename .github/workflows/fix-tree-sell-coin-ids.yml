name: Fix TREE sell coin object IDs

on:
  push:
    branches:
      - feature/tree-aggregated-swap-v1
    paths:
      - '.github/workflows/fix-tree-sell-coin-ids.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-aggregated-swap-v1
          fetch-depth: 0

      - name: Use the normalized gRPC coin object ID field
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('dapp/swap-router.js')
          text = path.read_text(encoding='utf-8')
          if text.count('.coinObjectId') != 2:
              raise SystemExit(f'Expected two legacy coinObjectId reads, found {text.count(".coinObjectId")}.')
          text = text.replace('selected[0].coinObjectId', 'selected[0].objectId', 1)
          text = text.replace('coin.coinObjectId', 'coin.objectId', 1)
          guard = """  if (selected.some((coin) => typeof coin.objectId !== 'string' || !coin.objectId.startsWith('0x'))) {
            throw new Error('The Sui coin response did not contain valid object IDs.');
          }
          """
          anchor = "  if (selected.length > 500) throw new Error('Too many TREE coin objects are required. Merge coin objects or use a smaller amount.');\n"
          if anchor not in text:
              raise SystemExit('Could not locate selected-coin safety anchor.')
          text = text.replace(anchor, anchor + guard, 1)
          path.write_text(text, encoding='utf-8')

          source_path = Path('tests/tree-swap-client-source.test.mjs')
          source = source_path.read_text(encoding='utf-8')
          anchor = "assert.equal(swap.includes('ALLOWED_MOVE_PACKAGES'), true);"
          addition = """assert.equal(swap.includes('ALLOWED_MOVE_PACKAGES'), true);
          assert.equal(swap.includes('selected[0].objectId'), true);
          assert.equal(swap.includes('coin.objectId'), true);
          assert.equal(swap.includes('coinObjectId'), false);"""
          if anchor not in source:
              raise SystemExit('Could not locate swap source-test anchor.')
          source_path.write_text(source.replace(anchor, addition, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-tree-sell-coin-ids.yml
          git diff --check

      - name: Validate build and all existing tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/swap-router.js
          node --check scripts/wallet.js
          node tests/sui-grpc-client-migration.test.mjs
          node tests/tree-swap-client-source.test.mjs
          npx --yes tsx tests/tree-swap-route.test.ts
          node tests/wallet-manager-core.test.mjs
          node tests/wallet-manager-source.test.mjs
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          git diff --check

      - name: Verify all four direct TREE builders against Sui Mainnet
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core@24
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tree-sell-coin-ids.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const SUI='0x2::sui::SUI';
          const TREE='0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          const quoteUrl=(tokenIn,tokenOut,amountIn)=>`https://deploy-preview-11--tree-token.netlify.app/api/tree-swap-quote?${new URLSearchParams({tokenIn,tokenOut,amountIn,slippageBps:'100'})}`;
          const sleep=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
          async function json(url){let error;for(let attempt=1;attempt<=8;attempt++){try{const response=await fetch(url);if(!response.ok)throw Error(`HTTP ${response.status}`);return await response.json()}catch(caught){error=caught;if(attempt<8)await sleep(Math.min(700*2**(attempt-1),5000))}}throw error}
          (async()=>{
            const [buy,sell,exposure]=await Promise.all([json(quoteUrl(SUI,TREE,'100000000')),json(quoteUrl(TREE,SUI,'10000000000')),json('https://tree-token.xyz/api/tree-exposure')]);
            if(buy.routes?.length!==2||sell.routes?.length!==2)throw Error('Both V2 and V3 quotes are required.');
            const candidates=(exposure.entries||[]).map(entry=>entry.wallet||entry.address).filter(owner=>/^0x[0-9a-f]{64}$/i.test(owner||''));
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:4173/dapp/#swap',{waitUntil:'networkidle2',timeout:120000});
            const result=await page.evaluate(async({candidates,buy,sell,SUI,TREE})=>{
              const {SuiGrpcClient}=await import('https://esm.run/@mysten/sui@2.23.1/grpc');
              const swap=await import('/dapp/swap-router.js');
              const client=new SuiGrpcClient({network:'mainnet',baseUrl:'https://fullnode.mainnet.sui.io:443'});
              let owner=null;let balances=null;
              for(const candidate of candidates){const [sui,tree]=await Promise.all([client.core.getBalance({owner:candidate,coinType:SUI}),client.core.getBalance({owner:candidate,coinType:TREE})]);const suiRaw=BigInt(sui.balance.balance||'0');const treeRaw=BigInt(tree.balance.balance||'0');if(suiRaw>=1000000000n&&treeRaw>=10000000000n){owner=candidate;balances={sui:suiRaw.toString(),tree:treeRaw.toString()};break}}
              if(!owner)throw Error('No dry-run owner found.');
              const results=[];
              for(const [direction,quote] of Object.entries({buy,sell})){for(const route of quote.routes){try{const tx=await swap.buildTransaction(owner,route,BigInt(quote.amountIn));const bytes=await tx.build({client});const response=await client.core.simulateTransaction({transaction:bytes,include:{effects:true,balanceChanges:true}});const transaction=response.$kind==='Transaction'?response.Transaction:null;results.push({direction,venue:route.venueLabel,kind:response.$kind,success:transaction?.effects?.status?.success===true,error:response.FailedTransaction?.status?.error?.message||transaction?.effects?.status?.error?.message||transaction?.effects?.status?.error||null,balanceChanges:transaction?.balanceChanges?.length||0})}catch(error){results.push({direction,venue:route.venueLabel,kind:'builder-error',success:false,error:error?.message||String(error),balanceChanges:0})}}}
              return{owner,balances,results};
            },{candidates,buy,sell,SUI,TREE});
            await browser.close();
            if(result.results.length!==4||result.results.some(item=>item.kind!=='Transaction'||!item.success))throw Error(JSON.stringify(result));
            console.log(JSON.stringify({classification:'TREE_ALL_DIRECT_SWAP_BUILDERS_VERIFIED',owner:`${result.owner.slice(0,8)}…${result.owner.slice(-6)}`,balances:result.balances,results:result.results,buySelected:buy.selectedRoute.venueLabel,sellSelected:sell.selectedRoute.venueLabel},null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          git checkout -- package.json package-lock.json 2>/dev/null || true

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Fix TREE sell coin object IDs"
          git push origin HEAD:feature/tree-aggregated-swap-v1