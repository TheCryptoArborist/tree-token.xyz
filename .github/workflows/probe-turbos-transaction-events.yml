name: Inspect Turbos TREE transaction events

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/probe-turbos-transaction-events.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Inspect previous transaction and event schemas
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/probe-turbos-transaction-events.ts <<'TS'
          import { ChannelCredentials } from '@grpc/grpc-js';
          import { GrpcTransport } from '@protobuf-ts/grpc-transport';
          import { SuiGrpcClient } from '@mysten/sui/grpc';

          const NFT_ID = '0x4b0bcbb056dfba0ef2c3f195c7fd2483aec8410d0f454a173620819b20ba2eaf';
          const GRAPHQL = 'https://graphql.mainnet.sui.io/graphql';
          const client = new SuiGrpcClient({
            network: 'mainnet',
            transport: new GrpcTransport({
              host: 'fullnode.mainnet.sui.io:443',
              channelCredentials: ChannelCredentials.createSsl(),
            }),
          });

          async function gql(query: string, variables: Record<string, unknown> = {}) {
            const response = await fetch(GRAPHQL, {
              method: 'POST',
              headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });
            return { status: response.status, payload: await response.json() as any };
          }

          const schema = await gql(`query {
            transaction: __type(name: "Transaction") { fields { name args { name type { kind name ofType { kind name } } } type { kind name ofType { kind name } } } }
            effects: __type(name: "TransactionEffects") { fields { name type { kind name ofType { kind name } } } }
            moveValue: __type(name: "MoveValue") { fields { name type { kind name ofType { kind name } } } }
            moveType: __type(name: "MoveType") { fields { name type { kind name ofType { kind name } } } }
            query: __type(name: "Query") { fields { name args { name type { kind name ofType { kind name } } } type { kind name ofType { kind name } } } }
          }`);
          console.log('SCHEMA', schema.status, JSON.stringify(schema.payload, null, 2));

          const previous = await gql(`query Previous($address: SuiAddress!) {
            object(address: $address) {
              address
              version
              previousTransaction { digest }
            }
          }`, { address: NFT_ID });
          console.log('PREVIOUS', previous.status, JSON.stringify(previous.payload, null, 2));
          const digest = previous.payload?.data?.object?.previousTransaction?.digest;
          if (typeof digest !== 'string') throw new Error('Previous transaction digest was not returned.');

          const core = client.core as any;
          for (const include of [
            { events: true, effects: true, input: true, balanceChanges: true, objectTypes: true },
            { events: true, effects: true },
            {},
          ]) {
            try {
              const transaction = await core.getTransaction({ digest, include });
              console.log('GRPC_TRANSACTION', JSON.stringify({ include, transaction }, null, 2));
              break;
            } catch (error) {
              console.log('GRPC_TRANSACTION_ERROR', JSON.stringify({ include, error: error instanceof Error ? error.message : String(error) }));
            }
          }

          const transactionGraphql = await gql(`query TransactionByDigest($digest: String!) {
            transactionBlock: transactionBlock(digest: $digest) { digest }
            transaction: transaction(digest: $digest) { digest }
          }`, { digest });
          console.log('TRANSACTION_ROOT_CANDIDATES', transactionGraphql.status, JSON.stringify(transactionGraphql.payload, null, 2));
          TS
          npx --yes tsx scripts/probe-turbos-transaction-events.ts

      - name: Remove temporary probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-turbos-transaction-events.yml scripts/probe-turbos-transaction-events.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Turbos transaction event discovery"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
