name: Verify production snapshot

on:
  push:
    branches: [main, sync/production-20260915]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify:production
      - run: npm run build
