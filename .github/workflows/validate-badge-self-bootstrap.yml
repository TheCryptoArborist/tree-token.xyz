name: Validate TREE badge self-bootstrap

on:
  push:
    branches:
      - feature/leaderboard-badges-v1
    paths:
      - '.github/workflows/validate-badge-self-bootstrap.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-badges-v1
          fetch-depth: 0
      - name: Run full validation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          endpoint=Path('netlify/lib/tree-badge-snapshot-endpoint.ts').read_text(encoding='utf-8')
          assert "new URL('/.netlify/functions/tree-badges-refresh-background', request.url)" in endpoint
          assert "context === 'deploy-preview'" in endpoint
          assert "TREE_BADGE_AUTO_BOOTSTRAP" in endpoint
          exposure=Path('netlify/lib/tree-exposure-scan-runner.ts').read_text(encoding='utf-8')
          assert 'scanTreeTradingActivity' not in exposure
          assert 'scanTreeBurnContributions' not in exposure
          PY
          git diff --check
      - name: Remove workflow and commit validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-badge-self-bootstrap.yml
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Validate TREE badge self-bootstrap"
          git push origin HEAD:feature/leaderboard-badges-v1
