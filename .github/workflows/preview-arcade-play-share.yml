name: Preview Arcade play then share
on:
  push:
    branches: [feature/arcade-play-then-share]
permissions:
  contents: read
concurrency:
  group: tree-production-preservation-release
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate result gating and session navigation
        run: |
          npm install --prefix /tmp/arcade-test jsdom@26 --no-audit --no-fund
          ARCADE_TEST_JSDOM=/tmp/arcade-test/node_modules/jsdom/lib/api.js node --test tests/arcade-play-share*.test.mjs
          node scripts/build-production-snapshot.mjs
          node scripts/verify-production-snapshot.mjs
          git diff --check
      - name: Add isolated preview while preserving current production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          node scripts/arcade-play-share/release.mjs candidate preview
          node scripts/arcade-play-share/release.mjs verify preview
          node scripts/arcade-play-share/release.mjs publish preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-play-share-preview
          path: .netlify/arcade-play-share-preview/report.json
          include-hidden-files: true
          if-no-files-found: ignore
