name: Trace Turbos TREE position creation event

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/probe-turbos-creation-event.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Trace NFT history and inspect creation transaction events
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/probe-turbos-creation-event.ts <<'TS'
          const NFT_ID = '0x4b0bcbb056dfba0ef2c3f195c7fd2483aec8410d0f454a173620819b20ba2eaf';
          const GRAPHQL = 'https://graphql.mainnet.sui.io/graphql';
          type Rec = Record<string, unknown>;
          const record = (value: unknown): Rec => value && typeof value === 'object' && !Array.isArray(value) ? value as Rec : {};

          async function gql(label: string, query: string, variables: Rec = {}) {
            const response = await fetch(GRAPHQL, {
              method: 'POST',
              headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });
            const payload = await response.json() as Rec;
            console.log(label, response.status, JSON.stringify(payload, null, 2));
            return { status: response.status, payload };
          }

          await gql('FILTER_SCHEMAS', `query {
            eventFilter: __type(name: "EventFilter") { inputFields { name type { kind name ofType { kind name } } } }
            transactionFilter: __type(name: "TransactionFilter") { inputFields { name type { kind name ofType { kind name } } } }
            objectChange: __type(name: "ObjectChange") { kind possibleTypes { name } }
            eventConnection: __type(name: "EventConnection") { fields { name type { kind name ofType { kind name } } } }
          }`);

          const history = await gql('OBJECT_HISTORY', `query ObjectHistory($address: SuiAddress!) {
            firstVersions: objectVersions(address: $address, first: 10) {
              pageInfo { hasNextPage hasPreviousPage startCursor endCursor }
              nodes {
                address
                version
                digest
                previousTransaction { digest }
                asMoveObject { contents { json } }
              }
            }
            lastVersions: objectVersions(address: $address, last: 10) {
              pageInfo { hasNextPage hasPreviousPage startCursor endCursor }
              nodes {
                address
                version
                digest
                previousTransaction { digest }
                asMoveObject { contents { json } }
              }
            }
          }`, { address: NFT_ID });

          const data = record(history.payload.data);
          const firstNodes = Array.isArray(record(data.firstVersions).nodes) ? record(data.firstVersions).nodes as Rec[] : [];
          const lastNodes = Array.isArray(record(data.lastVersions).nodes) ? record(data.lastVersions).nodes as Rec[] : [];
          const all = [...firstNodes, ...lastNodes]
            .filter((node) => typeof node.version === 'number')
            .sort((a, b) => Number(a.version) - Number(b.version));
          const oldest = all[0];
          const newest = all.at(-1);
          console.log('HISTORY_SUMMARY', JSON.stringify({
            firstVersions: firstNodes.map((node) => ({ version: node.version, previous: record(node.previousTransaction).digest })),
            lastVersions: lastNodes.map((node) => ({ version: node.version, previous: record(node.previousTransaction).digest })),
            oldest: oldest ? { version: oldest.version, previous: record(oldest.previousTransaction).digest } : null,
            newest: newest ? { version: newest.version, previous: record(newest.previousTransaction).digest } : null,
          }, null, 2));

          const digests = [...new Set(all
            .map((node) => record(node.previousTransaction).digest)
            .filter((digest): digest is string => typeof digest === 'string'))];
          for (const digest of digests.slice(0, 4)) {
            await gql(`TRANSACTION_${digest}`, `query Transaction($digest: String!) {
              transaction(digest: $digest) {
                digest
                sender { address }
                transactionJson
                effects {
                  status
                  timestamp
                  effectsJson
                  events(first: 100) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      sequenceNumber
                      timestamp
                      sender { address }
                      transactionModule { name package { address } }
                      contents { type { repr } json }
                    }
                  }
                  objectChanges(first: 100) {
                    pageInfo { hasNextPage endCursor }
                    nodes { __typename }
                  }
                }
              }
            }`, { digest });
          }
          TS
          npx --yes tsx scripts/probe-turbos-creation-event.ts

      - name: Remove temporary probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-turbos-creation-event.yml scripts/probe-turbos-creation-event.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Turbos creation event discovery"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
