name: Recover exact live function packages from original artifacts
on:
  push:
    branches: ['feat/bnb-generation-custody']
permissions:
  contents: write
  actions: read
jobs:
  recover:
    if: contains(github.event.head_commit.message, '[recover bnb function archives]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original artifacts without executing their contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recover-bnb-function-archives.py
      - name: Commit hash-matched archives to the same feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/multichain/generation-milestone/package-recovery/recovered.json
          git add -f production/recovered-function-archives/*.zip
          git commit -m 'Archive exact recovered live function packages [skip netlify]'
          git push origin HEAD:feat/bnb-generation-custody
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-live-function-packages
          path: |
            production/recovered-function-archives
            docs/multichain/generation-milestone/package-recovery/recovered.json
