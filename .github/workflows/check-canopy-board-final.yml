name: Run final Canopy Board hierarchy QA

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-canopy-board-final.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Puppeteer
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Verify hierarchy, badges, and responsive layout
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const results = [];
            for (const viewport of [{width:1440,height:1000},{width:390,height:844},{width:360,height:800}]) {
              const page = await browser.newPage();
              await page.setViewport(viewport);
              const errors = [];
              page.on('console', (message) => { if (message.type() === 'error') errors.push(message.text()); });
              page.on('pageerror', (error) => errors.push(error.message));
              await page.goto('https://deploy-preview-6--tree-token.netlify.app/dapp/?canopy_hierarchy_qa=2#leaderboard', { waitUntil: 'networkidle2', timeout: 120000 });
              await page.waitForFunction(() => document.querySelectorAll('.leader-card').length === 50, { timeout: 120000 });
              await page.waitForFunction(() => [...document.querySelectorAll('.leader-badge')].some((node) => node.textContent.includes('Diamond Hands')), { timeout: 120000 });
              const metrics = await page.evaluate(() => {
                const board = document.querySelector('#leaderboard');
                const personal = board?.querySelector('.rank-command-card');
                const top50 = board?.querySelector('.top-board-heading');
                const tiers = board?.querySelector('#tier-guide');
                const methodology = board?.querySelector('.ranking-methodology');
                const position = (first, second) => Boolean(first && second && (first.compareDocumentPosition(second) & Node.DOCUMENT_POSITION_FOLLOWING));
                const unexpectedOverflow = [...document.querySelectorAll('body *')].filter((element) => {
                  if (element.closest('.market-ribbon,.app-nav,.table-wrap')) return false;
                  const style = getComputedStyle(element);
                  if (style.position === 'fixed' || style.position === 'sticky' || style.display === 'none' || style.visibility === 'hidden') return false;
                  const rect = element.getBoundingClientRect();
                  return rect.width > 0 && (rect.left < -1 || rect.right > innerWidth + 1);
                }).map((element) => `${element.tagName}.${String(element.className || '')}`).slice(0, 10);
                const badges = [...new Set([...document.querySelectorAll('.leader-badge')].map((node) => node.textContent.trim()))];
                const canvas = document.querySelector('#profileCanvas');
                return {
                  heading: document.querySelector('#leaderboard-title')?.textContent.trim(),
                  bannerText: document.querySelector('.command-banner')?.textContent || '',
                  personalLabel: personal?.querySelector('.rank-kicker')?.textContent.trim(),
                  top50Heading: top50?.querySelector('h3')?.textContent.trim(),
                  tierSummary: tiers?.querySelector('summary')?.textContent.replace(/\s+/g, ' ').trim(),
                  methodologySummary: methodology?.querySelector('summary')?.textContent.trim(),
                  orderValid: position(personal, top50) && position(top50, tiers) && position(tiers, methodology),
                  tiersClosed: tiers ? !tiers.open : false,
                  methodologyClosed: methodology ? !methodology.open : false,
                  cards: document.querySelectorAll('.leader-card').length,
                  badges,
                  documentWidth: document.documentElement.scrollWidth,
                  bodyWidth: Math.round(document.body.getBoundingClientRect().width),
                  viewportWidth: innerWidth,
                  unexpectedOverflow,
                  canvasSize: canvas ? [canvas.width, canvas.height] : null,
                };
              });
              const failures = [];
              if (metrics.heading !== 'Canopy Board') failures.push('heading');
              if (metrics.bannerText.includes('View Canopy Board')) failures.push('redundant button');
              if (metrics.personalLabel !== 'YOUR CANOPY POSITION') failures.push('personal segment');
              if (metrics.top50Heading !== 'Top 50 Canopy Leaders') failures.push('Top 50 heading');
              if (!metrics.tierSummary?.includes('How TREE Tiers Work')) failures.push('tier guide');
              if (metrics.methodologySummary !== 'How Rankings Are Calculated') failures.push('methodology guide');
              if (!metrics.orderValid || !metrics.tiersClosed || !metrics.methodologyClosed) failures.push('content order/disclosures');
              if (metrics.cards !== 50) failures.push('card count');
              for (const label of ['LP Provider','LP Maxi','Diamond Hands','Burned']) if (!metrics.badges.some((value) => value.includes(label))) failures.push(`missing ${label}`);
              if (metrics.documentWidth > metrics.viewportWidth + 1 || metrics.bodyWidth > metrics.viewportWidth + 1 || metrics.unexpectedOverflow.length) failures.push('overflow');
              if (JSON.stringify(metrics.canvasSize) !== JSON.stringify([1024,1024])) failures.push('Profile Studio canvas');
              if (errors.length) failures.push(`console: ${errors.join(' | ')}`);
              if (failures.length) throw new Error(JSON.stringify({ viewport, failures, metrics }, null, 2));
              results.push({ viewport, metrics });
              await page.close();
            }
            await browser.close();
            console.log(JSON.stringify({ classification: 'SUCCESS', results }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
