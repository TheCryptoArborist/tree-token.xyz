name: Verify leading-decimal TREE swap preview

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/verify-leading-decimal-swap-preview.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Confirm .1 and 0.1 produce the same raw quote amount
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const BASE = 'https://deploy-preview-11--tree-token.netlify.app';

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.CHROME,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            async function verifyInput(input) {
              const page = await browser.newPage();
              await page.goto(`${BASE}/dapp/#swap`, { waitUntil: 'networkidle2', timeout: 120000 });
              await page.waitForSelector('#swapAmountIn', { timeout: 120000 });
              const requestPromise = page.waitForRequest((request) => {
                if (!request.url().includes('/api/tree-swap-quote?')) return false;
                return new URL(request.url()).searchParams.get('amountIn') === '100000000';
              }, { timeout: 120000 });
              await page.type('#swapAmountIn', input);
              const request = await requestPromise;
              await page.waitForFunction(() => {
                const output = document.querySelector('#swapAmountOut')?.value || '';
                return output.length > 0 && document.querySelectorAll('.swap-route-candidate').length === 2;
              }, { timeout: 120000 });
              const state = await page.evaluate(() => ({
                input: document.querySelector('#swapAmountIn')?.value,
                output: document.querySelector('#swapAmountOut')?.value,
                route: document.querySelector('#swapRouteLabel')?.textContent,
                candidates: document.querySelectorAll('.swap-route-candidate').length,
                status: document.querySelector('#swapStatus')?.textContent,
                overflow: document.documentElement.scrollWidth - innerWidth,
              }));
              if (!state.output || state.candidates !== 2 || state.overflow > 1) {
                throw new Error(`Invalid quote state for ${input}: ${JSON.stringify(state)}`);
              }
              const amountInRaw = new URL(request.url()).searchParams.get('amountIn');
              await page.close();
              return { ...state, amountInRaw };
            }

            const leading = await verifyInput('.1');
            const explicit = await verifyInput('0.1');
            if (leading.amountInRaw !== '100000000' || explicit.amountInRaw !== '100000000') {
              throw new Error(`Raw amounts differ: ${JSON.stringify({ leading, explicit })}`);
            }

            await browser.close();
            console.log(JSON.stringify({
              classification: 'TREE_LEADING_DECIMAL_PREVIEW_VERIFIED',
              leading,
              explicit,
            }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
