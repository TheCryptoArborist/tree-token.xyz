name: Retry Turbos exposure optimization

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/retry-optimize-turbos-exposure-refresh.yml'

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0
      - name: Remove the obsolete validation assertion and retrigger
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/assert 'ScanTurbosPositionNfts' not in provider/d" .github/workflows/optimize-turbos-exposure-refresh.yml
          rm -f .github/workflows/retry-optimize-turbos-exposure-refresh.yml
          git diff --check
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Retry optimized Turbos exposure refresh"
          git push origin HEAD:feature/leaderboard-exposure-v1
