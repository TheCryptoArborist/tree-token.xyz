name: Reorder Canopy Board around the connected wallet

on:
  push:
    branches:
      - feature/leaderboard-badges-v1
    paths:
      - '.github/workflows/reorder-canopy-board.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-badges-v1
          fetch-depth: 0

      - name: Apply the approved Canopy Board hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reorder-canopy-board.py
          rm -f scripts/reorder-canopy-board.py .github/workflows/reorder-canopy-board.yml
          git diff --check

      - name: Validate the updated hierarchy and existing safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python - <<'PY'
          from pathlib import Path
          html = Path('dapp/index.html').read_text(encoding='utf-8')
          css = Path('dapp/styles.css').read_text(encoding='utf-8')
          required = ['YOUR CANOPY POSITION', 'Top 50 Canopy Leaders', 'How TREE Tiers Work', 'How Rankings Are Calculated']
          assert all(item in html for item in required)
          assert 'View Canopy Board' not in html
          assert html.index(required[0]) < html.index(required[1]) < html.index(required[2]) < html.index(required[3])
          assert 'Canopy Board information hierarchy' in css
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in Path('dapp/app.js').read_text(encoding='utf-8')
          PY
          git diff --check

      - name: Commit and push the Canopy Board reordering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Put connected wallet first on the Canopy Board"
          git push origin HEAD:feature/leaderboard-badges-v1
