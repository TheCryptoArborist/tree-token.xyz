name: Inspect multichain preservation access
on:
  push:
    branches: [pilot/nftree-multichain-20261112]
    paths: [.github/workflows/inspect-multichain-access.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Compare read-only identity and inventory access
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          // GET requests only. Never print credentials, response bodies, hashes or user details.
          const raw=process.env.NETLIFY_AUTH_TOKEN||'';
          const trimmed=raw.trim();
          const report={checkedAt:new Date().toISOString(),credentialPresent:raw.length>0,outerWhitespace:raw!==trimmed,results:[]};
          const sites=[{label:'tree-token',id:'aa62f324-b880-47d6-85b8-4ba0700ff5bf',deploy:'6af4ef567e67ea8af9abe8ed'},{label:'tree251',id:'f1e13313-0015-44ed-9ff3-821012a9345d',deploy:'6af5d9507ba1638d5f9e87d9'}];
          async function probe(label,resource,token){
            const headers={Accept:'application/json'};
            if(token)headers.Authorization='Bearer '+token;
            try{
              const response=await fetch('https://api.netlify.com/api/v1/'+resource,{method:'GET',headers,redirect:'error',signal:AbortSignal.timeout(20000)});
              let data;try{data=await response.json()}catch{}
              const row={label,status:response.status,isArray:Array.isArray(data),hasFunctions:Array.isArray(data?.available_functions),hasSchedules:Array.isArray(data?.function_schedules)};
              if(resource==='user'&&response.ok)row.matchesConnectedNetlifyUser=data?.id==='69800888d1a3d0483003ae9b';
              if(response.ok&&resource.includes('/deploys/')&&data?.id)row.deployMatchesRequested=resource.endsWith('/'+data.id);
              if(Array.isArray(data))row.returnedItems=data.length;
              report.results.push(row);
            }catch(error){report.results.push({label,requestFailed:true,category:error?.name||'Error'});}
          }
          await probe('anonymous user control','user',null);
          await probe('Actions secret user authentication','user',raw);
          if(raw!==trimmed)await probe('trimmed secret user authentication','user',trimmed);
          for(const site of sites){
            await probe(site.label+' authenticated deploy detail',`sites/${site.id}/deploys/${site.deploy}`,raw);
            await probe(site.label+' authenticated file inventory',`deploys/${site.deploy}/files?per_page=1&page=1`,raw);
            await probe(site.label+' authenticated function inventory',`sites/${site.id}/functions`,raw);
          }
          console.log(JSON.stringify(report,null,2));
          const {appendFile}=await import('node:fs/promises');
          await appendFile(process.env.GITHUB_STEP_SUMMARY,'## Read-only Netlify authentication recheck\n\n```json\n'+JSON.stringify(report,null,2)+'\n```\n\nNo Netlify mutations, secret changes, wallet actions, or deployment attempts.\n');
          NODE
