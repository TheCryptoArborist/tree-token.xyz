name: Inspect multichain preservation access
on:
  push:
    branches: [pilot/nftree-multichain-20261112]
    paths: [.github/workflows/inspect-multichain-access.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect read-only deployment response schemas
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const site='aa62f324-b880-47d6-85b8-4ba0700ff5bf',deploy='6af4ef567e67ea8af9abe8ed';
          const endpoints=[`deploys/${deploy}`,`sites/${site}/deploys/${deploy}`,`sites/${site}/functions`,`deploys/${deploy}/files?per_page=1&page=1`];
          for(const endpoint of endpoints){
            const response=await fetch('https://api.netlify.com/api/v1/'+endpoint,{headers:{Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN,Accept:'application/json'},signal:AbortSignal.timeout(30000)});
            const text=await response.text();let data;try{data=JSON.parse(text)}catch{console.log(JSON.stringify({endpoint,status:response.status,contentType:response.headers.get('content-type'),notJson:true}));continue;}
            const shape=value=>Array.isArray(value)?{type:'array',length:value.length,firstKeys:value[0]&&typeof value[0]==='object'?Object.keys(value[0]):[]}:value===null?{type:'null'}:typeof value==='object'?{type:'object',keys:Object.keys(value)}:{type:typeof value};
            const result={endpoint,status:response.status,contentType:response.headers.get('content-type'),shape:shape(data)};
            if(data&&!Array.isArray(data)&&typeof data==='object'){
              result.fields=Object.fromEntries(Object.entries(data).map(([key,value])=>[key,shape(value)]));
              result.safeStatus={id:data.id,site_id:data.site_id,state:data.state,locked:data.locked};
            }
            console.log(JSON.stringify(result));
          }
          NODE
