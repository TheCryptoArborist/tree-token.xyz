name: Verify simplified TREE homepage

on:
  push:
    branches:
      - feature/tree-navigation-v2
    paths:
      - '.github/workflows/verify-simple-tree-homepage.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-navigation-v2
          fetch-depth: 0

      - name: Validate build and existing safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check scripts/home-v2.js
          node --check scripts/info-page.js
          node --check dapp/app.js
          node --check scripts/wallet.js
          node tests/wallet-manager-core.test.mjs
          node tests/wallet-manager-source.test.mjs
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          home = Path('scripts/home-v2.js').read_text(encoding='utf-8')
          css = Path('styles/home-v2.css').read_text(encoding='utf-8')
          assert 'home-action-card' not in home
          assert 'home-launcher' not in home
          assert "href=\"#about\"" not in home
          for route in ['/about/', '/tokenomics/', '/roadmap/', '/faq/', '/documents/']:
              assert f'href="{route}"' in home
          assert 'simple-stat-strip' in home
          assert 'profile-thickquidity-art.png' in home
          assert '.simple-hero' in css
          assert '.simple-site-nav' in css
          for page in ['about', 'tokenomics', 'roadmap', 'faq', 'documents']:
              assert Path(page, 'index.html').exists()
          app = Path('dapp/app.js').read_text(encoding='utf-8')
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          PY
          git diff --check

      - name: Verify simple homepage and information pages in a browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core@24
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tree-simple-home.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const BASE = 'http://127.0.0.1:4173';
          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const results = [];
            for (const viewport of [{ width: 1440, height: 1000 }, { width: 390, height: 844 }, { width: 360, height: 800 }]) {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', (error) => errors.push(error.message));
              await page.setViewport(viewport);
              await page.goto(`${BASE}/?simple_home=1`, { waitUntil: 'domcontentloaded', timeout: 120000 });
              await page.waitForSelector('html.home-simple', { timeout: 60000 });
              const state = await page.evaluate(() => ({
                nav: [...document.querySelectorAll('.simple-site-nav a')].map((node) => ({ label: node.textContent.trim(), href: node.getAttribute('href') })),
                mainSections: document.querySelectorAll('main > section').length,
                stats: document.querySelectorAll('.simple-stat-strip article').length,
                utilities: document.querySelectorAll('.simple-live-row a').length,
                oldLauncher: document.querySelectorAll('.home-launcher,.home-action-card').length,
                popup: Boolean(document.querySelector('.launch-popup')),
                fab: Boolean(document.querySelector('.fab-group')),
                overflow: document.documentElement.scrollWidth - innerWidth,
                heroTitle: document.querySelector('.simple-hero h1')?.textContent?.trim(),
              }));
              const expected = ['Home','App','About','Tokenomics','Roadmap','FAQ','Docs'];
              if (state.nav.map((item) => item.label).join('|') !== expected.join('|')) throw new Error(`Navigation mismatch: ${JSON.stringify(state)}`);
              if (state.nav.some((item) => item.href.startsWith('#'))) throw new Error(`Homepage nav still scrolls: ${JSON.stringify(state)}`);
              if (state.mainSections !== 2 || state.stats !== 5 || state.utilities !== 3) throw new Error(`Homepage hierarchy invalid: ${JSON.stringify(state)}`);
              if (state.oldLauncher || state.popup || state.fab || state.overflow > 1) throw new Error(`Homepage clutter or overflow: ${JSON.stringify(state)}`);
              if (state.heroTitle !== 'Grow with the TREE ecosystem.') throw new Error(`Hero title mismatch: ${JSON.stringify(state)}`);
              if (viewport.width <= 390) {
                await page.click('.simple-menu-button');
                const open = await page.$eval('.simple-site-nav', (node) => node.classList.contains('open'));
                if (!open) throw new Error('Mobile navigation did not open.');
              }
              if (errors.length) throw new Error(`Browser errors: ${JSON.stringify(errors)}`);
              results.push({ viewport, state });
              await page.close();
            }
            for (const path of ['/about/','/tokenomics/','/roadmap/','/faq/','/documents/']) {
              const page = await browser.newPage();
              await page.goto(`${BASE}${path}`, { waitUntil: 'domcontentloaded', timeout: 120000 });
              const state = await page.evaluate(() => ({ title: document.title, hero: document.querySelector('.info-hero h1')?.textContent?.trim(), overflow: document.documentElement.scrollWidth - innerWidth }));
              if (!state.hero || state.overflow > 1) throw new Error(`Information page invalid at ${path}: ${JSON.stringify(state)}`);
              await page.close();
            }
            await browser.close();
            console.log(JSON.stringify({ classification: 'TREE_SIMPLE_HOMEPAGE_VALID', results }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE