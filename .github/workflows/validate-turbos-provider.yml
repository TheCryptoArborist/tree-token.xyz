name: Validate Turbos TREE LP provider

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/validate-turbos-provider.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Build and run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do
            echo "Running $test"
            npx --yes tsx "$test"
          done
          git diff --check

      - name: Remove temporary validation workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-turbos-provider.yml
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Turbos provider validation"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
