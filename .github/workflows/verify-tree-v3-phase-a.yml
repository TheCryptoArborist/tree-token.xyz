name: Verify TREE V3 Phase A

on:
  push:
    branches:
      - feature/tree-native-v3-v1
  pull_request:
    paths:
      - 'dapp/v3-workspace.js'
      - 'dapp/v3-workspace.css'
      - 'dapp/index.html'
      - 'netlify/functions/tree-v3-overview.ts'
      - 'netlify/lib/tree-v3-overview.ts'
      - 'tests/tree-v3-overview.test.ts'
      - 'tests/v3-workspace-source.test.mjs'
      - 'tests/v3-workspace-html-load.test.mjs'
      - '.github/workflows/verify-tree-v3-phase-a.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate build and source safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check dapp/v3-workspace.js
          node tests/v3-workspace-source.test.mjs
          node tests/v3-workspace-html-load.test.mjs
          npx --yes tsx tests/tree-v3-overview.test.ts
          npx --yes esbuild netlify/functions/tree-v3-overview.ts --bundle --platform=node --format=esm --outfile=/tmp/tree-v3-overview.mjs
          for test in tests/*.test.mjs; do node "$test"; done
          for test in tests/*.test.ts; do npx --yes tsx "$test"; done
          git diff --check

      - name: Verify V3 workspace in a local browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core@24
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tree-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            for (const viewport of [{ width: 1440, height: 1000 }, { width: 390, height: 844 }, { width: 360, height: 800 }]) {
              const page = await browser.newPage();
              await page.setViewport(viewport);
              await page.goto('http://127.0.0.1:4173/dapp/#v3', { waitUntil: 'domcontentloaded', timeout: 120000 });
              await page.waitForSelector('.v3-workspace', { timeout: 60000 });
              const state = await page.evaluate(() => ({
                topTabs: [...document.querySelectorAll('.app-nav b')].map((node) => node.textContent.trim()),
                innerTabs: [...document.querySelectorAll('[data-v3-tab]')].map((node) => node.textContent.trim()),
                visiblePanels: [...document.querySelectorAll('[data-v3-panel]')].filter((node) => !node.hidden).length,
                restrictedActionsDisabled: [...document.querySelectorAll('.v3-position-actions button')].every((node) => node.disabled),
                createPositionReady: document.querySelector('#v3CreatePosition')?.disabled === false,
                overflow: document.documentElement.scrollWidth - innerWidth,
              }));
              if (state.innerTabs.join('|') !== 'Pools|My Positions|Swap') throw new Error(`Internal V3 tabs invalid: ${JSON.stringify(state)}`);
              if (state.visiblePanels !== 1 || !state.restrictedActionsDisabled || !state.createPositionReady || state.overflow > 1) throw new Error(`V3 workspace regression: ${JSON.stringify(state)}`);
              await page.click('[data-v3-tab="positions"]');
              await page.waitForFunction(() => [...document.querySelectorAll('[data-v3-panel]')].filter((node) => !node.hidden).length === 1);
              await page.click('[data-v3-tab="swap"]');
              await page.waitForFunction(() => [...document.querySelectorAll('[data-v3-panel]')].filter((node) => !node.hidden).length === 1);
              await page.close();
            }
            await browser.close();
            console.log('TREE V3 local browser verification passed.');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
