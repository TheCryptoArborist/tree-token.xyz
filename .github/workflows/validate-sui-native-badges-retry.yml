name: Retry complete Sui-native badge validation

on:
  push:
    branches:
      - feature/leaderboard-badges-v1
    paths:
      - '.github/workflows/validate-sui-native-badges-retry.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-badges-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Make server environment lookup safe in standalone tests
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          for filename in [
              'netlify/lib/tree-activity-index.ts',
              'netlify/lib/tree-burn-index.ts',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              old = "const getEnv = options.getEnv ?? ((name) => Netlify.env.get(name));"
              new = "const getEnv = options.getEnv ?? ((name) => typeof Netlify !== 'undefined' ? Netlify.env.get(name) : undefined);"
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Expected environment lookup not found in {filename}')
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: JavaScript checks
        run: |
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
      - name: TypeScript tests
        run: |
          set -euo pipefail
          for test in tests/*.ts; do
            echo "Running $test"
            npx --yes tsx "$test"
          done
      - name: Static safeguards
        run: |
          set -euo pipefail
          grep -q "sui-native-tree-trade-ledger-v3" netlify/lib/tree-activity-index.ts
          ! grep -q "NOODLES_API_KEY" netlify/lib/tree-activity-index.ts
          ! grep -q "/pool/event/all" netlify/lib/tree-activity-index.ts
          grep -q "TREE_TOKEN_CREATION_CHECKPOINT = '169361209'" netlify/lib/tree-burn-index.ts
          grep -q "wallets: rankedWallets" netlify/lib/tree-badge-background-worker.ts
          grep -q "onProgress: (index) => writeInternalBadgeValue(TREE_ACTIVITY_INDEX_KEY" netlify/lib/tree-badge-background-worker.ts
          grep -q "onProgress: (index) => writeInternalBadgeValue(TREE_BURN_INDEX_KEY" netlify/lib/tree-badge-background-worker.ts
          ! grep -q "scanTreeTradingActivity" netlify/lib/tree-exposure-scan-runner.ts
          ! grep -q "scanTreeBurnContributions" netlify/lib/tree-exposure-scan-runner.ts
          grep -q "TREE_TOKEN_CREATION_CHECKPOINT=169361209" .env.example
          grep -q "DAPP_SWAP_EXECUTION_ENABLED = false" dapp/app.js
          git diff --check
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-sui-native-badges.yml
          rm -f .github/workflows/validate-sui-native-badges-retry.yml
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Complete resumable Sui-native TREE badge indexes"
          git push origin HEAD:feature/leaderboard-badges-v1
