name: Inspect SuiDex V3 chain configuration

on:
  push:
    branches:
      - feature/tree-native-v3-v1
    paths:
      - '.github/workflows/inspect-suidex-v3-chain.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Extract shared V3 modules and transaction constants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pageUrl = 'https://dex.suidex.org/pools/v3/0x39d5ba22e01e45bc4129ec28a0bef52e8fee8db5d07d337adf9540e3cb9074cf/add';
          const html = await (await fetch(pageUrl)).text();
          const urls = [...new Set([...html.matchAll(/(?:src|href)="([^"]+\.js)"/g)].map((match) => new URL(match[1], pageUrl).href))];
          const known = 'https://dex.suidex.org/_next/static/chunks/app/pools/v3/%5BpoolId%5D/add/page-6d328606a4780cdd.js';
          if (!urls.includes(known)) urls.push(known);

          function moduleSlice(text, moduleId) {
            const patterns = [`${moduleId}:`, `${moduleId}:(`];
            let start = -1;
            for (const pattern of patterns) {
              start = text.indexOf(pattern);
              if (start >= 0) break;
            }
            if (start < 0) return null;
            const candidates = [];
            for (const match of text.slice(start + String(moduleId).length + 1).matchAll(/},\d{2,6}:/g)) {
              candidates.push(start + String(moduleId).length + 1 + match.index + 1);
              if (candidates.length >= 3) break;
            }
            const end = candidates[0] || Math.min(text.length, start + 50000);
            return text.slice(start, end);
          }

          const modules = [];
          const allAddresses = new Set();
          for (const url of urls) {
            const response = await fetch(url);
            const text = await response.text();
            for (const address of [...text.matchAll(/0x[0-9a-f]{64}/gi)].map((match) => match[0])) allAddresses.add(address);
            for (const moduleId of [71045, 58425, 80393, 9117]) {
              const slice = moduleSlice(text, moduleId);
              if (slice) modules.push({ url, moduleId, bytes: slice.length, source: slice });
            }
            const exportHits = [];
            for (const needle of ['Na:', 'z$:', 'vS:', 'function Na', 'function z$', 'function vS']) {
              let index = text.indexOf(needle);
              while (index >= 0 && exportHits.length < 30) {
                exportHits.push({ needle, snippet: text.slice(Math.max(0, index - 2000), Math.min(text.length, index + 5000)) });
                index = text.indexOf(needle, index + needle.length);
              }
            }
            if (exportHits.length) modules.push({ url, moduleId: 'exports', source: exportHits });
          }
          console.log(JSON.stringify({ scripts: urls, addresses: [...allAddresses], modules }, null, 2));
          NODE