name: Inspect SuiDex V3 chain configuration

on:
  push:
    branches:
      - feature/tree-native-v3-v1
    paths:
      - '.github/workflows/inspect-suidex-v3-chain.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Locate V3 Version and shared configuration objects
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = 'https://graphql.mainnet.sui.io/graphql';
          const packageId = '0xb5f529c1dcda6580a61bf7ee9fbd524b50be62f11044d137c8202c8cbace9e56';
          const types = [
            `${packageId}::version::Version`,
            `${packageId}::version::VersionCap`,
            `${packageId}::global_config::GlobalConfig`,
            `${packageId}::global_config::AdminCap`,
          ];
          const query = `query ObjectsByType($first: Int!, $type: String!) {
            objects(first: $first, filter: { type: $type }) {
              pageInfo { hasNextPage endCursor }
              nodes {
                address
                owner { __typename ... on AddressOwner { address { address } } ... on ObjectOwner { address { address } } }
                asMoveObject { contents { json } }
              }
            }
          }`;
          const results = [];
          for (const type of types) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify({ query, variables: { first: 50, type } }),
            });
            const body = await response.json();
            results.push({ type, status: response.status, errors: body.errors || [], data: body.data || null });
          }
          console.log(JSON.stringify({ endpoint, results }, null, 2));
          NODE