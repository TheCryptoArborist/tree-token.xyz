name: Inspect SuiDex V3 chain configuration

on:
  push:
    branches:
      - feature/tree-native-v3-v1
    paths:
      - '.github/workflows/inspect-suidex-v3-chain.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Mysten SDK
        run: npm install --no-save --ignore-scripts @mysten/sui@2.23.1

      - name: Inspect TREE pool, enriched API, and SuiDex frontend constants
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { SuiGrpcClient } from '@mysten/sui/grpc';
          const client = new SuiGrpcClient({ network: 'mainnet', baseUrl: 'https://fullnode.mainnet.sui.io:443' });
          const packageId = '0xb5f529c1dcda6580a61bf7ee9fbd524b50be62f11044d137c8202c8cbace9e56';
          const poolId = '0x39d5ba22e01e45bc4129ec28a0bef52e8fee8db5d07d337adf9540e3cb9074cf';

          const { object: pool } = await client.core.getObject({ objectId: poolId, include: { json: true, display: true } });
          const apiBody = await (await fetch('https://dex.suidex.org/api/v3/pools-enriched')).json();
          const treePool = (apiBody.pools || apiBody || []).find((item) => item.pool_id === poolId);

          const chunkUrl = 'https://dex.suidex.org/_next/static/chunks/5162-fbf55ded1d6f82e0.js';
          const chunk = await (await fetch(chunkUrl)).text();
          const moduleStart = chunk.indexOf('9117:');
          const moduleEndCandidates = [chunk.indexOf('},5960:', moduleStart), chunk.indexOf('},8761:', moduleStart)].filter((value) => value > moduleStart);
          const moduleEnd = moduleEndCandidates.length ? Math.min(...moduleEndCandidates) : Math.min(chunk.length, moduleStart + 35000);
          const constantsModule = chunk.slice(moduleStart, moduleEnd + 2);
          const addresses = [...new Set([...chunk.matchAll(/0x[0-9a-f]{64}/gi)].map((match) => match[0]))];
          const packageSnippets = [];
          let cursor = chunk.indexOf(packageId.slice(2));
          while (cursor >= 0 && packageSnippets.length < 20) {
            packageSnippets.push(chunk.slice(Math.max(0, cursor - 1800), Math.min(chunk.length, cursor + 5000)));
            cursor = chunk.indexOf(packageId.slice(2), cursor + 1);
          }

          console.log(JSON.stringify({
            pool: { objectId: pool?.objectId, type: pool?.type, owner: pool?.owner, json: pool?.json, display: pool?.display },
            treePool,
            chunkUrl,
            addresses,
            constantsModule,
            packageSnippets,
          }, null, 2));
          NODE
          git checkout -- package.json package-lock.json 2>/dev/null || true