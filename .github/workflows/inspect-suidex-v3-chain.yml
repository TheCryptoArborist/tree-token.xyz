name: Inspect SuiDex V3 chain configuration

on:
  push:
    branches:
      - feature/tree-native-v3-v1
    paths:
      - '.github/workflows/inspect-suidex-v3-chain.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Capture runtime-loaded V3 modules and constants
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const pageUrl = 'https://dex.suidex.org/pools/v3/0x39d5ba22e01e45bc4129ec28a0bef52e8fee8db5d07d337adf9540e3cb9074cf/add';

          function moduleSlice(text, moduleId) {
            let start = text.indexOf(`${moduleId}:`);
            if (start < 0) return null;
            const tail = text.slice(start + String(moduleId).length + 1);
            const match = tail.match(/},\d{2,6}:/);
            const end = match ? start + String(moduleId).length + 1 + match.index + 1 : Math.min(text.length, start + 65000);
            return text.slice(start, end);
          }

          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            const scriptUrls = new Set();
            page.on('response', (response) => {
              const url = response.url();
              if (/\.js(?:\?|$)/i.test(url)) scriptUrls.add(url);
            });
            await page.goto(pageUrl, { waitUntil: 'networkidle2', timeout: 120000 });
            await new Promise((resolve) => setTimeout(resolve, 6000));
            const body = await page.evaluate(() => ({ text: document.body.innerText.slice(0, 4000), scripts: [...document.scripts].map((script) => script.src).filter(Boolean) }));
            body.scripts.forEach((url) => scriptUrls.add(url));
            await browser.close();

            const modules = [];
            for (const url of [...scriptUrls]) {
              try {
                const response = await fetch(url);
                const text = await response.text();
                for (const moduleId of [71045, 58425, 80393, 9117]) {
                  const source = moduleSlice(text, moduleId);
                  if (source) modules.push({ url, moduleId, source });
                }
                const ids = [...text.matchAll(/0x[0-9a-f]{64}/gi)].map((match) => match[0]);
                if (ids.some((id) => /b5f529c1|0999bbc9|39d5ba22/i.test(id))) {
                  const snippets = [];
                  for (const needle of ['b5f529c1', '0999bbc9', '39d5ba22', 'open_position', 'add_liquidity']) {
                    let index = text.toLowerCase().indexOf(needle);
                    while (index >= 0 && snippets.length < 15) {
                      snippets.push({ needle, source: text.slice(Math.max(0, index - 2200), Math.min(text.length, index + 6500)) });
                      index = text.toLowerCase().indexOf(needle, index + needle.length);
                    }
                  }
                  modules.push({ url, moduleId: 'v3-hits', addresses: [...new Set(ids)], snippets });
                }
              } catch (error) {
                modules.push({ url, moduleId: 'fetch-error', error: error?.message || String(error) });
              }
            }
            console.log(JSON.stringify({ pageUrl, body, scripts: [...scriptUrls], modules }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE