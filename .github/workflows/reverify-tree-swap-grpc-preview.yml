name: Reverify TREE best-route swap after gRPC migration

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/reverify-tree-swap-grpc-preview.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Verify quotes, UI, and all direct V2/V3 simulations
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const PREVIEW = 'https://deploy-preview-11--tree-token.netlify.app';
          const SUI = '0x2::sui::SUI';
          const TREE = '0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchJson(url, attempts = 8) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, { headers: { accept: 'application/json' } });
                const text = await response.text();
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${text.slice(0, 200)}`);
                return JSON.parse(text);
              } catch (error) {
                lastError = error;
                if (attempt < attempts) await sleep(Math.min(800 * 2 ** (attempt - 1), 6000));
              }
            }
            throw lastError;
          }

          const quoteUrl = (tokenIn, tokenOut, amountIn) => `${PREVIEW}/api/tree-swap-quote?${new URLSearchParams({ tokenIn, tokenOut, amountIn, slippageBps: '100' })}`;

          (async () => {
            const [buy, sell, exposure] = await Promise.all([
              fetchJson(quoteUrl(SUI, TREE, '100000000')),
              fetchJson(quoteUrl(TREE, SUI, '10000000000')),
              fetchJson(`${PREVIEW}/api/tree-exposure-preview`),
            ]);
            for (const [name, quote] of [['buy', buy], ['sell', sell]]) {
              if (quote.status !== 'ok') throw new Error(`${name} quote status: ${quote.status}`);
              const venues = new Set(quote.routes?.map((route) => route.venue));
              if (quote.routes?.length !== 2 || !venues.has('suidex') || !venues.has('v3')) throw new Error(`${name} route set invalid: ${JSON.stringify(quote.routes)}`);
              if (quote.selectedRoute.amountOut !== quote.routes[0].amountOut) throw new Error(`${name} selected route is not the sorted best output.`);
            }
            if (buy.decimalsIn !== 9 || buy.decimalsOut !== 6 || sell.decimalsIn !== 6 || sell.decimalsOut !== 9) throw new Error('Incorrect SUI/TREE decimal metadata.');
            if (!['ok', 'stale'].includes(exposure.status) || exposure.entries?.length !== 50) throw new Error(`Exposure snapshot unavailable: ${JSON.stringify({ status: exposure.status, entries: exposure.entries?.length })}`);
            const candidates = exposure.entries
              .map((entry) => ({ owner: entry.wallet || entry.address, liquidTreeRaw: String(entry.liquidTreeRaw || entry.directTreeRaw || '0') }))
              .filter((entry) => /^0x[0-9a-f]{64}$/i.test(entry.owner || '') && BigInt(entry.liquidTreeRaw) >= 10_000_000_000n);
            if (!candidates.length) throw new Error('No dry-run owner candidate found.');

            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            page.on('console', (message) => {
              const text = message.text();
              if (message.type() === 'error' && !/api\.slush\.app|metadata|Failed to load resource/i.test(text)) errors.push(text);
            });
            await page.goto(`${PREVIEW}/dapp/#swap`, { waitUntil: 'networkidle2', timeout: 120000 });
            await page.waitForSelector('#swapAmountIn', { timeout: 120000 });
            await page.type('#swapAmountIn', '0.1');
            await page.waitForFunction(() => document.querySelectorAll('.swap-route-candidate').length === 2, { timeout: 120000 });
            const ui = await page.evaluate(() => ({
              active: document.body.dataset.activePanel,
              output: document.querySelector('#swapAmountOut')?.value,
              selected: document.querySelector('#swapRouteLabel')?.textContent,
              candidates: [...document.querySelectorAll('.swap-route-candidate')].map((node) => node.textContent.trim()),
              minimum: document.querySelector('#swapMinReceived')?.textContent,
              impact: document.querySelector('#swapPriceImpact')?.textContent,
              action: document.querySelector('#buyTree')?.textContent,
              disabled: document.querySelector('#buyTree')?.disabled,
              overflow: document.documentElement.scrollWidth - innerWidth,
            }));
            if (ui.active !== 'swap' || !ui.output || ui.candidates.length !== 2 || !ui.minimum || !ui.impact || ui.action !== 'Connect Wallet' || ui.disabled || ui.overflow > 1) throw new Error(`Published UI invalid: ${JSON.stringify(ui)}`);

            const simulation = await page.evaluate(async ({ candidates, buy, sell, suiType, treeType }) => {
              const { SuiGrpcClient } = await import('https://esm.run/@mysten/sui@2.23.1/grpc');
              const swap = await import('/dapp/swap-router.js');
              const client = new SuiGrpcClient({ network: 'mainnet', baseUrl: 'https://fullnode.mainnet.sui.io:443' });
              let owner = null;
              let balances = null;
              for (const candidate of candidates) {
                const [sui, tree] = await Promise.all([
                  client.core.getBalance({ owner: candidate.owner, coinType: suiType }),
                  client.core.getBalance({ owner: candidate.owner, coinType: treeType }),
                ]);
                const suiRaw = BigInt(sui.balance.balance || '0');
                const treeRaw = BigInt(tree.balance.balance || '0');
                if (suiRaw >= 1_000_000_000n && treeRaw >= 10_000_000_000n) {
                  owner = candidate.owner;
                  balances = { sui: suiRaw.toString(), tree: treeRaw.toString() };
                  break;
                }
              }
              if (!owner) throw new Error('No public candidate had enough SUI and TREE for non-signing simulations.');
              const results = [];
              for (const [direction, quote] of Object.entries({ buy, sell })) {
                for (const route of quote.routes) {
                  try {
                    const tx = await swap.buildTransaction(owner, route, BigInt(quote.amountIn));
                    const bytes = await tx.build({ client });
                    const response = await client.core.simulateTransaction({ transaction: bytes, include: { effects: true, balanceChanges: true } });
                    const transaction = response.$kind === 'Transaction' ? response.Transaction : null;
                    results.push({
                      direction,
                      venue: route.venueLabel,
                      executionKind: route.executionKind,
                      kind: response.$kind,
                      success: transaction?.effects?.status?.success === true,
                      error: response.FailedTransaction?.status?.error?.message || transaction?.effects?.status?.error?.message || transaction?.effects?.status?.error || null,
                      balanceChanges: transaction?.balanceChanges?.length || 0,
                    });
                  } catch (error) {
                    results.push({ direction, venue: route.venueLabel, executionKind: route.executionKind, kind: 'builder-error', success: false, error: error?.message || String(error), balanceChanges: 0 });
                  }
                }
              }
              return { owner, balances, results };
            }, { candidates, buy, sell, suiType: SUI, treeType: TREE });
            if (errors.length) throw new Error(`Browser errors: ${JSON.stringify(errors)}`);
            if (simulation.results.length !== 4 || simulation.results.some((result) => result.kind !== 'Transaction' || !result.success)) throw new Error(`Simulation failure: ${JSON.stringify(simulation)}`);

            const mobile = [];
            for (const viewport of [{ width: 390, height: 844 }, { width: 360, height: 800 }]) {
              const mobilePage = await browser.newPage();
              await mobilePage.setViewport(viewport);
              await mobilePage.goto(`${PREVIEW}/dapp/#swap`, { waitUntil: 'networkidle2', timeout: 120000 });
              await mobilePage.type('#swapAmountIn', '0.1');
              await mobilePage.waitForFunction(() => document.querySelectorAll('.swap-route-candidate').length === 2, { timeout: 120000 });
              const state = await mobilePage.evaluate(() => ({ output: document.querySelector('#swapAmountOut')?.value, candidates: document.querySelectorAll('.swap-route-candidate').length, overflow: document.documentElement.scrollWidth - innerWidth }));
              if (!state.output || state.candidates !== 2 || state.overflow > 1) throw new Error(`Mobile UI invalid: ${JSON.stringify({ viewport, state })}`);
              mobile.push({ viewport, state });
              await mobilePage.close();
            }
            await browser.close();

            console.log(JSON.stringify({
              classification: 'TREE_BEST_ROUTE_SWAP_VERIFIED',
              buy: { selected: buy.selectedRoute.venueLabel, amountOut: buy.selectedRoute.amountOut, routes: buy.routes.map((route) => ({ venue: route.venueLabel, amountOut: route.amountOut, impact: route.priceImpactPercent })) },
              sell: { selected: sell.selectedRoute.venueLabel, amountOut: sell.selectedRoute.amountOut, routes: sell.routes.map((route) => ({ venue: route.venueLabel, amountOut: route.amountOut, impact: route.priceImpactPercent })) },
              dryRunOwner: `${simulation.owner.slice(0, 8)}…${simulation.owner.slice(-6)}`,
              balances: simulation.balances,
              simulations: simulation.results,
              ui,
              mobile,
            }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Verify public routes
        shell: bash
        run: |
          set -euo pipefail
          quote='https://deploy-preview-11--tree-token.netlify.app/api/tree-swap-quote?tokenIn=0x2%3A%3Asui%3A%3ASUI&tokenOut=0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf%3A%3Atree%3A%3ATREE&amountIn=100000000&slippageBps=100'
          for url in 'https://deploy-preview-11--tree-token.netlify.app/' 'https://deploy-preview-11--tree-token.netlify.app/dapp/' "$quote"; do
            code=$(curl --retry 8 --retry-all-errors --retry-delay 1 --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 60 "$url")
            echo "$code $url"
            [[ "$code" == '200' ]]
          done