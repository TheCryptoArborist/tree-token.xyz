name: Check TREE exposure preview status

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-exposure-preview-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current Deploy Preview exposure state
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location --max-time 60 \
            'https://deploy-preview-4--tree-token.netlify.app/api/tree-exposure?diagnostic=1' \
            -o /tmp/exposure.json
          node <<'NODE'
          const p=require('/tmp/exposure.json');
          console.log(JSON.stringify({
            status:p.status,
            refreshState:p.refreshState,
            refreshStatus:p.refreshStatus,
            snapshotGeneratedAt:p.snapshotGeneratedAt,
            activity:p.source?.activity,
            burns:p.source?.burns,
            badgeCounts:p.summary?.badgeCounts,
            warnings:p.warnings,
            message:p.message,
          },null,2));
          NODE
