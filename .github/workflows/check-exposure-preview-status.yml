name: Check TREE exposure preview status

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-exposure-preview-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize recent TREE-pool transaction semantics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint='https://graphql.mainnet.sui.io/graphql';
          const tree='0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          const pools={
            suiDexV2:'0x35a1be1f01f9edf7f5221d226f357d194d43c28f2a65cb38640935518d9a5bfc',
            suiDexV3:'0x39d5ba22e01e45bc4129ec28a0bef52e8fee8db5d07d337adf9540e3cb9074cf',
            turbos:'0xaa133ce1f8fd55d85b6fc87c1b3054cb717d83be477ef3635c661c21fbdfa0ee',
          };
          const query=`query PoolTransactions($pool:SuiAddress!){
            transactions(last:20,filter:{affectedObject:$pool}){
              nodes{
                digest
                sender{address}
                transactionJson
                effects{
                  status
                  timestamp
                  checkpoint{sequenceNumber}
                  balanceChanges(first:50){pageInfo{hasNextPage}nodes{owner{address}coinType{repr}amount}}
                }
              }
            }
          }`;
          const normalize=(value)=>String(value||'').toLowerCase().replace(/^0x([0-9a-f]+)::/,(_,hex)=>`0x${hex.padStart(64,'0')}::`);
          const callsFrom=(value)=>{
            const calls=[];
            const visit=(node,path=[])=>{
              if(Array.isArray(node)){node.forEach((item,index)=>visit(item,[...path,index]));return;}
              if(!node||typeof node!=='object')return;
              const packageValue=node.package??node.packageId??node.package_id??node.packageAddress??node.package_address;
              const moduleValue=node.module??node.moduleName??node.module_name;
              const functionValue=node.function??node.functionName??node.function_name;
              if(typeof packageValue==='string'&&typeof moduleValue==='string'&&typeof functionValue==='string'){
                calls.push({path:path.join('.'),package:packageValue,module:moduleValue,function:functionValue,typeArguments:node.typeArguments??node.type_arguments??node.typeArgs??null});
              }
              for(const [key,item] of Object.entries(node))visit(item,[...path,key]);
            };
            visit(value);
            return calls;
          };
          for(const [venue,pool] of Object.entries(pools)){
            const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,variables:{pool}})});
            const payload=await response.json();
            const rows=[];
            for(const tx of payload.data?.transactions?.nodes||[]){
              const sender=tx.sender?.address;
              const changes=tx.effects?.balanceChanges?.nodes||[];
              let treeDelta=0n;
              for(const change of changes){
                if(normalize(change.coinType?.repr)===normalize(tree)&&String(change.owner?.address||'').toLowerCase()===String(sender||'').toLowerCase()){
                  treeDelta+=BigInt(change.amount);
                }
              }
              const calls=callsFrom(tx.transactionJson);
              rows.push({
                digest:tx.digest,
                sender,
                status:tx.effects?.status,
                checkpoint:tx.effects?.checkpoint?.sequenceNumber,
                timestamp:tx.effects?.timestamp,
                senderTreeDelta:treeDelta.toString(),
                balanceChangesPaginated:tx.effects?.balanceChanges?.pageInfo?.hasNextPage===true,
                calls,
                commandKinds:Array.isArray(tx.transactionJson?.kind?.ProgrammableTransaction?.commands)
                  ? tx.transactionJson.kind.ProgrammableTransaction.commands.map((command)=>Object.keys(command||{})[0]||'unknown')
                  : [],
              });
            }
            console.log(JSON.stringify({venue,pool,errors:payload.errors||[],transactions:rows},null,2));
          }
          NODE