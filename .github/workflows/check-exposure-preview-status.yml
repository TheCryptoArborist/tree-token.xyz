name: Check TREE exposure preview status

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-exposure-preview-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Sui transaction and event schema
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const names=['Transaction','TransactionEffects','TransactionFilter','Event','EventConnection','EventFilter','BalanceChange','ProgrammableTransaction','MoveCall','TransactionKind'];
          const query=`query Introspect(${names.map((_,i)=>`$n${i}:String!`).join(',')}){${names.map((_,i)=>`t${i}:__type(name:$n${i}){name kind fields{name args{name type{kind name ofType{kind name}}} type{kind name ofType{kind name}}} inputFields{name type{kind name ofType{kind name}}} possibleTypes{name}}`).join('')}}`;
          const variables=Object.fromEntries(names.map((name,i)=>[`n${i}`,name]));
          const response=await fetch('https://graphql.mainnet.sui.io/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,variables})});
          const payload=await response.json();
          const output={};
          for(let i=0;i<names.length;i++) output[names[i]]=payload.data?.[`t${i}`]||null;
          console.log(JSON.stringify({errors:payload.errors,types:output},null,2));
          NODE