name: Check TREE exposure preview status

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-exposure-preview-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect recent SuiDex V3 TREE-pool transactions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const query=`query PoolTransactions($pool:SuiAddress!){
            transactions(last:8,filter:{affectedObject:$pool}){
              pageInfo{hasPreviousPage startCursor}
              nodes{
                digest
                sender{address}
                transactionJson
                effects{
                  status
                  timestamp
                  checkpoint{sequenceNumber}
                  balanceChanges(first:50){pageInfo{hasNextPage}nodes{owner{address}coinType{repr}amount}}
                  events(first:50){pageInfo{hasNextPage}nodes{sender{address}timestamp sequenceNumber contents{json type{repr}}}}
                }
              }
            }
          }`;
          const variables={pool:'0x39d5ba22e01e45bc4129ec28a0bef52e8fee8db5d07d337adf9540e3cb9074cf'};
          const response=await fetch('https://graphql.mainnet.sui.io/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,variables})});
          const payload=await response.json();
          console.log(JSON.stringify(payload,null,2));
          NODE