name: Check TREE exposure preview status

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-exposure-preview-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Sui checkpoint filters and time lookup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const typeNames=['Checkpoint','CheckpointFilter','TransactionFilter','Query'];
          const introspection=`query I(${typeNames.map((_,i)=>`$n${i}:String!`).join(',')}){${typeNames.map((_,i)=>`t${i}:__type(name:$n${i}){name kind fields{name args{name type{kind name ofType{kind name}}} type{kind name ofType{kind name}}} inputFields{name type{kind name ofType{kind name}}}}`).join('')}}`;
          const variables=Object.fromEntries(typeNames.map((name,i)=>[`n${i}`,name]));
          const response=await fetch('https://graphql.mainnet.sui.io/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:introspection,variables})});
          const schema=await response.json();
          const simplified={};
          for(let i=0;i<typeNames.length;i++){
            const value=schema.data?.[`t${i}`];
            simplified[typeNames[i]]=value;
          }
          console.log('SCHEMA');
          console.log(JSON.stringify({errors:schema.errors,types:simplified},null,2));

          const now=new Date();
          const cutoff=new Date(now.getTime()-30*24*60*60*1000).toISOString();
          const probes=[
            {name:'afterTimestamp',query:`query Q($timestamp:DateTime!){checkpoints(first:3,filter:{afterTimestamp:$timestamp}){pageInfo{hasNextPage endCursor}nodes{sequenceNumber timestamp}}}`,variables:{timestamp:cutoff}},
            {name:'beforeTimestamp',query:`query Q($timestamp:DateTime!){checkpoints(last:3,filter:{beforeTimestamp:$timestamp}){pageInfo{hasPreviousPage startCursor}nodes{sequenceNumber timestamp}}}`,variables:{timestamp:cutoff}},
          ];
          for(const probe of probes){
            const r=await fetch('https://graphql.mainnet.sui.io/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:probe.query,variables:probe.variables})});
            console.log(`PROBE ${probe.name}`);
            console.log(await r.text());
          }
          NODE