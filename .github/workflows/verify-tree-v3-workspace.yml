name: Verify native TREE V3 workspace

on:
  push:
    branches:
      - feature/tree-v3-workspace-v1
    paths:
      - '.github/workflows/verify-tree-v3-workspace.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-v3-workspace-v1
          fetch-depth: 0

      - name: Build and test source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/v3-workspace.js
          node --check dapp/panel-router.js
          node tests/v3-workspace-source.test.mjs
          npx --yes tsx tests/tree-v3-public.test.ts
          npx --yes esbuild netlify/functions/tree-v3.ts --bundle --platform=node --format=esm --outfile=/tmp/tree-v3-function.mjs
          node tests/wallet-manager-core.test.mjs
          node tests/wallet-manager-source.test.mjs
          node tests/tree-swap-ui.test.mjs
          npx --yes tsx tests/tree-swap-route.test.ts
          git diff --check

      - name: Verify live SuiDex V3 public sources
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx <<'TS'
          import assert from 'node:assert/strict';
          import {
            SUIDEX_V3_TREE_POOL,
            getSuiDexV3PageStats,
            getSuiDexV3PoolObject,
            getSuiDexV3Quote,
            scanTreeV3Positions,
          } from './netlify/lib/tree-v3-public.ts';
          const [pool, pages, quote] = await Promise.all([
            getSuiDexV3PoolObject(),
            getSuiDexV3PageStats(),
            getSuiDexV3Quote(),
          ]);
          assert.equal(pool.objectId, SUIDEX_V3_TREE_POOL);
          assert.ok(Number.isInteger(pool.currentTick));
          assert.ok(BigInt(pool.liquidityRaw) > 0n);
          assert.equal(quote.venue, 'v3');
          assert.equal(quote.pairId, SUIDEX_V3_TREE_POOL);
          assert.ok(BigInt(quote.amountOut) > 0n);
          assert.ok(pages.stats.feePercent === null || pages.stats.feePercent > 0);
          const positions = await scanTreeV3Positions({ currentTick: pool.currentTick, maxPages: 20, pageSize: 50 });
          assert.equal(positions.coverage.reachedEnd, true);
          assert.ok(positions.coverage.matchedPoolPositions > 0);
          assert.ok(positions.coverage.uniqueOwners > 0);
          console.log(JSON.stringify({
            classification: 'TREE_V3_LIVE_SOURCES_VALID',
            poolId: pool.objectId,
            currentTick: pool.currentTick,
            feePercent: pages.stats.feePercent,
            tvlUsd: pages.stats.tvlUsd,
            volume24hUsd: pages.stats.volume24hUsd,
            aprPercent: pages.stats.aprPercent,
            v3TreeOutPerSuiRaw: quote.amountOut,
            coverage: positions.coverage,
          }, null, 2));
          TS

      - name: Verify V3 workspace in browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core@24
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tree-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fixture = {
            status: 'ok', provider: 'tree-suidex-v3-readonly-v1', generatedAt: '2026-08-13T02:00:00.000Z', transactionMode: 'read-only',
            pool: {
              id: '0x39d5ba22e01e45bc4129ec28a0bef52e8fee8db5d07d337adf9540e3cb9074cf', pair: 'SUI/TREE', feePercent: 0.25,
              currentPriceSuiPerTree: 0.0000282189, treePerSui: 35437.1642, priceImpactPercentForOneSui: 0.25,
              tvlUsd: 6970, volume24hUsd: 109.77, fees24hUsd: 0.27, swaps24h: 9, aprPercent: 45, feeAprPercent: 2.8, rewardAprPercent: 42.2,
              rewards: [{ token: 'VICTORY TOKEN', amountPerDay: '4,472' }], currentTick: 123,
              positionCoverage: { pagesScanned: 3, objectsScanned: 134, matchedPoolPositions: 15, activePoolPositions: 15, uniqueOwners: 12, reachedEnd: true, malformedObjects: 0 },
            },
            wallet: null, warnings: [],
          };
          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const results = [];
            for (const viewport of [{ width: 1440, height: 1000 }, { width: 390, height: 844 }, { width: 360, height: 800 }]) {
              const page = await browser.newPage();
              await page.setRequestInterception(true);
              page.on('request', (request) => {
                if (request.url().includes('/api/tree-v3')) {
                  request.respond({ status: 200, contentType: 'application/json', body: JSON.stringify(fixture) });
                } else if (request.url().includes('/api/')) {
                  request.respond({ status: 200, contentType: 'application/json', body: JSON.stringify({ status: 'not-ready', entries: [], live: { status: 'error', data: null }, snapshot: {} }) });
                } else request.continue();
              });
              await page.setViewport(viewport);
              await page.goto('http://127.0.0.1:4173/dapp/#v3', { waitUntil: 'domcontentloaded', timeout: 120000 });
              await page.waitForSelector('#treeV3PoolsPanel:not([hidden])', { timeout: 120000 });
              await page.waitForFunction(() => document.querySelector('#treeV3Tvl')?.textContent?.includes('$'), { timeout: 120000 });
              const initial = await page.evaluate(() => ({
                activeMainPanels: [...document.querySelectorAll('main > section')].filter((section) => !section.hidden).map((section) => section.id),
                tabs: [...document.querySelectorAll('[data-v3-tab]')].map((button) => button.textContent.trim()),
                visibleSubpanels: [...document.querySelectorAll('[data-v3-panel]')].filter((panel) => !panel.hidden).map((panel) => panel.dataset.v3Panel),
                tvl: document.querySelector('#treeV3Tvl')?.textContent,
                positions: document.querySelector('#treeV3PositionCount')?.textContent,
                actionDisabled: document.querySelector('#treeV3BuildPosition')?.disabled,
                overflow: document.documentElement.scrollWidth - innerWidth,
              }));
              if (initial.activeMainPanels.join('|') !== 'v3') throw new Error(`Main panel regression: ${JSON.stringify(initial)}`);
              if (initial.tabs.join('|') !== 'Pools|My Positions|Swap' || initial.visibleSubpanels.join('|') !== 'pools') throw new Error(`V3 tab regression: ${JSON.stringify(initial)}`);
              if (!initial.actionDisabled || initial.overflow > 1) throw new Error(`V3 safety/overflow regression: ${JSON.stringify(initial)}`);
              await page.click('#treeV3Add');
              await page.type('#treeV3SuiAmount', '.1');
              await page.waitForFunction(() => document.querySelector('#treeV3TreeEstimate')?.textContent?.includes('3,543'), { timeout: 30000 });
              await page.click('[data-v3-tab="positions"]');
              await page.waitForSelector('#treeV3PositionsPanel:not([hidden])');
              await page.click('[data-v3-tab="swap"]');
              await page.waitForSelector('#treeV3SwapPanel:not([hidden])');
              const final = await page.evaluate(() => ({
                estimate: document.querySelector('#treeV3TreeEstimate')?.textContent,
                visibleSubpanels: [...document.querySelectorAll('[data-v3-panel]')].filter((panel) => !panel.hidden).map((panel) => panel.dataset.v3Panel),
                overflow: document.documentElement.scrollWidth - innerWidth,
              }));
              if (final.visibleSubpanels.join('|') !== 'swap' || final.overflow > 1) throw new Error(`V3 switching regression: ${JSON.stringify(final)}`);
              results.push({ viewport, initial, final });
              await page.close();
            }
            await browser.close();
            console.log(JSON.stringify({ classification: 'TREE_V3_BROWSER_VALID', results }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
