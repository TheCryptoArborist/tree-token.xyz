name: Apply TREE exposure leaderboard UI

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/apply-tree-exposure-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Apply exposure UI
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-tree-exposure-ui.py
          rm -f scripts/apply-tree-exposure-ui.py
          git diff --check

      - name: Validate application and exposure UI
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          app = Path('dapp/app.js').read_text(encoding='utf-8')
          html = Path('dapp/index.html').read_text(encoding='utf-8')
          css = Path('dapp/styles.css').read_text(encoding='utf-8')
          assert "isDeployPreview ? '/api/tree-exposure'" in app
          assert 'total verified exposure' in app.lower()
          assert "'lp-provider'" in app and "'lp-maxi'" in app
          assert "label: 'Burned'" in app
          assert 'Verified TREE Exposure Leaders' in html
          assert 'Total Verified Exposure' in html
          assert 'Liquid TREE plus current principal TREE' in html
          assert '.leader-badge' in css and '.lp-breakdown-grid' in css
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          PY
          git diff --check

      - name: Commit exposure UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Show verified TREE exposure in the Canopy Board"
          git push origin HEAD:feature/leaderboard-exposure-v1
