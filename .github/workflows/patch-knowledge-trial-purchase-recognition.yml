name: Patch Knowledge Trial purchase recognition UX

on:
  push:
    branches:
      - fix/knowledge-trial-purchase-recognition-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-trial-purchase-recognition-ui
          fetch-depth: 0
      - name: Patch Challenge purchase recognition feedback
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/tree-knowledge-trial.js')
          text = path.read_text()

          old_ready = "nodes.passCopy.textContent = `Connected wallet ${wallet.slice(0, 6)}…${wallet.slice(-4)}. Start the daily challenge to verify a qualifying $5+ TREE purchase and sign one wallet-ownership message.`;"
          new_ready = "nodes.passCopy.textContent = `Connected wallet ${wallet.slice(0, 6)}…${wallet.slice(-4)}. Press Start Daily Challenge to check your qualifying $5+ TREE purchase. Your Challenge Pass is issued only after the purchase is found and you approve one wallet-ownership message.`;"
          if old_ready not in text:
              raise SystemExit('Expected ready-to-verify copy was not found')
          text = text.replace(old_ready, new_ready, 1)

          old_request = "const requested = await post('challenge', { wallet, roundId });\n      if (typeof window.signTreePersonalMessage !== 'function') throw new Error('This wallet cannot sign the required ownership message.');\n      setStatus('Approve the wallet-ownership message. This does not move funds.');"
          new_request = "const requested = await post('challenge', { wallet, roundId });\n      nodes.passState.textContent = 'Purchase verified';\n      nodes.passCopy.textContent = 'Your qualifying TREE purchase was recognized for this round. Approve the wallet-ownership message to issue your Challenge Pass.';\n      if (typeof window.signTreePersonalMessage !== 'function') throw new Error('This wallet cannot sign the required ownership message.');\n      setStatus('Purchase verified. Approve the wallet-ownership message. This does not move funds.');"
          if old_request not in text:
              raise SystemExit('Expected live challenge request block was not found')
          text = text.replace(old_request, new_request, 1)

          old_listeners = "window.addEventListener('tree:wallet-changed', updateWalletState);\n  window.addEventListener('beforeunload', () => clearInterval(state.timerId));"
          new_listeners = "window.addEventListener('tree:wallet-changed', updateWalletState);\n  window.addEventListener('hashchange', () => {\n    if (window.location.hash === '#canopy-draw') loadTrial();\n  });\n  window.addEventListener('beforeunload', () => clearInterval(state.timerId));"
          if old_listeners not in text:
              raise SystemExit('Expected wallet listener block was not found')
          text = text.replace(old_listeners, new_listeners, 1)

          path.write_text(text)
      - name: Remove one-off workflow
        run: rm .github/workflows/patch-knowledge-trial-purchase-recognition.yml
      - name: Commit patch
        run: |
          git config user.name "TREE Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/tree-knowledge-trial.js .github/workflows/patch-knowledge-trial-purchase-recognition.yml
          git commit -m "Fix Knowledge Trial purchase recognition feedback"
          git push origin HEAD:fix/knowledge-trial-purchase-recognition-ui
