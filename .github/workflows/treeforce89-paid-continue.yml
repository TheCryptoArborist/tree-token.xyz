name: TREE FORCE paid continuation
on:
  pull_request:
    paths:
      - 'treeforce89/**'
      - 'netlify/preview-lib/treeforce89-paid-continue.mjs'
      - 'db/staged-migrations/20261031045000_tree_paid_continue.sql'
      - 'netlify/database/migrations/20261031045000_tree_paid_continue.sql'
      - 'scripts/verify-treeforce89-paid-database.mjs'
      - 'tests/treeforce89-paid-client.test.mjs'
      - '.github/workflows/treeforce89-paid-continue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payment-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: treeforce89_paid_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable_test_only
      PGDATABASE: treeforce89_paid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix netlify/preview-lib/treeforce89-source --ignore-scripts --no-audit --no-fund
      - run: node --test tests/treeforce89-paid-client.test.mjs
      - run: node scripts/verify-treeforce89-paid-database.mjs
