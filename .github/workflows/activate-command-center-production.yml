name: Prepare TREE Command Center production activation

on:
  push:
    branches:
      - feature/activate-command-center-production
    paths:
      - '.github/workflows/activate-command-center-production.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activate-command-center-production
          fetch-depth: 0

      - name: Apply production activation patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/activate-command-center-production.py
          python <<'PY'
          from pathlib import Path
          path = Path('tests/tree-exposure-deploy-bootstrap.test.ts')
          text = path.read_text(encoding='utf-8')
          needle = "assert.deepEqual(productionComplete, { attempted: true, outcome: 'complete' });\n"
          if needle not in text:
              raise SystemExit('Production exposure fixture assertion was not found.')
          text = text.replace(needle, needle + "workerCalls = 0;\n", 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f scripts/activate-command-center-production.py .github/workflows/activate-command-center-production.yml
          git diff --check

      - name: Validate production activation and existing safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          app = Path('dapp/app.js').read_text(encoding='utf-8')
          env = Path('.env.example').read_text(encoding='utf-8')
          exposure_deploy = Path('netlify/functions/tree-exposure-on-deploy.ts').read_text(encoding='utf-8')
          badge_deploy = Path('netlify/functions/tree-badges-on-deploy.ts').read_text(encoding='utf-8')
          exposure_schedule = Path('netlify/functions/tree-exposure-refresh-scheduled.ts').read_text(encoding='utf-8')
          badge_schedule = Path('netlify/functions/tree-badges-refresh-scheduled.ts').read_text(encoding='utf-8')
          assert "const leaderboardUrl = '/api/tree-exposure';" in app
          assert "const badgeUrl = '/api/tree-badges';" in app
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          assert 'TREE_EXPOSURE_PRODUCTION_ENABLED=false' in env
          assert 'TREE_BADGE_PRODUCTION_ENABLED=false' in env
          assert "context === 'production'" in exposure_deploy
          assert "context === 'production'" in badge_deploy
          assert "schedule: '27 */6 * * *'" in exposure_schedule
          assert "schedule: '47 */6 * * *'" in badge_schedule
          assert not Path('.github/workflows/activate-command-center-production.yml').exists()
          assert not Path('scripts/activate-command-center-production.py').exists()
          PY
          git diff --check

      - name: Commit and push activation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Activate verified TREE exposure and badges in production"
          git push origin HEAD:feature/activate-command-center-production
