name: Apply Profile Studio overflow fix to badge branch

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/apply-profile-overflow-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-badges-v1
          fetch-depth: 0
      - name: Apply 360px Profile Studio containment
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('dapp/styles.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Profile Studio narrow-screen containment */'
          css = (
              '\n\n/* Profile Studio narrow-screen containment */\n'
              '.profile-layout>*{min-width:0;max-width:100%}\n'
              '.canvas-shell,.profile-maker-controls,.profile-frame-options,.profile-tuning{min-width:0;min-inline-size:0;max-width:100%;width:100%}\n'
              '.profile-maker-controls label,.profile-maker-controls input{min-width:0;max-width:100%}\n'
              '.profile-maker-controls input[type="file"]{display:block;width:100%}\n'
              '@media(max-width:380px){\n'
              '  .profile-frame-options{grid-template-columns:minmax(0,1fr)}\n'
              '  .profile-frame-options .profile-action,.profile-maker-controls>.profile-action,.profile-maker-controls>.profile-reset{width:100%;max-width:100%}\n'
              '}\n'
          )
          if marker not in text:
              text += css
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-360-profile-overflow.yml
          git diff --check
      - name: Validate branch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          grep -q 'Profile Studio narrow-screen containment' dapp/styles.css
          grep -q 'DAPP_SWAP_EXECUTION_ENABLED = false' dapp/app.js
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Fix 360px Profile Studio overflow"
          git push origin HEAD:feature/leaderboard-badges-v1
