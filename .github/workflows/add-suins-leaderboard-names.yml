name: Add SuiNS leaderboard identity enrichment

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/add-suins-leaderboard-names.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0

      - name: Apply SuiNS enrichment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-suins-enrichment.py
          rm -f \
            scripts/apply-suins-enrichment.py \
            .github/workflows/add-suins-leaderboard-names.yml \
            .github/workflows/fix-suins-enrichment-workflow.yml
          git diff --check

      - name: Validate SuiNS enrichment
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python - <<'PY'
          from pathlib import Path
          app = Path('dapp/app.js').read_text(encoding='utf-8')
          provider = Path('netlify/lib/leaderboard-provider.ts').read_text(encoding='utf-8')
          worker = Path('netlify/lib/leaderboard-background-worker.ts').read_text(encoding='utf-8')
          toml = Path('netlify.toml').read_text(encoding='utf-8')
          assert 'displayNameForEntry' in app
          assert 'suinsName?: string | null' in provider
          assert 'resolveDefaultSuinsNames' in worker
          assert '/api/tree-leaderboard-preview' not in toml
          assert Path('netlify/functions/tree-leaderboard-preview.ts').exists()
          assert Path('netlify/lib/suins-name-resolver.ts').exists()
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          assert 'scripts/swap.js' not in Path('dapp/index.html').read_text(encoding='utf-8')
          PY
          git diff --check

      - name: Commit SuiNS identity enrichment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Recognize default SuiNS names on the TREE leaderboard"
          git push origin HEAD:feature/command-center-ui-v2
