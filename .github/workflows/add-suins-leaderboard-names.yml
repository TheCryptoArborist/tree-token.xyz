          if anchor not in text:
              raise SystemExit('Leaderboard entry builder anchor not found')
          scanner.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          worker = Path('netlify/lib/leaderboard-background-worker.ts')
          text = worker.read_text(encoding='utf-8')
          import_anchor = "} from './sui-graphql-leaderboard-provider.ts';\n"
          import_replacement = "} from './sui-graphql-leaderboard-provider.ts';\nimport { resolveDefaultSuinsNames } from './suins-name-resolver.ts';\n"
          if import_anchor not in text:
              raise SystemExit('Worker import anchor not found')
          text = text.replace(import_anchor, import_replacement, 1)
          dep_anchor = "  scan?: typeof scanSuiGraphqlLeaderboard;\n  store?: LeaderboardStore;"
          dep_replacement = "  scan?: typeof scanSuiGraphqlLeaderboard;\n  resolveSuins?: typeof resolveDefaultSuinsNames;\n  store?: LeaderboardStore;"
          if dep_anchor not in text:
              raise SystemExit('Worker dependency anchor not found')
          text = text.replace(dep_anchor, dep_replacement, 1)
          const_anchor = "  const scan = dependencies.scan ?? scanSuiGraphqlLeaderboard;\n  const logger = dependencies.logger ?? console;"
          const_replacement = "  const scan = dependencies.scan ?? scanSuiGraphqlLeaderboard;\n  const resolveSuins = dependencies.resolveSuins ?? resolveDefaultSuinsNames;\n  const logger = dependencies.logger ?? console;"
          if const_anchor not in text:
              raise SystemExit('Worker resolver constant anchor not found')
          text = text.replace(const_anchor, const_replacement, 1)
          block_anchor = """    const completedAt = new Date(now()).toISOString();
              const terminalState = result.outcome === 'complete' ? 'complete' : result.outcome;
              let snapshotWritten = false;
              if (terminalState === 'complete') snapshotWritten = await writeCompleteLeaderboardSnapshot(result, storeOptions);
              const effectiveState = terminalState === 'complete' && !snapshotWritten ? 'verification-incomplete' : terminalState;
          """
          block_replacement = """    let snapshotResult = result;
              if (result.outcome === 'complete') {
                try {
                  const resolution = await resolveSuins(result.entries.map((entry) => entry.wallet), { endpoint: config.endpoint });
                  snapshotResult = {
                    ...result,
                    entries: result.entries.map((entry) => ({ ...entry, suinsName: resolution.names[entry.wallet] || null })),
                    warnings: [
                      ...result.warnings,
                      ...(!resolution.complete ? ['Some default SuiNS names could not be resolved during this refresh.'] : []),
                    ],
                  };
                } catch {
                  snapshotResult = {
                    ...result,
                    entries: result.entries.map((entry) => ({ ...entry, suinsName: null })),
                    warnings: [...result.warnings, 'Default SuiNS name resolution was unavailable during this refresh.'],
                  };
                }
              }
              const completedAt = new Date(now()).toISOString();
              const terminalState = snapshotResult.outcome === 'complete' ? 'complete' : snapshotResult.outcome;
              let snapshotWritten = false;
              if (terminalState === 'complete') snapshotWritten = await writeCompleteLeaderboardSnapshot(snapshotResult, storeOptions);
              const effectiveState = terminalState === 'complete' && !snapshotWritten ? 'verification-incomplete' : terminalState;
          """
          if block_anchor not in text:
              raise SystemExit('Worker snapshot block anchor not found')
          text = text.replace(block_anchor, block_replacement, 1)
          for old, new in [
              ('result.coverage.coinMetadataVerified', 'snapshotResult.coverage.coinMetadataVerified'),
              ('result.coverage.coinSymbol', 'snapshotResult.coverage.coinSymbol'),
              ('result.coverage.coinDecimals', 'snapshotResult.coverage.coinDecimals'),
              ('result.coverage.totalSupplyRaw', 'snapshotResult.coverage.totalSupplyRaw'),
              ('result.coverage.pagesScanned', 'snapshotResult.coverage.pagesScanned'),
              ('result.coverage.objectsScanned', 'snapshotResult.coverage.objectsScanned'),
              ('result.coverage.addressOwnedCoinObjects', 'snapshotResult.coverage.addressOwnedCoinObjects'),
              ('result.coverage.uniqueAddressOwners', 'snapshotResult.coverage.uniqueAddressOwners'),
              ('result.coverage.excludedCoinObjects', 'snapshotResult.coverage.excludedCoinObjects'),
              ('result.coverage.excludedUniqueOwners', 'snapshotResult.coverage.excludedUniqueOwners'),
              ('result.coverage.excludedAddresses', 'snapshotResult.coverage.excludedAddresses'),
              ('result.coverage.elapsedMs', 'snapshotResult.coverage.elapsedMs'),
              ('result.coverage.hasNextPage', 'snapshotResult.coverage.hasNextPage'),
              ('result.coverage.reachedEnd', 'snapshotResult.coverage.reachedEnd'),
          ]:
              text = text.replace(old, new)
          worker.write_text(text, encoding='utf-8')

          app_path = Path('dapp/app.js')
          app = app_path.read_text(encoding='utf-8')
          shortened_anchor = """function shortened(address) {
            return address.length > 14 ? `${address.slice(0, 7)}…${address.slice(-5)}` : address;
          }


          function elementById(id) {"""
          shortened_replacement = """function shortened(address) {
            return address.length > 14 ? `${address.slice(0, 7)}…${address.slice(-5)}` : address;
          }

          function displayNameForEntry(entry) {
            const name = typeof entry?.suinsName === 'string' ? entry.suinsName.trim() : '';
            return name || shortened(String(entry?.wallet || ''));
          }

          function elementById(id) {"""
          if shortened_anchor not in app:
              raise SystemExit('DApp display name anchor not found')
          app = app.replace(shortened_anchor, shortened_replacement, 1)

          card_anchor = """    const walletLine = document.createElement('div'); walletLine.className = 'leader-wallet';
              const wallet = document.createElement('span'); wallet.textContent = shortened(entry.wallet); wallet.title = entry.wallet; walletLine.append(wallet);
              const tierDefinition = tierForEntry(entry);
              const tier = document.createElement('div'); tier.className = `leader-tier ${tierDefinition?.css || ''}`.trim(); tier.textContent = `${tierDefinition?.icon || '🌿'} ${tierDefinition?.name || entry.tier || 'Ranked'}`;
              identity.append(walletLine, tier);"""
          card_replacement = """    const walletLine = document.createElement('div'); walletLine.className = 'leader-wallet';
              const wallet = document.createElement('span'); wallet.textContent = displayNameForEntry(entry); wallet.title = entry.suinsName || entry.wallet; walletLine.append(wallet);
              const addressLine = document.createElement('div'); addressLine.className = 'leader-address'; addressLine.textContent = shortened(entry.wallet); addressLine.title = entry.wallet;
              const tierDefinition = tierForEntry(entry);
              const tier = document.createElement('div'); tier.className = `leader-tier ${tierDefinition?.css || ''}`.trim(); tier.textContent = `${tierDefinition?.icon || '🌿'} ${tierDefinition?.name || entry.tier || 'Ranked'}`;
              identity.append(walletLine, ...(entry.suinsName ? [addressLine] : []), tier);"""
          if card_anchor not in app:
              raise SystemExit('Leaderboard identity card anchor not found')
          app = app.replace(card_anchor, card_replacement, 1)

          share_anchor = "return `I’m #${row.rank} on the verified TREE Canopy Leaderboard — ${tier} with ${row.directTree} direct TREE. https://tree-token.xyz/dapp/#leaderboard`;"
          share_replacement = "return `I’m #${row.rank} on the verified TREE Canopy Leaderboard — ${displayNameForEntry(row)}, ${tier}, with ${row.directTree} direct TREE. https://tree-token.xyz/dapp/#leaderboard`;"
          if share_anchor not in app:
              raise SystemExit('Rank share anchor not found')
          app = app.replace(share_anchor, share_replacement, 1)

          canvas_anchor = """  ctx.fillStyle = '#f5fbff'; ctx.font = '700 34px ui-monospace, monospace'; ctx.fillText(shortened(row.wallet), 90, 890);
            ctx.fillStyle = '#35f28c'; ctx.font = '800 34px ui-monospace, monospace'; ctx.fillText('tree-token.xyz/dapp', 90, 1050);"""
          canvas_replacement = """  ctx.fillStyle = '#f5fbff'; ctx.font = '700 34px ui-monospace, monospace'; ctx.fillText(displayNameForEntry(row), 90, 870);
            if (row.suinsName) { ctx.fillStyle = '#9aa9b8'; ctx.font = '600 27px ui-monospace, monospace'; ctx.fillText(shortened(row.wallet), 90, 915); }
            ctx.fillStyle = '#35f28c'; ctx.font = '800 34px ui-monospace, monospace'; ctx.fillText('tree-token.xyz/dapp', 90, 1050);"""
          if canvas_anchor not in app:
              raise SystemExit('Rank card identity anchor not found')
          app = app.replace(canvas_anchor, canvas_replacement, 1)

          table_anchor = "[entry.rank, shortened(entry.wallet), entry.directTree, entry.supplyPercent === null || entry.supplyPercent === undefined ? '—' : `${entry.supplyPercent}%`, tierForEntry(entry)?.name || entry.tier || 'Ranked']"
          table_replacement = "[entry.rank, displayNameForEntry(entry), entry.directTree, entry.supplyPercent === null || entry.supplyPercent === undefined ? '—' : `${entry.supplyPercent}%`, tierForEntry(entry)?.name || entry.tier || 'Ranked']"
          if table_anchor not in app:
              raise SystemExit('Fallback table identity anchor not found')
          app = app.replace(table_anchor, table_replacement, 1)

          export_anchor = "export { DAPP_SWAP_EXECUTION_ENABLED, TIER_DEFINITIONS, formatSupplyPercentFromRaw, formatTreePrice, readDashboardCache, renderLeaderboard, tierForEntry, updateYourRank, writeDashboardCache };"
          export_replacement = "export { DAPP_SWAP_EXECUTION_ENABLED, TIER_DEFINITIONS, displayNameForEntry, formatSupplyPercentFromRaw, formatTreePrice, readDashboardCache, renderLeaderboard, tierForEntry, updateYourRank, writeDashboardCache };"
          if export_anchor not in app:
              raise SystemExit('DApp export anchor not found')
          app_path.write_text(app.replace(export_anchor, export_replacement, 1), encoding='utf-8')

          styles_path = Path('dapp/styles.css')
          styles = styles_path.read_text(encoding='utf-8').rstrip()
          styles += """

          /* SuiNS leaderboard identity */
          .leader-address{margin-top:2px;color:var(--muted-2);font:.66rem var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .leader-wallet span{color:var(--text)}
          """
          styles_path.write_text(styles, encoding='utf-8')

          toml_path = Path('netlify.toml')
          toml = toml_path.read_text(encoding='utf-8')
          redirect = """[[redirects]]
          from = "/api/tree-leaderboard-preview"
          to = "https://tree-token.xyz/api/tree-leaderboard"
          status = 200
          force = true

          """
          if redirect not in toml:
              raise SystemExit('Preview redirect block not found')
          toml_path.write_text(toml.replace(redirect, '', 1), encoding='utf-8')

          test_path = Path('tests/leaderboard-ui-state.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          import_anchor = "const { TIER_DEFINITIONS, formatSupplyPercentFromRaw, renderLeaderboard, tierForEntry } = await import('../dapp/app.js');"
          import_replacement = "const { TIER_DEFINITIONS, displayNameForEntry, formatSupplyPercentFromRaw, renderLeaderboard, tierForEntry } = await import('../dapp/app.js');"
          if import_anchor not in test:
              raise SystemExit('UI test import anchor not found')
          test = test.replace(import_anchor, import_replacement, 1)
          test_anchor = "assert.equal(tierForEntry({ rank: 1, directTree: '1' }).name, 'Champion Tree');\n"
          test_replacement = """assert.equal(tierForEntry({ rank: 1, directTree: '1' }).name, 'Champion Tree');
          assert.equal(displayNameForEntry({ wallet: `0x${'c'.repeat(64)}`, suinsName: 'cryptoarborist.sui' }), 'cryptoarborist.sui');
          assert.match(displayNameForEntry({ wallet: `0x${'c'.repeat(64)}`, suinsName: null }), /^0x/);
          """
          if test_anchor not in test:
              raise SystemExit('UI SuiNS test anchor not found')
          test_path.write_text(test.replace(test_anchor, test_replacement, 1), encoding='utf-8')

          background_test = Path('tests/leaderboard-background-worker.test.ts')
          test = background_test.read_text(encoding='utf-8')
          entry_anchor = "entries: [{ rank: 1, wallet: `0x${'a'.repeat(64)}`, directTreeRaw: '3'"
          entry_replacement = "entries: [{ rank: 1, wallet: `0x${'a'.repeat(64)}`, suinsName: null, directTreeRaw: '3'"
          if entry_anchor not in test:
              raise SystemExit('Background entry fixture anchor not found')
          test = test.replace(entry_anchor, entry_replacement, 1)
          success_anchor = """    return completeScan;
            },
          });
          assert.equal(successful.outcome, 'complete');"""
          success_replacement = """    return completeScan;
            },
            resolveSuins: async (wallets) => ({
              names: Object.fromEntries(wallets.map((wallet) => [wallet, 'cryptoarborist.sui'])),
              requestedCount: wallets.length, resolvedCount: wallets.length, complete: true,
              graphqlErrors: [], networkError: null, generatedAt: '2026-08-05T00:00:00.000Z',
            }),
          });
          assert.equal(successful.outcome, 'complete');"""
          if success_anchor not in test:
              raise SystemExit('Background resolver injection anchor not found')
          test = test.replace(success_anchor, success_replacement, 1)
          assertion_anchor = "assert.ok(successfulStore.values.get(COMPLETE_SNAPSHOT_KEY));\n"
          assertion_replacement = """assert.ok(successfulStore.values.get(COMPLETE_SNAPSHOT_KEY));
          assert.equal((successfulStore.values.get(COMPLETE_SNAPSHOT_KEY) as { entries: Array<{ suinsName: string | null }> }).entries[0].suinsName, 'cryptoarborist.sui');
          """
          if assertion_anchor not in test:
              raise SystemExit('Background SuiNS assertion anchor not found')
          background_test.write_text(test.replace(assertion_anchor, assertion_replacement, 1), encoding='utf-8')
          PY

          cat > tests/suins-name-resolver.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import { buildDefaultSuinsQuery, resolveDefaultSuinsNames } from '../netlify/lib/suins-name-resolver.ts';

          const first = `0x${'a'.repeat(64)}`;
          const second = `0x${'b'.repeat(64)}`;
          const built = buildDefaultSuinsQuery([first, second]);
          assert.match(built.query, /defaultSuinsName/);
          assert.equal(built.variables.address0, first);
          assert.equal(built.variables.address1, second);

          let requests = 0;
          const success = await resolveDefaultSuinsNames([first, second, first, 'invalid'], {
            fetchImpl: async (_url, init) => {
              requests += 1;
              const body = JSON.parse(String(init?.body));
              assert.equal(Object.keys(body.variables).length, 2);
              return new Response(JSON.stringify({ data: {
                name0: { defaultSuinsName: 'cryptoarborist.sui' },
                name1: { defaultSuinsName: null },
              } }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            },
          });
          assert.equal(requests, 1);
          assert.equal(success.requestedCount, 2);
          assert.equal(success.resolvedCount, 1);
          assert.equal(success.names[first], 'cryptoarborist.sui');
          assert.equal(success.names[second], null);
          assert.equal(success.complete, true);

          const partial = await resolveDefaultSuinsNames([first], {
            fetchImpl: async () => new Response(JSON.stringify({
              data: { name0: { defaultSuinsName: 'name.sui' } },
              errors: [{ message: 'partial fixture' }],
            }), { status: 200, headers: { 'Content-Type': 'application/json' } }),
          });
          assert.equal(partial.names[first], 'name.sui');
          assert.equal(partial.complete, false);
          assert.deepEqual(partial.graphqlErrors, ['partial fixture']);

          const failed = await resolveDefaultSuinsNames([first], {
            fetchImpl: async () => new Response('', { status: 503 }),
          });
          assert.equal(failed.complete, false);
          assert.match(failed.networkError || '', /503/);

          console.log('SuiNS name resolver: PASS (batching, deduplication, fallback, and safe failure)');
          EOF

          cat > tests/leaderboard-preview-function.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import { handleTreeLeaderboardPreviewRequest } from '../netlify/functions/tree-leaderboard-preview.ts';

          const wallet = `0x${'a'.repeat(64)}`;
          const context = { deploy: { context: 'deploy-preview', id: 'preview', published: false }, site: { url: 'https://preview.test' } };
          const response = await handleTreeLeaderboardPreviewRequest(new Request('https://preview.test/api/tree-leaderboard-preview'), context, {
            fetchImpl: async () => new Response(JSON.stringify({ status: 'ok', entries: [{ rank: 1, wallet }], warnings: [] }), { status: 200 }),
