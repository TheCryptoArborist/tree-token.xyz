name: Read Turbos TREE position creation transaction

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/read-turbos-creation-transaction.yml'

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Read creation transaction events and object changes
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/read-turbos-creation-transaction.ts <<'TS'
          const GRAPHQL = 'https://graphql.mainnet.sui.io/graphql';
          const DIGEST = 'DaVTXHY6yAXGKravH2uzuCXbXkErtJBXsawrrgnPGcic';
          const query = `query Transaction($digest: String!) {
            transaction(digest: $digest) {
              digest
              sender { address }
              transactionJson
              effects {
                status
                timestamp
                effectsJson
                events(first: 50) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    sequenceNumber
                    timestamp
                    sender { address }
                    transactionModule { name package { address } }
                    contents { type { repr } json }
                  }
                }
                objectChanges(first: 50) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    address
                    idCreated
                    idDeleted
                    inputState { version asMoveObject { contents { type { repr } json } } }
                    outputState { version owner { __typename } asMoveObject { contents { type { repr } json } } }
                  }
                }
              }
            }
          }`;
          const response = await fetch(GRAPHQL, {
            method: 'POST',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables: { digest: DIGEST } }),
          });
          console.log(response.status, JSON.stringify(await response.json(), null, 2));
          TS
          npx --yes tsx scripts/read-turbos-creation-transaction.ts

      - name: Remove temporary reader
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/read-turbos-creation-transaction.yml scripts/read-turbos-creation-transaction.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Turbos creation transaction read"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
