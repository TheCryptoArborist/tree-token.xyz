name: Validate TREE badge background dispatch

on:
  push:
    branches:
      - feature/leaderboard-badges-v1
    paths:
      - '.github/workflows/validate-badge-bootstrap-fix.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-badges-v1
          fetch-depth: 0
      - name: Run full validation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          bootstrap=Path('netlify/functions/tree-badges-on-deploy.ts').read_text(encoding='utf-8')
          exposure=Path('netlify/lib/tree-exposure-scan-runner.ts').read_text(encoding='utf-8')
          assert '/.netlify/functions/tree-badges-refresh-background' in bootstrap
          assert 'response.status !== 202' in bootstrap
          assert 'runTreeBadgeBackgroundWorker' not in bootstrap
          assert 'scanTreeTradingActivity' not in exposure
          assert 'scanTreeBurnContributions' not in exposure
          PY
          git diff --check
      - name: Remove validation workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-badge-bootstrap-fix.yml
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Validate TREE badge background dispatch"
          git push origin HEAD:feature/leaderboard-badges-v1
