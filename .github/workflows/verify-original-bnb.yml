name: Verify original-NFT BNB deployment page
on:
  pull_request:
    paths:
      - 'scripts/multichain/original-bnb-core.mjs'
      - 'scripts/multichain/verify-original-bnb-build.mjs'
      - 'scripts/multichain/original-slot-core.mjs'
      - 'scripts/multichain/original-publish-core.mjs'
      - 'docs/multichain/original-trial/**'
      - 'docs/multichain/bnb-one-slot/reviewed-artifacts.json'
      - 'contracts/bnb-one-slot/**'
      - 'play/multichaintest/original/bnb/**'
      - 'tests/multichain-original-bnb.test.mjs'
      - '.github/workflows/verify-original-bnb.yml'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix contracts/bnb-one-slot
      - run: node contracts/bnb-one-slot/scripts/review-artifacts.mjs --check
      - run: node scripts/multichain/verify-original-bnb-build.mjs
      - run: node --test tests/multichain-original-bnb.test.mjs tests/multichain-original-slot.test.mjs tests/multichain-original-publish.test.mjs
      - run: npm test --prefix contracts/bnb-one-slot
      - run: |
          node_modules/.bin/esbuild scripts/multichain/original-bnb-core.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/adapter-core.js
          cmp /tmp/adapter-core.js play/multichaintest/original/bnb/core.js
          node --check play/multichaintest/original/bnb/app.js
          git diff --check
