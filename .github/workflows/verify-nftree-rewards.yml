name: Verify NFTree Rewards
on:
  pull_request:
    paths:
      - 'rewards-app/**'
      - 'scripts/nftree-rewards-entry.js'
      - 'scripts/release-nftree-rewards.mjs'
      - 'scripts/release-rewards-theme.mjs'
      - 'tests/rewards-theme-release.test.mjs'
      - 'production/rewards-theme-static/**'
      - 'scripts/redirect-treedrop.mjs'
      - 'scripts/treedrop-native-entry.html'
      - 'tests/nftree-rewards-release.test.mjs'
      - 'tests/treedrop-redirect-release.test.mjs'
      - 'tests/treedrop-native-entry.test.mjs'
      - 'production/rewards-integration-static/**'
      - '.github/workflows/verify-nftree-rewards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rewards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rewards-app/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: rewards-app
      - run: npm run build
        working-directory: rewards-app
      - run: node --test tests/*.test.mjs
        working-directory: rewards-app
      - run: node --test tests/nftree-rewards-release.test.mjs tests/rewards-theme-release.test.mjs
      - run: node --test tests/treedrop-redirect-release.test.mjs
      - run: node --test tests/treedrop-native-entry.test.mjs
      - run: git diff --check
