name: Migrate TREE swap and wallet reads to Sui gRPC

on:
  push:
    branches:
      - feature/tree-aggregated-swap-v1
    paths:
      - '.github/workflows/migrate-tree-swap-grpc.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-aggregated-swap-v1
          fetch-depth: 0

      - name: Migrate wallet and swap clients to Mysten Sui v2 gRPC
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          wallet_path = Path('scripts/wallet.js')
          wallet = wallet_path.read_text(encoding='utf-8')
          old_imports = """import { getWallets } from 'https://esm.run/@mysten/wallet-standard@0.13.0';
          import { SuiClient } from 'https://esm.run/@mysten/sui@1.43.0/client';"""
          new_imports = """import {
            getWallets,
            signAndExecuteTransaction as walletSignAndExecuteTransaction,
          } from 'https://esm.run/@mysten/wallet-standard@0.21.3';
          import { SuiGrpcClient } from 'https://esm.run/@mysten/sui@2.23.1/grpc';"""
          if old_imports not in wallet:
              raise SystemExit('Could not locate the legacy wallet imports.')
          wallet = wallet.replace(old_imports, new_imports, 1)
          wallet = wallet.replace(
              "const WALLET_STANDARD_URL = 'https://esm.run/@mysten/wallet-standard@0.13.0';",
              "const WALLET_STANDARD_URL = 'https://esm.run/@mysten/wallet-standard@0.21.3';",
              1,
          )
          old_client = """function _getClient() {
            if (!_suiClient) _suiClient = new SuiClient({ url: RPC_URL });
            return _suiClient;
          }"""
          new_client = """function _getClient() {
            if (!_suiClient) {
              _suiClient = new SuiGrpcClient({
                network: NETWORK,
                baseUrl: RPC_URL,
              });
            }
            return _suiClient;
          }"""
          if old_client not in wallet:
              raise SystemExit('Could not locate the legacy wallet client factory.')
          wallet = wallet.replace(old_client, new_client, 1)
          old_balance = """async function getBalance() {
            if (!window.playerAddress) throw new Error('Wallet not connected');
            const balance = await _getClient().getBalance({ owner: window.playerAddress, coinType: '0x2::sui::SUI' });
            return BigInt(balance.totalBalance);
          }"""
          new_balance = """async function getBalance() {
            if (!window.playerAddress) throw new Error('Wallet not connected');
            const { balance } = await _getClient().core.getBalance({
              owner: window.playerAddress,
              coinType: '0x2::sui::SUI',
            });
            return BigInt(balance.balance);
          }"""
          if old_balance not in wallet:
              raise SystemExit('Could not locate the legacy wallet balance reader.')
          wallet = wallet.replace(old_balance, new_balance, 1)
          wallet = re.sub(
              r"async function signAndExecuteTransactionBlock\(txb\) \{[\s\S]*?\n\}",
              """async function signAndExecuteTransactionBlock(transaction) {
            if (!_wallet || !_address || !_account) throw new Error('Wallet not connected');
            if (!getSuiSignFeature(_wallet)) throw new Error('Wallet does not support Sui transaction signing.');
            return walletSignAndExecuteTransaction(_wallet, {
              account: _account,
              chain: CHAIN,
              transaction,
            });
          }""",
              wallet,
              count=1,
          )
          if 'new SuiClient' in wallet or '@mysten/sui@1.43.0/client' in wallet or '.getBalance({ owner:' in wallet:
              raise SystemExit('Legacy wallet JSON-RPC client code remains.')
          wallet_path.write_text(wallet, encoding='utf-8')

          swap_path = Path('dapp/swap-router.js')
          swap = swap_path.read_text(encoding='utf-8')
          old_swap_imports = """import { Transaction } from 'https://esm.run/@mysten/sui@1.43.0/transactions';
          import { SuiClient } from 'https://esm.run/@mysten/sui@1.43.0/client';"""
          new_swap_imports = """import { Transaction } from 'https://esm.run/@mysten/sui@2.23.1/transactions';
          import { SuiGrpcClient } from 'https://esm.run/@mysten/sui@2.23.1/grpc';"""
          if old_swap_imports not in swap:
              raise SystemExit('Could not locate the legacy swap imports.')
          swap = swap.replace(old_swap_imports, new_swap_imports, 1)
          swap = swap.replace(
              "const client = new SuiClient({ url: RPC_URL });",
              "const client = new SuiGrpcClient({ network: 'mainnet', baseUrl: RPC_URL });",
              1,
          )
          old_balances = """    const [sui, tree] = await Promise.all([
              client.getBalance({ owner: address, coinType: SUI_TYPE }),
              client.getBalance({ owner: address, coinType: TREE_TYPE }),
            ]);
            state.balances = { sui: BigInt(sui.totalBalance || '0'), tree: BigInt(tree.totalBalance || '0') };"""
          new_balances = """    const [sui, tree] = await Promise.all([
              client.core.getBalance({ owner: address, coinType: SUI_TYPE }),
              client.core.getBalance({ owner: address, coinType: TREE_TYPE }),
            ]);
            state.balances = {
              sui: BigInt(sui.balance.balance || '0'),
              tree: BigInt(tree.balance.balance || '0'),
            };"""
          if old_balances not in swap:
              raise SystemExit('Could not locate the legacy swap balance reader.')
          swap = swap.replace(old_balances, new_balances, 1)
          old_coins = """async function getAllCoins(owner, coinType) {
            const coins = [];
            let cursor = null;
            do {
              const page = await client.getCoins({ owner, coinType, cursor, limit: 50 });
              coins.push(...(page.data || []));
              cursor = page.hasNextPage ? page.nextCursor : null;
            } while (cursor);
            return coins.filter((coin) => BigInt(coin.balance || '0') > 0n).sort((left, right) => BigInt(right.balance || '0') > BigInt(left.balance || '0') ? 1 : -1);
          }"""
          new_coins = """async function getAllCoins(owner, coinType) {
            const coins = [];
            let cursor = null;
            do {
              const page = await client.core.listCoins({ owner, coinType, cursor, limit: 50 });
              coins.push(...(page.objects || []));
              cursor = page.hasNextPage ? page.cursor : null;
            } while (cursor);
            return coins
              .filter((coin) => BigInt(coin.balance || '0') > 0n)
              .sort((left, right) => BigInt(right.balance || '0') > BigInt(left.balance || '0') ? 1 : -1);
          }"""
          if old_coins not in swap:
              raise SystemExit('Could not locate the legacy swap coin reader.')
          swap = swap.replace(old_coins, new_coins, 1)

          old_validate = """function validateRoute(route, amountIn) {
            if (!route || route.type !== 'direct') throw new Error('Only a direct TREE route can be executed in this release.');
            if (BigInt(route.amountIn) !== amountIn) throw new Error('The route amount no longer matches the form.');
            if (normalizeType(route.tokenIn) !== normalizeType(stateTokenIn()) || normalizeType(route.tokenOut) !== normalizeType(stateTokenOut())) throw new Error('The route token pair no longer matches the form.');
            if (route.executionKind === 'suidex-v2-direct' && route.pairId !== V2_POOL) throw new Error('Unexpected SuiDex V2 pool.');
            if (route.executionKind === 'suidex-v3-direct' && route.pairId !== V3_POOL) throw new Error('Unexpected SuiDex V3 pool.');
            if (!['suidex-v2-direct', 'suidex-v3-direct'].includes(route.executionKind)) throw new Error('Unsupported route venue.');
            if (BigInt(route.minAmountOut) <= 0n) throw new Error('The route does not contain a valid minimum output.');
          }"""
          new_validate = """function validateRoute(route, amountIn) {
            if (!route || route.type !== 'direct') throw new Error('Only a direct TREE route can be executed in this release.');
            if (BigInt(route.amountIn) !== amountIn) throw new Error('The route amount no longer matches the form.');
            const input = normalizeType(route.tokenIn);
            const output = normalizeType(route.tokenOut);
            const sui = normalizeType(SUI_TYPE);
            const tree = normalizeType(TREE_TYPE);
            if (!((input === sui && output === tree) || (input === tree && output === sui))) throw new Error('The route token pair is not SUI/TREE.');
            if (route.executionKind === 'suidex-v2-direct' && route.pairId !== V2_POOL) throw new Error('Unexpected SuiDex V2 pool.');
            if (route.executionKind === 'suidex-v3-direct' && route.pairId !== V3_POOL) throw new Error('Unexpected SuiDex V3 pool.');
            if (!['suidex-v2-direct', 'suidex-v3-direct'].includes(route.executionKind)) throw new Error('Unsupported route venue.');
            if (BigInt(route.minAmountOut) <= 0n) throw new Error('The route does not contain a valid minimum output.');
          }"""
          if old_validate not in swap:
              raise SystemExit('Could not locate the route validator.')
          swap = swap.replace(old_validate, new_validate, 1)

          start = swap.find('function dryRunSucceeded(result) {')
          end = swap.find('\nasync function executeSwap()', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the legacy simulation/finality helpers.')
          new_helpers = """function coreTransaction(result) {
            if (result?.$kind === 'Transaction') return result.Transaction;
            return result?.Transaction || null;
          }

          function coreFailureMessage(result, fallback = 'Sui transaction failed.') {
            const failedError = result?.FailedTransaction?.status?.error;
            if (typeof failedError === 'string') return failedError;
            if (failedError?.message) return failedError.message;
            const effectsError = coreTransaction(result)?.effects?.status?.error;
            if (typeof effectsError === 'string') return effectsError;
            if (effectsError?.message) return effectsError.message;
            return fallback;
          }

          function coreTransactionSucceeded(result) {
            const transaction = coreTransaction(result);
            return Boolean(transaction && transaction.effects?.status?.success === true);
          }

          function extractDigest(result) {
            return result?.digest || result?.Transaction?.digest || result?.effects?.transactionDigest || result?.transactionBlockDigest || null;
          }

          async function waitForFinality(digest) {
            return client.core.waitForTransaction({
              digest,
              timeout: 60_000,
              include: { effects: true, balanceChanges: true },
            });
          }

          function transactionSucceeded(result) {
            return coreTransactionSucceeded(result);
          }
          """
          swap = swap[:start] + new_helpers + swap[end:]
          old_simulation = """    const bytes = await tx.build({ client });
            const dryRun = await client.dryRunTransactionBlock({ transactionBlock: bytes });
            if (!dryRunSucceeded(dryRun)) throw new Error(dryRun?.effects?.status?.error || 'Transaction simulation failed.');"""
          new_simulation = """    const bytes = await tx.build({ client });
            const simulation = await client.core.simulateTransaction({
              transaction: bytes,
              include: { effects: true, balanceChanges: true },
            });
            if (!coreTransactionSucceeded(simulation)) {
              throw new Error(coreFailureMessage(simulation, 'Transaction simulation failed.'));
            }"""
          if old_simulation not in swap:
              raise SystemExit('Could not locate the legacy swap simulation call.')
          swap = swap.replace(old_simulation, new_simulation, 1)
          swap = swap.replace(
              "if (!transactionSucceeded(final)) throw new Error(final?.effects?.status?.error || 'The transaction did not finalize successfully.');",
              "if (!transactionSucceeded(final)) throw new Error(coreFailureMessage(final, 'The transaction did not finalize successfully.'));",
              1,
          )
          if '@mysten/sui@1.43.0' in swap or 'new SuiClient' in swap or '.getCoins({' in swap or '.getBalance({' in swap or 'dryRunTransactionBlock' in swap or 'waitForTransactionBlock' in swap:
              raise SystemExit('Legacy swap JSON-RPC client code remains.')
          swap_path.write_text(swap, encoding='utf-8')

          source_test_path = Path('tests/tree-swap-client-source.test.mjs')
          source_test = source_test_path.read_text(encoding='utf-8')
          source_test = source_test.replace("assert.equal(swap.includes(\"dryRunTransactionBlock\"), true);", "assert.equal(swap.includes('client.core.simulateTransaction'), true);")
          source_test = source_test.replace("assert.equal(swap.includes('waitForTransactionBlock'), true);", "assert.equal(swap.includes('client.core.waitForTransaction'), true);")
          source_test = source_test.replace(
              "assert.equal(quote.includes(\"path: '/api/tree-swap-quote'\"), true);",
              """assert.equal(quote.includes(\"path: '/api/tree-swap-quote'\"), true);
          assert.equal(swap.includes('@mysten/sui@2.23.1/grpc'), true);
          assert.equal(swap.includes('SuiGrpcClient'), true);
          assert.equal(swap.includes('@mysten/sui@1.43.0'), false);
          assert.equal(swap.includes('dryRunTransactionBlock'), false);
          assert.equal(swap.includes('waitForTransactionBlock'), false);""",
              1,
          )
          source_test_path.write_text(source_test, encoding='utf-8')

          wallet_test_path = Path('tests/wallet-manager-source.test.mjs')
          wallet_test = wallet_test_path.read_text(encoding='utf-8')
          wallet_test = wallet_test.replace(
              "assert.match(wallet, /@mysten\\/slush-wallet@1\\.1\\.8/);",
              """assert.match(wallet, /@mysten\\/slush-wallet@1\\.1\\.8/);
          assert.match(wallet, /@mysten\\/wallet-standard@0\\.21\\.3/);
          assert.match(wallet, /@mysten\\/sui@2\\.23\\.1\\/grpc/);
          assert.match(wallet, /walletSignAndExecuteTransaction/);
          assert.match(wallet, /client\.core\.getBalance|_getClient\(\)\.core\.getBalance/);
          assert.doesNotMatch(wallet, /new SuiClient|@mysten\\/sui@1\\.43\\.0\\/client/);""",
              1,
          )
          wallet_test_path.write_text(wallet_test, encoding='utf-8')

          migration_test = Path('tests/sui-grpc-client-migration.test.mjs')
          migration_test.write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const wallet = await readFile('scripts/wallet.js', 'utf8');
          const swap = await readFile('dapp/swap-router.js', 'utf8');
          for (const source of [wallet, swap]) {
            assert.equal(source.includes('SuiClient'), false);
            assert.equal(source.includes('@mysten/sui@1.43.0'), false);
            assert.equal(source.includes('dryRunTransactionBlock'), false);
            assert.equal(source.includes('waitForTransactionBlock'), false);
          }
          assert.equal(wallet.includes('SuiGrpcClient'), true);
          assert.equal(wallet.includes('walletSignAndExecuteTransaction'), true);
          assert.equal(wallet.includes('.core.getBalance'), true);
          assert.equal(swap.includes('SuiGrpcClient'), true);
          assert.equal(swap.includes('.core.getBalance'), true);
          assert.equal(swap.includes('.core.listCoins'), true);
          assert.equal(swap.includes('.core.simulateTransaction'), true);
          assert.equal(swap.includes('.core.waitForTransaction'), true);
          assert.equal(swap.includes('result?.FailedTransaction'), true);
          console.log('Sui gRPC client migration: PASS (balances, coins, simulation, finality, and wallet-standard execution helper)');
          """, encoding='utf-8')
          PY
          rm -f .github/workflows/migrate-tree-swap-grpc.yml
          git diff --check

      - name: Validate source, build, and all existing systems
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check scripts/wallet.js
          node --check dapp/swap-router.js
          node --check dapp/app.js
          node tests/sui-grpc-client-migration.test.mjs
          node tests/tree-swap-client-source.test.mjs
          npx --yes tsx tests/tree-swap-route.test.ts
          node tests/wallet-manager-core.test.mjs
          node tests/wallet-manager-source.test.mjs
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          wallet = Path('scripts/wallet.js').read_text(encoding='utf-8')
          swap = Path('dapp/swap-router.js').read_text(encoding='utf-8')
          for source in [wallet, swap]:
              assert 'SuiClient' not in source
              assert '@mysten/sui@1.43.0' not in source
              assert 'dryRunTransactionBlock' not in source
              assert 'waitForTransactionBlock' not in source
          assert '@mysten/wallet-standard@0.21.3' in wallet
          assert 'walletSignAndExecuteTransaction' in wallet
          assert '@mysten/sui@2.23.1/grpc' in wallet and '@mysten/sui@2.23.1/grpc' in swap
          assert 'client.core.simulateTransaction' in swap
          assert 'client.core.waitForTransaction' in swap
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in Path('dapp/app.js').read_text(encoding='utf-8')
          PY
          git diff --check

      - name: Verify Sui gRPC-Web imports and reads in real browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core@24
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tree-grpc-migration.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const BASE = 'http://127.0.0.1:4173';
          const SUI = '0x2::sui::SUI';
          const TREE = '0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          (async () => {
            const exposureResponse = await fetch('https://tree-token.xyz/api/tree-exposure');
            const exposure = await exposureResponse.json();
            if (!['ok', 'stale'].includes(exposure.status) || !Array.isArray(exposure.entries) || !exposure.entries.length) throw new Error(`Production exposure unavailable: ${JSON.stringify({status: exposure.status, entries: exposure.entries?.length})}`);
            const candidates = exposure.entries.map((entry) => ({ owner: entry.wallet || entry.address, liquidTreeRaw: entry.liquidTreeRaw || entry.directTreeRaw || '0' })).filter((entry) => /^0x[0-9a-f]{64}$/i.test(entry.owner || '') && BigInt(entry.liquidTreeRaw) >= 100_000_000_000n);
            if (!candidates.length) throw new Error('No public dry-run owner candidates were available.');

            const buyRaw = await (await fetch(`https://dex.suidex.org/api/v3/route?${new URLSearchParams({tokenIn:SUI,tokenOut:TREE,amountIn:'1000000000',slippageBps:'100'})}`)).json();
            const sellRaw = await (await fetch(`https://dex.suidex.org/api/v3/route?${new URLSearchParams({tokenIn:TREE,tokenOut:SUI,amountIn:'100000000000',slippageBps:'100'})}`)).json();
            const mapRoutes = (payload, tokenIn, tokenOut) => (payload.directRoutes || []).filter((route) => ['suidex','v3'].includes(route?.hops?.[0]?.venue)).map((route) => {
              const hop = route.hops[0];
              const metadata = (payload.buildMetadata?.hops || []).find((item) => item.pairId === hop.pairId);
              return {type:'direct',venue:hop.venue,venueLabel:hop.venue==='v3'?'SuiDex V3':'SuiDex V2',executionKind:hop.venue==='v3'?'suidex-v3-direct':'suidex-v2-direct',pairId:hop.pairId,tokenIn,tokenOut,amountIn:String(hop.amountIn || route.totalAmountIn),amountOut:String(hop.amountOut || route.totalAmountOut),minAmountOut:String(metadata?.minAmountOut || (BigInt(hop.amountOut || route.totalAmountOut)*99n/100n)),priceImpactPercent:Number(route.totalPriceImpact || hop.priceImpact || 0),priceImpactTier:String(route.priceImpactTier || 'unknown'),gasEstimate:String(route.gasEstimate || '0'),feePercent:hop.venue==='v3'?Number(hop.feeRate || 0)/10000:.3,coinAType:hop.coinAType || null,coinBType:hop.coinBType || null};
            });
            const buyRoutes = mapRoutes(buyRaw, SUI, TREE);
            const sellRoutes = mapRoutes(sellRaw, TREE, SUI);
            if (buyRoutes.length < 2 || sellRoutes.length < 2) throw new Error('Live direct SuiDex V2/V3 routes were unavailable.');

            const browser = await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto(`${BASE}/dapp/#swap`, {waitUntil:'networkidle2',timeout:120000});
            const result = await page.evaluate(async ({candidates,buyRoutes,sellRoutes}) => {
              const {SuiGrpcClient} = await import('https://esm.run/@mysten/sui@2.23.1/grpc');
              const module = await import('/dapp/swap-router.js');
              const client = new SuiGrpcClient({network:'mainnet',baseUrl:'https://fullnode.mainnet.sui.io:443'});
              let owner = null;
              for (const candidate of candidates) {
                const {balance} = await client.core.getBalance({owner:candidate.owner,coinType:'0x2::sui::SUI'});
                if (BigInt(balance.balance || '0') >= 2_000_000_000n) { owner = candidate.owner; break; }
              }
              if (!owner) throw new Error('No public candidate had enough SUI for dry-run verification.');
              const zero = '0x' + '0'.repeat(64);
              const zeroBalance = await client.core.getBalance({owner:zero,coinType:'0x2::sui::SUI'});
              const dryRuns=[];
              for (const [direction,routes,amountIn] of [['buy',buyRoutes,1000000000n],['sell',sellRoutes,100000000000n]]) {
                for (const route of routes) {
                  try {
                    const tx = await module.buildTransaction(owner,route,amountIn);
                    const bytes = await tx.build({client});
                    const simulation = await client.core.simulateTransaction({transaction:bytes,include:{effects:true,balanceChanges:true}});
                    const transaction = simulation.$kind === 'Transaction' ? simulation.Transaction : simulation.FailedTransaction;
                    dryRuns.push({direction,venue:route.venue,status:simulation.$kind,effectsSuccess:transaction?.effects?.status?.success ?? null,error:simulation.FailedTransaction?.status?.error?.message || transaction?.effects?.status?.error?.message || transaction?.effects?.status?.error || null});
                  } catch (error) {
                    dryRuns.push({direction,venue:route.venue,status:'builder-error',effectsSuccess:false,error:error?.message || String(error)});
                  }
                }
              }
              return {owner,zeroBalance:String(zeroBalance.balance.balance),dryRuns};
            }, {candidates,buyRoutes,sellRoutes});
            if (errors.length) throw new Error(`Browser errors: ${JSON.stringify(errors)}`);
            if (result.dryRuns.length !== 4 || result.dryRuns.some((run) => run.status !== 'Transaction' || run.effectsSuccess !== true)) throw new Error(`gRPC dry runs failed: ${JSON.stringify(result)}`);
            await browser.close();
            console.log(JSON.stringify({classification:'TREE_SUI_GRPC_MIGRATION_VERIFIED',owner:`${result.owner.slice(0,8)}…${result.owner.slice(-6)}`,zeroBalance:result.zeroBalance,dryRuns:result.dryRuns},null,2));
          })().catch((error)=>{console.error(error);process.exit(1)});
          NODE
          git checkout -- package.json package-lock.json 2>/dev/null || true

      - name: Commit and push the gRPC migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Migrate TREE swaps to Sui gRPC"
          git push origin HEAD:feature/tree-aggregated-swap-v1