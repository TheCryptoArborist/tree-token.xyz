name: Canopy checkout offline build and cross-language tests
on:
  push:
    branches: [feature/canopy-credits-mainnet-ledger]
    paths: ['services/canopy-credits/**', '.github/workflows/canopy-checkout-offline.yml']
permissions:
  contents: read
jobs:
  checkout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated integrity-locked SDK
        working-directory: services/canopy-credits/reader
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Quote, codec, offline builder and regression checks
        run: node --test --test-reporter=spec services/canopy-credits/reader/checkout/tests/*.test.mjs services/canopy-credits/tests/*reader*.test.mjs services/canopy-credits/tests/payment.test.mjs services/canopy-credits/reader/transport.test.mjs
      - name: Generate disposable test vectors with independent BCS/signature cross-check
        run: node services/canopy-credits/reader/checkout/tests/generate-move-vectors.mjs
      - name: Install checksum-pinned official mainnet CLI
        env:
          CLI_SHA256: 547b3091e975b8a6b4078473a3868d86e985156b6715a8c4afb7fd7313a36abf
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 300 https://github.com/MystenLabs/sui/releases/download/mainnet-v1.79.1/sui-mainnet-v1.79.1-ubuntu-x86_64.tgz -o "$RUNNER_TEMP/sui.tgz"
          echo "$CLI_SHA256  $RUNNER_TEMP/sui.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sui-bin"
          member=$(tar -tzf "$RUNNER_TEMP/sui.tgz" | grep -E '(^|/)sui$' | head -n 1)
          test -n "$member"
          tar -xzf "$RUNNER_TEMP/sui.tgz" -C "$RUNNER_TEMP/sui-bin" "$member"
          bin=$(find "$RUNNER_TEMP/sui-bin" -type f -name sui | head -n 1)
          chmod +x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" --version
      - name: Empty signerless CLI config prevents automatic wallet bootstrap
        run: |
          mkdir -p "$HOME/.sui/sui_config"
          printf '[]\n' > "$HOME/.sui/sui_config/sui.keystore"
          cat > "$HOME/.sui/sui_config/client.yaml" <<EOF
          keystore:
            File: $HOME/.sui/sui_config/sui.keystore
          envs:
            - alias: mainnet
              rpc: https://fullnode.mainnet.sui.io:443
          active_env: mainnet
          active_address: null
          EOF
      - name: Compile production Move package and exclude test-only modules
        run: |
          sui move build --path services/canopy-credits/contract
          modules=services/canopy-credits/contract/build/canopy_checkout/bytecode_modules
          test -f "$modules/checkout.mv"
          test ! -f "$modules/tree.mv"
          test ! -f "$modules/vectors.mv"
          test ! -f "$modules/checkout_tests.mv"
          test "$(cat "$HOME/.sui/sui_config/sui.keystore")" = '[]'
      - name: Execute local Move VM tests (no network transaction or publish)
        run: |
          sui move test --path services/canopy-credits/contract
          test "$(cat "$HOME/.sui/sui_config/sui.keystore")" = '[]'
