name: Verify TREE production rollout

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/verify-tree-production-rollout.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for first complete production exposure and badge snapshots
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://tree-token.xyz'
          for attempt in $(seq 1 150); do
            curl --silent --show-error --location --max-time 60 "$BASE/api/tree-exposure?production_verification=$attempt" -o /tmp/exposure.json
            exposure_status=$(node -e "const p=require('/tmp/exposure.json');process.stdout.write(String(p.status||''))")
            exposure_refresh=$(node -e "const p=require('/tmp/exposure.json');process.stdout.write(String(p.refreshState||''))")
            exposure_count=$(node -e "const p=require('/tmp/exposure.json');process.stdout.write(String(p.displayedCount||0))")
            curl --silent --show-error --location --max-time 60 "$BASE/api/tree-badges?production_verification=$attempt" -o /tmp/badges.json
            badge_status=$(node -e "const p=require('/tmp/badges.json');process.stdout.write(String(p.status||''))")
            badge_refresh=$(node -e "const p=require('/tmp/badges.json');process.stdout.write(String(p.refreshState||''))")
            badge_count=$(node -e "const p=require('/tmp/badges.json');process.stdout.write(String(p.displayedCount||0))")
            echo "attempt=$attempt exposure=$exposure_status/$exposure_refresh/$exposure_count badges=$badge_status/$badge_refresh/$badge_count"
            if [[ ( "$exposure_status" == 'ok' || "$exposure_status" == 'stale' ) && "$exposure_refresh" == 'complete' && "$exposure_count" == '50' \
              && ( "$badge_status" == 'ok' || "$badge_status" == 'stale' ) && "$badge_refresh" == 'complete' && "$badge_count" == '50' ]]; then
              break
            fi
            [[ "$attempt" != '150' ]] || { echo 'Production snapshots did not complete within the verification window.' >&2; cat /tmp/exposure.json >&2; cat /tmp/badges.json >&2; exit 1; }
            sleep 10
          done

      - name: Validate production snapshot integrity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const exposure = require('/tmp/exposure.json');
          const badges = require('/tmp/badges.json');
          const failures = [];
          const check = (condition, message) => { if (!condition) failures.push(message); };
          check(['ok','stale'].includes(exposure.status), 'exposure status');
          check(exposure.refreshState === 'complete', 'exposure refresh state');
          check(exposure.provider === 'tree-exposure-snapshot', 'exposure provider');
          check(exposure.methodologyVersion === 'verified-tree-exposure-v1', 'exposure methodology');
          check(exposure.coinSymbol === 'TREE' && exposure.coinDecimals === 6, 'TREE metadata');
          check(exposure.totalSupplyRaw === '1000000000000000', 'TREE total supply');
          for (const key of ['directTreeComplete','suiDexV2Complete','suiDexV3Complete','turbosComplete','totalExposureComplete']) {
            check(exposure.coverage?.[key] === true, key);
          }
          check(Array.isArray(exposure.entries) && exposure.entries.length === 50, 'exposure entry count');
          check(['ok','stale'].includes(badges.status), 'badge status');
          check(badges.refreshState === 'complete', 'badge refresh state');
          check(badges.provider === 'tree-badge-snapshot', 'badge provider');
          check(badges.exposureSnapshotGeneratedAt === exposure.snapshotGeneratedAt, 'exposure-to-badge snapshot alignment');
          check(Array.isArray(badges.entries) && badges.entries.length === 50, 'badge entry count');

          const badgeByWallet = new Map(badges.entries.map((entry) => [entry.wallet.toLowerCase(), entry]));
          const seen = new Set();
          let total = 0n, liquidTotal = 0n, lpTotal = 0n;
          let lpProvider = 0, lpMaxi = 0, diamondHands = 0, paperHands = 0, accumulator = 0, burned = 0;
          let previous = null;
          for (let index = 0; index < exposure.entries.length; index += 1) {
            const entry = exposure.entries[index];
            const wallet = entry.wallet.toLowerCase();
            const behavior = badgeByWallet.get(wallet);
            check(/^0x[0-9a-f]{64}$/.test(wallet), `wallet ${index + 1}`);
            check(!seen.has(wallet), `duplicate wallet ${index + 1}`);
            seen.add(wallet);
            check(entry.rank === index + 1, `rank ${index + 1}`);
            check(Boolean(behavior) && behavior.rank === entry.rank, `behavior rank ${index + 1}`);
            const liquid = BigInt(entry.liquidTreeRaw);
            const lp = BigInt(entry.lpTreeRaw);
            const exposureRaw = BigInt(entry.totalExposureRaw);
            const v2 = BigInt(entry.lpBreakdown.suiDexV2Raw);
            const v3 = BigInt(entry.lpBreakdown.suiDexV3Raw);
            const turbos = BigInt(entry.lpBreakdown.turbosRaw);
            check(exposureRaw === liquid + lp, `Liquid + LP identity ${index + 1}`);
            check(lp === v2 + v3 + turbos, `LP venue identity ${index + 1}`);
            if (previous) {
              const ordered = exposureRaw < previous.exposureRaw
                || (exposureRaw === previous.exposureRaw && liquid < previous.liquid)
                || (exposureRaw === previous.exposureRaw && liquid === previous.liquid && wallet.localeCompare(previous.wallet) >= 0);
              check(ordered, `deterministic order ${index + 1}`);
            }
            previous = { exposureRaw, liquid, wallet };
            const combined = new Set([...(entry.badges || []), ...(behavior?.badges || [])]);
            check(combined.has('lp-provider') === (lp > 0n), `LP Provider ${index + 1}`);
            check(combined.has('lp-maxi') === (lp > liquid && lp > 0n), `LP Maxi ${index + 1}`);
            check(!(combined.has('diamond-hands') && combined.has('paper-hands')), `Diamond/Paper exclusivity ${index + 1}`);
            total += exposureRaw; liquidTotal += liquid; lpTotal += lp;
            if (combined.has('lp-provider')) lpProvider++;
            if (combined.has('lp-maxi')) lpMaxi++;
            if (combined.has('diamond-hands')) diamondHands++;
            if (combined.has('paper-hands')) paperHands++;
            if (combined.has('accumulator')) accumulator++;
            if (combined.has('burned')) burned++;
          }
          check(total === liquidTotal + lpTotal, 'Top-50 aggregate identity');
          check(exposure.summary?.top50TotalRaw === total.toString(), 'Top-50 total summary');
          check(exposure.summary?.top50LiquidRaw === liquidTotal.toString(), 'Top-50 liquid summary');
          check(exposure.summary?.top50LpRaw === lpTotal.toString(), 'Top-50 LP summary');
          check(exposure.summary?.rank50CutoffRaw === exposure.entries[49].totalExposureRaw, 'rank-50 cutoff');
          check(exposure.summary?.badgeCounts?.lpProvider === lpProvider, 'LP Provider summary');
          check(exposure.summary?.badgeCounts?.lpMaxi === lpMaxi, 'LP Maxi summary');
          check(badges.summary?.diamondHands === diamondHands, 'Diamond Hands summary');
          check(badges.summary?.paperHands === paperHands, 'Paper Hands summary');
          check(badges.summary?.accumulator === accumulator, 'Accumulator summary');
          check(badges.summary?.burned === burned, 'Burned summary');
          if (failures.length) { console.error(JSON.stringify({ failures }, null, 2)); process.exit(1); }
          console.log(JSON.stringify({
            classification: 'PRODUCTION_SNAPSHOTS_VALID',
            exposureSnapshotGeneratedAt: exposure.snapshotGeneratedAt,
            badgeSnapshotGeneratedAt: badges.snapshotGeneratedAt,
            eligibleOwnerCount: exposure.eligibleOwnerCount,
            displayedCount: exposure.entries.length,
            top50TotalRaw: total.toString(),
            top50LiquidRaw: liquidTotal.toString(),
            top50LpRaw: lpTotal.toString(),
            rank50CutoffRaw: exposure.entries[49].totalExposureRaw,
            badgeCounts: { lpProvider, lpMaxi, diamondHands, paperHands, accumulator, burned },
            activity: badges.source?.activity,
            burns: badges.source?.burns,
          }, null, 2));
          NODE

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://tree-token.xyz/' \
            'https://tree-token.xyz/dapp/' \
            'https://tree-token.xyz/api/tree-dashboard' \
            'https://tree-token.xyz/api/tree-exposure' \
            'https://tree-token.xyz/api/tree-badges'; do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 60 "$url")
            echo "$code $url"
            [[ "$code" == '200' ]]
          done

      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Validate published Command Center at desktop and mobile widths
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            const results = [];
            for (const viewport of [{width:1440,height:1000},{width:1024,height:900},{width:768,height:900},{width:390,height:844},{width:360,height:800}]) {
              const page = await browser.newPage();
              await page.setViewport(viewport);
              const errors = [];
              page.on('console', (message) => { if (message.type() === 'error') errors.push(message.text()); });
              page.on('pageerror', (error) => errors.push(error.message));
              await page.goto('https://tree-token.xyz/dapp/?production_qa=1#leaderboard', { waitUntil: 'networkidle2', timeout: 120000 });
              await page.waitForFunction(() => document.querySelectorAll('.leader-card').length === 50, { timeout: 120000 });
              await page.waitForFunction(() => [...document.querySelectorAll('.leader-badge')].some((node) => node.textContent.includes('Diamond Hands')), { timeout: 120000 });
              const metrics = await page.evaluate(() => {
                const board = document.querySelector('#leaderboard');
                const personal = board?.querySelector('.rank-command-card');
                const top50 = board?.querySelector('.top-board-heading');
                const tiers = board?.querySelector('#tier-guide');
                const methodology = board?.querySelector('.ranking-methodology');
                const follows = (first, second) => Boolean(first && second && (first.compareDocumentPosition(second) & Node.DOCUMENT_POSITION_FOLLOWING));
                const unexpectedOverflow = [...document.querySelectorAll('body *')].filter((element) => {
                  if (element.closest('.market-ribbon,.app-nav,.table-wrap')) return false;
                  const style = getComputedStyle(element);
                  if (style.position === 'fixed' || style.position === 'sticky' || style.display === 'none' || style.visibility === 'hidden') return false;
                  const rect = element.getBoundingClientRect();
                  return rect.width > 0 && (rect.left < -1 || rect.right > innerWidth + 1);
                }).map((element) => `${element.tagName}.${String(element.className || '')}`).slice(0,10);
                const labels = [...new Set([...document.querySelectorAll('.leader-badge')].map((node) => node.textContent.trim()))];
                const canvas = document.querySelector('#profileCanvas');
                return {
                  cardCount: document.querySelectorAll('.leader-card').length,
                  exposureCardCount: document.querySelectorAll('.leader-card.exposure-card').length,
                  labels,
                  state: document.querySelector('#leaderboardState')?.textContent?.trim(),
                  personalLabel: personal?.querySelector('.rank-kicker')?.textContent?.trim(),
                  top50Heading: top50?.querySelector('h3')?.textContent?.trim(),
                  orderValid: follows(personal, top50) && follows(top50, tiers) && follows(tiers, methodology),
                  tiersClosed: tiers ? !tiers.open : false,
                  methodologyClosed: methodology ? !methodology.open : false,
                  documentWidth: document.documentElement.scrollWidth,
                  bodyWidth: Math.round(document.body.getBoundingClientRect().width),
                  viewportWidth: innerWidth,
                  unexpectedOverflow,
                  canvasSize: canvas ? [canvas.width, canvas.height] : null,
                };
              });
              const failures = [];
              if (metrics.cardCount !== 50 || metrics.exposureCardCount !== 50) failures.push('leaderboard card count');
              for (const label of ['LP Provider','LP Maxi','Diamond Hands','Burned']) if (!metrics.labels.some((value) => value.includes(label))) failures.push(`missing ${label}`);
              if (!['Current Exposure Snapshot','Last Exposure Snapshot'].includes(metrics.state)) failures.push('leaderboard state');
              if (metrics.personalLabel !== 'YOUR CANOPY POSITION' || metrics.top50Heading !== 'Top 50 Canopy Leaders') failures.push('Canopy Board labels');
              if (!metrics.orderValid || !metrics.tiersClosed || !metrics.methodologyClosed) failures.push('Canopy Board hierarchy');
              if (metrics.documentWidth > metrics.viewportWidth + 1 || metrics.bodyWidth > metrics.viewportWidth + 1 || metrics.unexpectedOverflow.length) failures.push('horizontal overflow');
              if (JSON.stringify(metrics.canvasSize) !== JSON.stringify([1024,1024])) failures.push('Profile Studio canvas');
              if (errors.length) failures.push(`console errors: ${errors.join(' | ')}`);
              if (failures.length) throw new Error(JSON.stringify({ viewport, failures, metrics }, null, 2));
              results.push({ viewport, metrics });
              await page.close();
            }
            await browser.close();
            console.log(JSON.stringify({ classification: 'PRODUCTION_BROWSER_QA_VALID', results }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
