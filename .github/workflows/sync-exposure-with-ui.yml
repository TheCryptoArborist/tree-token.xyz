name: Sync exposure branch with Command Center UI V2

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/sync-exposure-with-ui.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0
      - name: Merge the latest reviewed UI branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git fetch origin feature/command-center-ui-v2
          git merge --no-edit origin/feature/command-center-ui-v2
          rm -f .github/workflows/sync-exposure-with-ui.yml
          git add .github/workflows/sync-exposure-with-ui.yml
          git commit -m "Remove temporary exposure branch synchronizer"
          git push origin HEAD:feature/leaderboard-exposure-v1
