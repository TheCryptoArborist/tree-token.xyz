name: Research public SuiDex swap routing

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/research-suidex-swap-routing.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Inspect public SuiDex swap bundles and network
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const PATTERNS = /(7k|cetus|find_routes|router_v3|quote|aggregat|suidex|swap|api[-.]sui|route)/i;
          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            const network = [];
            page.on('request', (request) => {
              const type = request.resourceType();
              const url = request.url();
              if (['xhr','fetch'].includes(type) || PATTERNS.test(url)) network.push({ phase: 'request', type, method: request.method(), url, postData: request.postData()?.slice(0, 1200) || null });
            });
            page.on('response', async (response) => {
              const request = response.request();
              const type = request.resourceType();
              const url = response.url();
              if (!(['xhr','fetch'].includes(type) || PATTERNS.test(url))) return;
              let body = null;
              const contentType = response.headers()['content-type'] || '';
              if (/json|text|javascript/.test(contentType)) {
                try { body = (await response.text()).slice(0, 2500); } catch {}
              }
              network.push({ phase: 'response', type, status: response.status(), url, contentType, body });
            });
            await page.goto('https://dex.suidex.org/swap', { waitUntil: 'networkidle2', timeout: 120000 });
            await new Promise((resolve) => setTimeout(resolve, 2500));
            const pageInfo = await page.evaluate(() => ({
              title: document.title,
              scripts: [...document.scripts].map((script) => script.src).filter(Boolean),
              inputs: [...document.querySelectorAll('input')].map((input) => ({ type: input.type, placeholder: input.placeholder, value: input.value, aria: input.getAttribute('aria-label') })),
              buttons: [...document.querySelectorAll('button')].map((button) => button.textContent.trim()).filter(Boolean).slice(0, 80),
              links: [...document.querySelectorAll('a')].map((a) => ({ text: a.textContent.trim(), href: a.href })).filter((a) => a.href),
            }));
            const bundleMatches = [];
            for (const src of pageInfo.scripts) {
              try {
                const response = await fetch(src);
                const text = await response.text();
                const lines = text.split(/\n/);
                const matches = [];
                const regexes = [
                  /https?:[^"'`\\\s)]+/g,
                  /[^"'`]{0,140}(?:7k|cetus|find_routes|router_v3|aggregat|quote|suidex|swap)[^"'`]{0,240}/ig,
                ];
                for (const regex of regexes) {
                  for (const match of text.matchAll(regex)) {
                    const value = match[0].slice(0, 500);
                    if (PATTERNS.test(value) && !matches.includes(value)) matches.push(value);
                    if (matches.length >= 120) break;
                  }
                  if (matches.length >= 120) break;
                }
                if (matches.length) bundleMatches.push({ src, size: text.length, matches });
              } catch (error) {
                bundleMatches.push({ src, error: error.message });
              }
            }
            console.log(JSON.stringify({ classification: 'SUIDEX_PUBLIC_ROUTING_RESEARCH', pageInfo, network, bundleMatches }, null, 2));
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE