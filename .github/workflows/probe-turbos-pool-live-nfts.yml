name: Verify live Turbos TREE NFTs from pool index

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/probe-turbos-pool-live-nfts.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Resolve pool-position keys to current position NFTs
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/probe-turbos-pool-live-nfts.ts <<'TS'
          import { ChannelCredentials } from '@grpc/grpc-js';
          import { GrpcTransport } from '@protobuf-ts/grpc-transport';
          import { SuiGrpcClient } from '@mysten/sui/grpc';

          const POOL_ID = '0xaa133ce1f8fd55d85b6fc87c1b3054cb717d83be477ef3635c661c21fbdfa0ee';
          const POSITION_VALUE_TYPE = '0x91bfbc386a41afcfd9b2533058d7e915a1d3829089cc268ff4333d54d6339ca1::pool::Position';
          const NFT_TYPE = '0x91bfbc386a41afcfd9b2533058d7e915a1d3829089cc268ff4333d54d6339ca1::position_nft::TurbosPositionNFT';
          const client = new SuiGrpcClient({
            network: 'mainnet',
            transport: new GrpcTransport({
              host: 'fullnode.mainnet.sui.io:443',
              channelCredentials: ChannelCredentials.createSsl(),
            }),
          });

          const { dynamicFields, cursor, hasNextPage } = await client.core.listDynamicFields({
            parentId: POOL_ID,
            limit: 1000,
          });
          if (cursor || hasNextPage) throw new Error('Pool dynamic-field listing did not reach its natural end in one page.');
          const positionFieldIds = dynamicFields
            .filter((field: any) => field.valueType === POSITION_VALUE_TYPE)
            .map((field: any) => field.fieldId);

          const fieldObjects: any[] = [];
          for (let index = 0; index < positionFieldIds.length; index += 50) {
            const { objects } = await client.core.getObjects({
              objectIds: positionFieldIds.slice(index, index + 50),
              include: { json: true },
            });
            fieldObjects.push(...objects);
          }
          const malformedFieldObjects: string[] = [];
          const nftIds: string[] = [];
          for (const object of fieldObjects) {
            if (object instanceof Error) {
              malformedFieldObjects.push(object.message);
              continue;
            }
            const name = object.json?.name?.name;
            const match = typeof name === 'string' ? name.match(/^(0x[0-9a-f]{64})-/i) : null;
            if (!match) {
              malformedFieldObjects.push(`field:${object.objectId}:name:${String(name)}`);
              continue;
            }
            nftIds.push(match[1].toLowerCase());
          }

          const uniqueNftIds = [...new Set(nftIds)];
          const live: any[] = [];
          const missing: any[] = [];
          for (let index = 0; index < uniqueNftIds.length; index += 50) {
            const ids = uniqueNftIds.slice(index, index + 50);
            const { objects } = await client.core.getObjects({
              objectIds: ids,
              include: { json: true },
            });
            objects.forEach((object: any, offset: number) => {
              const requestedId = ids[offset];
              if (object instanceof Error) {
                missing.push({ nftId: requestedId, error: object.message });
                return;
              }
              live.push({
                nftId: object.objectId,
                type: object.type,
                owner: object.owner,
                poolId: object.json?.pool_id || null,
                positionId: object.json?.position_id || null,
                coinTypeA: object.json?.coin_type_a || null,
                coinTypeB: object.json?.coin_type_b || null,
                feeType: object.json?.fee_type || null,
                typeVerified: object.type === NFT_TYPE,
              });
            });
          }

          console.log('TURBOS_POOL_LIVE_NFTS=' + JSON.stringify({
            poolId: POOL_ID,
            dynamicFieldCount: dynamicFields.length,
            positionFieldCount: positionFieldIds.length,
            fieldObjectCount: fieldObjects.length,
            malformedFieldObjects,
            nftReferenceCount: nftIds.length,
            uniqueNftReferenceCount: uniqueNftIds.length,
            liveCount: live.length,
            missingCount: missing.length,
            live,
            missingSample: missing.slice(0, 10),
          }));
          TS
          npx --yes tsx scripts/probe-turbos-pool-live-nfts.ts

      - name: Remove temporary probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-turbos-pool-live-nfts.yml scripts/probe-turbos-pool-live-nfts.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete live Turbos TREE NFT index verification"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
