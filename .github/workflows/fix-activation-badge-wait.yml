name: Fix TREE production badge bootstrap wait helper

on:
  push:
    branches:
      - feature/activate-command-center-production
    paths:
      - '.github/workflows/fix-activation-badge-wait.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activate-command-center-production
          fetch-depth: 0

      - name: Correct the bootstrap wait variable
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('netlify/lib/tree-badge-background-worker.ts')
          text = path.read_text(encoding='utf-8')
          old = """    const waitForExposure = context === 'deploy-preview' || enabled(getEnv('TREE_BADGE_AUTO_BOOTSTRAP'));
    const waitMs = waitForExposure ? 5 * 60 * 1000 : 0;
    const exposure = await waitForExposure(context, readExposure, sleepImpl, waitMs);"""
          new = """    const shouldWaitForExposure = context === 'deploy-preview' || enabled(getEnv('TREE_BADGE_AUTO_BOOTSTRAP'));
    const waitMs = shouldWaitForExposure ? 5 * 60 * 1000 : 0;
    const exposure = await waitForExposure(context, readExposure, sleepImpl, waitMs);"""
          if old not in text:
              raise SystemExit('Expected badge bootstrap wait block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-activation-badge-wait.yml
          git diff --check

      - name: Validate all safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          grep -q 'const shouldWaitForExposure' netlify/lib/tree-badge-background-worker.ts
          grep -q "const leaderboardUrl = '/api/tree-exposure'" dapp/app.js
          grep -q 'DAPP_SWAP_EXECUTION_ENABLED = false' dapp/app.js
          git diff --check

      - name: Commit and push correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Fix production badge bootstrap wait"
          git push origin HEAD:feature/activate-command-center-production
