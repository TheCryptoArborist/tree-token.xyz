name: Prepare and publish reviewed Arborist Trials pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'production/arcade-challenge-static/**'
      - 'production/arcade-challenge-db-readiness.json'
      - 'scripts/arcade-challenge*.mjs'
      - 'styles/arcade-challenge.css'
      - 'scripts/arcade-organization.js'
      - 'netlify/challenge-functions/**'
      - 'scripts/arcade-campaigns/**'
      - 'vendor/arcade-trials-engine/**'
      - 'scripts/release-arcade-challenge.mjs'
      - 'tests/arcade-challenge-release.test.mjs'
      - 'docs/arcade-challenge-release.md'
      - '.github/workflows/publish-arcade-challenge.yml'
  push:
    branches:
      - release/arcade-challenge-prepare
      - release/arcade-challenge-publish
      - release/arcade-challenge-audit

permissions:
  contents: read
  actions: read

concurrency:
  group: tree-production-preservation-${{ github.event_name == 'pull_request' && format('challenge-pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install existing test and function packaging locks
        run: |
          npm ci --prefix vendor/arcade-monthly --ignore-scripts --no-audit --no-fund
          npm ci --prefix vendor/arcade-events --ignore-scripts --no-audit --no-fund
      - name: Verify additive preservation guards
        run: |
          node --test tests/arcade-challenge-release.test.mjs tests/arcade-cutoff-release.test.mjs tests/arcade-organization.test.mjs tests/arcade-preview-readonly.test.mjs
          node --check scripts/release-arcade-challenge.mjs
          node --check scripts/arcade-organization.js
          node scripts/arcade-campaigns/package-pilot.mjs
          git diff --check

  prepare:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/release/arcade-challenge-prepare' &&
      contains(github.event.head_commit.message, '[prepare arcade challenge]') &&
      contains(github.event.head_commit.message, '[skip netlify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore the existing isolated function build tools
        run: npm ci --prefix vendor/arcade-events --ignore-scripts --no-audit --no-fund
      - name: Capture current production and create the review candidate
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          ARCADE_CHALLENGE_EXPECTED_DEPLOY: '6afe22a623fe04c7a4a9d0c0'
          REVIEWED_SHA: ${{ github.sha }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'The existing Netlify release connection is unavailable.'; exit 1; }
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          node scripts/release-arcade-challenge.mjs capture
          node scripts/arcade-campaigns/package-pilot.mjs
          cp .netlify/arcade-challenge-pilot-functions/manifest.json .netlify/arcade-challenge/pilot-manifest.json
          cp .netlify/arcade-challenge-pilot-functions/arcade-challenge-pilot.zip .netlify/arcade-challenge/pilot-function.zip
          node scripts/release-arcade-challenge.mjs plan --source-commit "$REVIEWED_SHA"
          node scripts/release-arcade-challenge.mjs candidate --source-commit "$REVIEWED_SHA"
          node scripts/release-arcade-challenge.mjs verify --source-commit "$REVIEWED_SHA"
      - name: Install isolated candidate browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/arcade-pilot-browser" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/arcade-pilot-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Review the exact candidate at desktop and phone widths
        env:
          ARCADE_PILOT_BROWSER_MODULE: ${{ runner.temp }}/arcade-pilot-browser/node_modules/playwright/index.mjs
          ARCADE_PILOT_CANDIDATE_OUTPUT: ${{ runner.temp }}/arcade-challenge-candidate-review
        run: node scripts/check-arcade-challenge-candidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-challenge-candidate-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/arcade-challenge-candidate-review
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        id: candidate_artifact
        if: always()
        with:
          name: arcade-challenge-candidate-${{ github.run_id }}
          path: .netlify/arcade-challenge/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Record the concrete review target
        if: always()
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate_artifact.outputs.artifact-digest }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const filename='.netlify/arcade-challenge/report.json';
          if (!fs.existsSync(filename)) process.exit(0);
          const r=JSON.parse(fs.readFileSync(filename));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Arcade candidate — production unchanged\n\nReview: ${r.url}\n\nSource: ${r.sourceCommit}\nTree: ${r.sourceTree}\nPlan SHA256: ${r.planSha256}\nCandidate: ${r.candidateId}\nBaseline: ${r.baselineId}\nRun: ${process.env.GITHUB_RUN_ID}\nArtifact: ${process.env.CANDIDATE_ARTIFACT_ID}\nArtifact SHA256: ${process.env.CANDIDATE_ARTIFACT_SHA256}\n\nPreserved ${r.preservedStaticFiles} existing static paths, ${r.preservedBackendRecords} complete backend records and ${r.schedulesPreserved} schedules.\n\nThe workflow must conclude successfully. Review the pilot and Campaigns link at phone and desktop widths before creating the separate publication control commit.\n`);
          JS

  publish_or_audit:
    needs: verify
    if: >-
      github.event_name == 'push' && contains(github.event.head_commit.message, '[skip netlify]') &&
      ((github.ref == 'refs/heads/release/arcade-challenge-publish' && contains(github.event.head_commit.message, '[publish arcade challenge]')) ||
       (github.ref == 'refs/heads/release/arcade-challenge-audit' && contains(github.event.head_commit.message, '[audit arcade challenge]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the narrow release control commit
        id: control
        env:
          CONTROL_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {CONTROL_FILE,REVIEW_FILE,validatePublicationControl,validateControlCommit} from './scripts/release-arcade-challenge.mjs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const control=JSON.parse(fs.readFileSync(CONTROL_FILE));
          const mode=process.env.CONTROL_BRANCH==='release/arcade-challenge-publish'?'publish':'audit';
          validatePublicationControl(control,mode+'-arcade-challenge');
          validateControlCommit(control, {
            mode,
            parents:git('rev-list','--parents','-n','1','HEAD').split(/\s+/).slice(1),
            mainTree:git('rev-parse',control.mainCommit+'^{tree}'),
            changedFiles:git('diff','--name-only',control.mainCommit,'HEAD').split('\n'),
            message:git('log','-1','--format=%B'),
          });
          fs.copyFileSync(CONTROL_FILE,path.join(process.env.RUNNER_TEMP,'arcade-challenge-control.json'));
          fs.copyFileSync(REVIEW_FILE,path.join(process.env.RUNNER_TEMP,'arcade-challenge-browser-review.json'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`source_commit=${control.sourceCommit}\nmode=${mode}\n`);
          JS
      - name: Check out the exact candidate source, independent of the control commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original run, immutable artifact identity and archive SHA256
        uses: actions/github-script@v7
        env:
          GH_READ_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
            const c=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'arcade-challenge-control.json')));
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(c.candidateRunId)})).data;
            assert.equal(run.status,'completed'); assert.equal(run.conclusion,'success');
            assert.equal(run.event,'push'); assert.equal(run.head_branch,'release/arcade-challenge-prepare');
            assert.equal(run.head_sha,c.sourceCommit); assert.equal(run.path,'.github/workflows/publish-arcade-challenge.yml');
            assert.equal(run.repository.full_name,context.repo.owner+'/'+context.repo.repo);
            const artifact=(await github.rest.actions.getArtifact({...context.repo,artifact_id:Number(c.candidateArtifactId)})).data;
            assert.equal(artifact.name,'arcade-challenge-candidate-'+c.candidateRunId);
            assert.equal(artifact.workflow_run.id,Number(c.candidateRunId)); assert.equal(artifact.workflow_run.head_sha,c.sourceCommit);
            assert.equal(artifact.expired,false); assert.equal(artifact.digest,'sha256:'+c.candidateArtifactSHA256);
            const request=await fetch(`https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${c.candidateArtifactId}/zip`,
              {redirect:'manual',headers:{Authorization:'Bearer '+process.env.GH_READ_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            assert.equal(request.status,302,'Artifact download redirect unavailable.');
            const location=new URL(request.headers.get('location'));
            assert(location.protocol==='https:' && (location.hostname.endsWith('.blob.core.windows.net') || location.hostname.endsWith('.githubusercontent.com') || location.hostname.endsWith('.actions.githubusercontent.com')),
              'Unexpected artifact download host.');
            const response=await fetch(location,{redirect:'error'}); assert.equal(response.status,200);
            const bytes=Buffer.from(await response.arrayBuffer()); assert(bytes.length<5000000,'Unexpected artifact size.');
            assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),c.candidateArtifactSHA256,'Artifact archive digest mismatch.');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'arcade-challenge-candidate.zip'),bytes);
      - name: Extract only the bounded release records and isolated pilot package
        run: |
          python3 - <<'PY'
          import os, pathlib, stat, zipfile
          expected={'baseline.json','baseline.json.sha256','baseline-play.html','plan.json','plan.json.sha256','candidate.json','candidate.json.sha256','report.json','report.json.sha256','pilot-manifest.json','pilot-function.zip'}
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'arcade-challenge-candidate.zip') as archive:
              files=[entry for entry in archive.infolist() if not entry.is_dir()]
              assert len(files)==len(expected) and {entry.filename for entry in files}==expected, 'Unexpected artifact contents'
              assert all(not stat.S_ISLNK(entry.external_attr>>16) and entry.file_size<3000000 for entry in files), 'Unsafe artifact entry'
              assert sum(entry.file_size for entry in files)<10000000, 'Artifact expands beyond the release scope'
              for entry in files:
                  target=pathlib.Path('.netlify/arcade-challenge')/entry.filename
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.read(entry))
          PY
      - name: Bind review and control to the downloaded candidate plan
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {fingerprint} from './scripts/release-preserved-production.mjs';
          import {validateBrowserReview} from './scripts/release-arcade-challenge.mjs';
          const read=p=>JSON.parse(fs.readFileSync(p));
          const c=read(path.join(process.env.RUNNER_TEMP,'arcade-challenge-control.json'));
          const plan=read('.netlify/arcade-challenge/plan.json'),state=read('.netlify/arcade-challenge/candidate.json');
          assert.equal(fingerprint(plan),c.planSha256); assert.equal(plan.sourceCommit,c.sourceCommit); assert.equal(plan.sourceTree,c.sourceTree);
          assert.equal(plan.baselineId,c.expectedDeploy); assert.equal(state.id,c.candidateId); assert(state.technicalVerifiedAt,'Candidate did not finish verification.');
          validateBrowserReview(read(path.join(process.env.RUNNER_TEMP,'arcade-challenge-browser-review.json')),plan,state);
          JS
      - name: Publish the reviewed candidate, or perform the explicitly read-only audit
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          RELEASE_MODE: ${{ steps.control.outputs.mode }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {main} from './scripts/release-arcade-challenge.mjs';
          const c=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'arcade-challenge-control.json')));
          const common=['--source-commit',c.sourceCommit,'--expected-deploy',c.expectedDeploy,'--expected-candidate',c.candidateId];
          const review=path.join(process.env.RUNNER_TEMP,'arcade-challenge-browser-review.json');
          if(process.env.RELEASE_MODE==='publish'){
            await main(['verify',...common,'--browser-report',review]);
            await main(['publish',...common,'--main-commit',c.mainCommit]);
          }else{
            await main(['audit',...common,'--browser-report',review]);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-challenge-${{ steps.control.outputs.mode }}-${{ github.run_id }}
          path: .netlify/arcade-challenge/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Record the observed outcome
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const filename='.netlify/arcade-challenge/report.json';
          if (!fs.existsSync(filename)) process.exit(0);
          const r=JSON.parse(fs.readFileSync(filename));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Arcade release evidence\n\nLast completed phase: ${r.mode}\nCandidate: ${r.candidateId}\nSource: ${r.sourceCommit}\nProduction changed in this phase: ${r.productionChanged}\nPublished candidate verified: ${r.publishedCandidateVerified}\n\nCanonical: https://tree-token.xyz/play/challenge/\n\nRead the job conclusion. If a lock request succeeded before a timeout, use the exact candidate-bound read-only audit; never retry publication blindly.\n`);
          JS
