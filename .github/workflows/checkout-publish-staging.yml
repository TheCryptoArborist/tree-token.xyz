name: Build paused mainnet checkout for wallet approval
on:
  push:
    branches: [work/simple-tree-continue]
    paths: ['services/canopy-credits/contract/**', '.github/workflows/checkout-publish-staging.yml', 'scripts/stage-checkout-package.mjs']
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install checksum-pinned mainnet CLI 1.81.1
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 300 https://github.com/MystenLabs/sui/releases/download/mainnet-v1.81.1/sui-mainnet-v1.81.1-ubuntu-x86_64.tgz -o "$RUNNER_TEMP/sui.tgz"
          echo "d921910fdedf5ae2bc3f08a7236c57819a457ce53a8cc60c85f3653c7831b5d4  $RUNNER_TEMP/sui.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sui-bin"
          member=$(tar -tzf "$RUNNER_TEMP/sui.tgz" | grep -E '(^|/)sui$' | head -n 1)
          test -n "$member"
          tar -xzf "$RUNNER_TEMP/sui.tgz" -C "$RUNNER_TEMP/sui-bin" "$member"
          bin=$(find "$RUNNER_TEMP/sui-bin" -type f -name sui | head -n 1)
          chmod +x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" --version
      - name: Set empty signerless mainnet config
        run: |
          mkdir -p "$HOME/.sui/sui_config"
          printf '[]\n' > "$HOME/.sui/sui_config/sui.keystore"
          cat > "$HOME/.sui/sui_config/client.yaml" <<EOF
          keystore:
            File: $HOME/.sui/sui_config/sui.keystore
          envs:
            - alias: mainnet
              rpc: https://fullnode.mainnet.sui.io:443
          active_env: mainnet
          active_address: null
          EOF
      - name: Install locked reader SDK and generate disposable test vectors
        run: |
          npm ci --prefix services/canopy-credits/reader --ignore-scripts --no-audit --no-fund
          node services/canopy-credits/reader/checkout/tests/generate-move-vectors.mjs
      - name: Compile production bytecode
        run: |
          sui move build --path services/canopy-credits/contract --build-env mainnet --dump-bytecode-as-base64 > "$RUNNER_TEMP/checkout-build.json"
          modules=services/canopy-credits/contract/build/canopy_checkout/bytecode_modules
          test -f "$modules/checkout.mv"
          test ! -f "$modules/tree.mv"
          test ! -f "$modules/vectors.mv"
          test ! -f "$modules/checkout_tests.mv"
          test "$(cat "$HOME/.sui/sui_config/sui.keystore")" = '[]'
      - name: Run Move VM tests
        run: |
          sui move test --path services/canopy-credits/contract --build-env mainnet
          test "$(cat "$HOME/.sui/sui_config/sui.keystore")" = '[]'
      - name: Stage public bytecode with provenance
        env:
          CHECKOUT_BUILD_FILE: ${{ runner.temp }}/checkout-build.json
        run: node scripts/stage-checkout-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paused-mainnet-checkout
          path: |
            staged-checkout/checkout-package.json
            services/canopy-credits/contract/Move.lock
          if-no-files-found: error
