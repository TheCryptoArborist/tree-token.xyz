name: Verify TREE swap builders on Sui Mainnet via gRPC

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/verify-tree-swap-grpc-preview.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Verify quotes, UI, and all four direct-route simulations
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const PREVIEW = 'https://deploy-preview-11--tree-token.netlify.app';
          const PRODUCTION = 'https://tree-token.xyz';
          const SUI = '0x2::sui::SUI';
          const TREE = '0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf::tree::TREE';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchRetry(url, options = {}, attempts = 10) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, options);
                if (response.status >= 500 && attempt < attempts) throw new Error(`HTTP ${response.status}`);
                return response;
              } catch (error) {
                lastError = error;
                if (attempt < attempts) await sleep(Math.min(800 * 2 ** (attempt - 1), 7000));
              }
            }
            throw lastError;
          }

          async function jsonRetry(url, options = {}) {
            const response = await fetchRetry(url, options);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`${url} returned non-JSON: ${text.slice(0, 300)}`); }
            return { status: response.status, body };
          }

          function quoteUrl(tokenIn, tokenOut, amountIn) {
            return `${PREVIEW}/api/tree-swap-quote?${new URLSearchParams({ tokenIn, tokenOut, amountIn, slippageBps: '100' })}`;
          }

          (async () => {
            const [buyResult, sellResult, exposureResult] = await Promise.all([
              jsonRetry(quoteUrl(SUI, TREE, '1000000000')),
              jsonRetry(quoteUrl(TREE, SUI, '100000000000')),
              jsonRetry(`${PRODUCTION}/api/tree-exposure`),
            ]);
            const buy = buyResult.body;
            const sell = sellResult.body;
            for (const [name, result] of [['buy', buyResult], ['sell', sellResult]]) {
              if (result.status !== 200 || result.body.status !== 'ok') throw new Error(`${name} quote failed: ${JSON.stringify(result)}`);
              const venues = new Set(result.body.routes?.map((route) => route.venue));
              if (result.body.routes?.length !== 2 || !venues.has('suidex') || !venues.has('v3')) throw new Error(`${name} quote did not contain exactly the allowlisted V2 and V3 TREE routes.`);
            }
            if (buy.decimalsIn !== 9 || buy.decimalsOut !== 6 || sell.decimalsIn !== 6 || sell.decimalsOut !== 9) throw new Error('SUI/TREE decimal metadata is incorrect.');
            const exposure = exposureResult.body;
            if (exposureResult.status !== 200 || !['ok', 'stale'].includes(exposure.status) || !Array.isArray(exposure.entries) || exposure.entries.length !== 50) throw new Error(`Production exposure snapshot unavailable: ${JSON.stringify({http: exposureResult.status, status: exposure.status, entries: exposure.entries?.length})}`);
            const candidates = exposure.entries
              .map((entry) => ({ owner: entry.wallet || entry.address, liquidTreeRaw: String(entry.liquidTreeRaw || entry.directTreeRaw || '0') }))
              .filter((entry) => /^0x[0-9a-f]{64}$/i.test(entry.owner || '') && BigInt(entry.liquidTreeRaw) >= 100000000000n);
            if (!candidates.length) throw new Error('No public dry-run owner candidate had 100,000 liquid TREE.');

            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            const browserErrors = [];
            page.on('console', (message) => {
              const text = message.text();
              const expected = /api\.slush\.app|metadata|Failed to load resource/i.test(text);
              if (message.type() === 'error' && !expected) browserErrors.push(text);
            });
            page.on('pageerror', (error) => browserErrors.push(`pageerror:${error.message}`));
            await page.goto(`${PREVIEW}/dapp/#swap`, { waitUntil: 'networkidle2', timeout: 120000 });
            await page.waitForSelector('#swapAmountIn', { timeout: 120000 });
            await page.type('#swapAmountIn', '1');
            await page.waitForFunction(() => document.querySelectorAll('.swap-route-candidate').length === 2, { timeout: 120000 });
            const ui = await page.evaluate(() => ({
              activePanel: document.body.dataset.activePanel,
              output: document.querySelector('#swapAmountOut')?.value,
              route: document.querySelector('#swapRouteLabel')?.textContent,
              candidates: [...document.querySelectorAll('.swap-route-candidate')].map((node) => node.textContent.trim()),
              minimum: document.querySelector('#swapMinReceived')?.textContent,
              impact: document.querySelector('#swapPriceImpact')?.textContent,
              action: document.querySelector('#buyTree')?.textContent,
              disabled: document.querySelector('#buyTree')?.disabled,
              overflow: document.documentElement.scrollWidth - innerWidth,
            }));
            if (ui.activePanel !== 'swap' || !ui.output || ui.candidates.length !== 2 || !ui.minimum || !ui.impact || ui.action !== 'Connect Wallet' || ui.disabled || ui.overflow > 1) throw new Error(`Published swap UI failed: ${JSON.stringify(ui)}`);

            const verification = await page.evaluate(async ({ candidates, buy, sell, suiType, treeType }) => {
              const { SuiGrpcClient } = await import('https://esm.run/@mysten/sui@2.23.1/grpc');
              const swap = await import('/dapp/swap-router.js');
              const client = new SuiGrpcClient({ network: 'mainnet', baseUrl: 'https://fullnode.mainnet.sui.io:443' });
              let owner = null;
              let ownerBalances = null;
              for (const candidate of candidates) {
                const [sui, tree] = await Promise.all([
                  client.core.getBalance({ owner: candidate.owner, coinType: suiType }),
                  client.core.getBalance({ owner: candidate.owner, coinType: treeType }),
                ]);
                const suiBalance = BigInt(sui.balance.balance || '0');
                const treeBalance = BigInt(tree.balance.balance || '0');
                if (suiBalance >= 2_000_000_000n && treeBalance >= 100_000_000_000n) {
                  owner = candidate.owner;
                  ownerBalances = { sui: suiBalance.toString(), tree: treeBalance.toString() };
                  break;
                }
              }
              if (!owner) throw new Error('No public candidate had enough SUI and TREE for all non-signing simulations.');

              const dryRuns = [];
              for (const [direction, quote] of Object.entries({ buy, sell })) {
                for (const route of quote.routes) {
                  try {
                    const tx = await swap.buildTransaction(owner, route, BigInt(quote.amountIn));
                    const bytes = await tx.build({ client });
                    const simulated = await client.core.simulateTransaction({ transaction: bytes, include: { effects: true, balanceChanges: true } });
                    const transaction = simulated.$kind === 'Transaction' ? simulated.Transaction : null;
                    const failure = simulated.FailedTransaction;
                    dryRuns.push({
                      direction,
                      venue: route.venueLabel,
                      executionKind: route.executionKind,
                      resultKind: simulated.$kind,
                      effectsSuccess: transaction?.effects?.status?.success === true,
                      digest: transaction?.digest || null,
                      balanceChangeCount: transaction?.balanceChanges?.length || 0,
                      error: failure?.status?.error?.message || transaction?.effects?.status?.error?.message || transaction?.effects?.status?.error || null,
                    });
                  } catch (error) {
                    dryRuns.push({ direction, venue: route.venueLabel, executionKind: route.executionKind, resultKind: 'builder-error', effectsSuccess: false, error: error?.message || String(error) });
                  }
                }
              }
              return { owner, ownerBalances, dryRuns };
            }, { candidates, buy, sell, suiType: SUI, treeType: TREE });
            if (browserErrors.length) throw new Error(`Browser errors: ${JSON.stringify(browserErrors)}`);
            if (verification.dryRuns.length !== 4 || verification.dryRuns.some((run) => run.resultKind !== 'Transaction' || run.effectsSuccess !== true)) throw new Error(`Mainnet simulations failed: ${JSON.stringify(verification)}`);

            const mobileResults = [];
            for (const viewport of [{ width: 390, height: 844 }, { width: 360, height: 800 }]) {
              const mobile = await browser.newPage();
              await mobile.setViewport(viewport);
              await mobile.goto(`${PREVIEW}/dapp/#swap`, { waitUntil: 'networkidle2', timeout: 120000 });
              await mobile.type('#swapAmountIn', '1');
              await mobile.waitForFunction(() => document.querySelectorAll('.swap-route-candidate').length === 2, { timeout: 120000 });
              const state = await mobile.evaluate(() => ({ output: document.querySelector('#swapAmountOut')?.value, candidates: document.querySelectorAll('.swap-route-candidate').length, overflow: document.documentElement.scrollWidth - innerWidth }));
              if (!state.output || state.candidates !== 2 || state.overflow > 1) throw new Error(`Mobile swap UI failed: ${JSON.stringify({viewport, state})}`);
              mobileResults.push({ viewport, state });
              await mobile.close();
            }
            await browser.close();

            console.log(JSON.stringify({
              classification: 'TREE_BEST_ROUTE_SWAP_PREVIEW_VERIFIED',
              quotes: {
                buy: { selected: buy.selectedRoute.venueLabel, amountOut: buy.selectedRoute.amountOut, routes: buy.routes.map((route) => ({ venue: route.venueLabel, amountOut: route.amountOut, impact: route.priceImpactPercent })) },
                sell: { selected: sell.selectedRoute.venueLabel, amountOut: sell.selectedRoute.amountOut, routes: sell.routes.map((route) => ({ venue: route.venueLabel, amountOut: route.amountOut, impact: route.priceImpactPercent })) },
              },
              dryRunOwner: `${verification.owner.slice(0, 8)}…${verification.owner.slice(-6)}`,
              ownerBalances: verification.ownerBalances,
              dryRuns: verification.dryRuns,
              ui,
              mobileResults,
            }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Verify public review routes
        shell: bash
        run: |
          set -euo pipefail
          quote='https://deploy-preview-11--tree-token.netlify.app/api/tree-swap-quote?tokenIn=0x2%3A%3Asui%3A%3ASUI&tokenOut=0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf%3A%3Atree%3A%3ATREE&amountIn=1000000000&slippageBps=100'
          for url in 'https://deploy-preview-11--tree-token.netlify.app/' 'https://deploy-preview-11--tree-token.netlify.app/dapp/' "$quote"; do
            code=$(curl --retry 10 --retry-all-errors --retry-delay 1 --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 60 "$url")
            echo "$code $url"
            [[ "$code" == '200' ]]
          done