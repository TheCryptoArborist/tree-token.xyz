                    <p id="swapStatus" class="status" role="status" aria-live="polite">Loading the TREE route verifier…</p>
                    <div class="swap-success" id="swapSuccess" hidden></div>
                    <p class="swap-fallback">Having trouble? <a id="suiDexFallback" href="https://dex.suidex.org/swap?from=SUI&amp;to=Tree" target="_blank" rel="noopener noreferrer">Open SuiDex ↗</a></p>
                  </div>
                </div>
              </section>'''
          pattern = r'<section class="section compact-section" id="swap"[\s\S]*?</section>\s*\n\s*<section class="section utility-route-section" id="limit"'
          replacement = panel + '\n\n<section class="section utility-route-section" id="limit"'
          updated, count = re.subn(pattern, replacement, html, count=1)
          if count != 1:
              raise SystemExit('Could not replace the existing swap panel.')
          if '<link rel="stylesheet" href="swap-router.css">' not in updated:
              updated = updated.replace('<link rel="stylesheet" href="panel-router.css">', '<link rel="stylesheet" href="panel-router.css">\n  <link rel="stylesheet" href="swap-router.css">', 1)
          if '<script type="module" src="swap-router.js"></script>' not in updated:
              updated = updated.replace('  <script type="module" src="app.js"></script>', '  <script type="module" src="app.js"></script>\n  <script type="module" src="swap-router.js"></script>', 1)
          html_path.write_text(updated, encoding='utf-8')

          app_path = Path('dapp/app.js')
          app = app_path.read_text(encoding='utf-8')
          app = re.sub(r'\nfunction updateDisplayedEstimate\(\)[\s\S]*?\nfunction buyTree\(\) \{[\s\S]*?\n\}\n', '\n// Swap quote and execution are isolated in swap-router.js.\n', app, count=1)
          app = app.replace("  const buyButton = document.getElementById('buyTree');\n  buyButton.disabled = !DAPP_SWAP_EXECUTION_ENABLED;\n  buyButton.textContent = DAPP_SWAP_EXECUTION_ENABLED ? 'Submit TREE Purchase' : 'Swap verification in progress';\n", '')
          app = app.replace("  buyButton.addEventListener('click', buyTree);\n", '')
          app = app.replace("  document.getElementById('swapSui').addEventListener('input', updateDisplayedEstimate);\n", '')
          app = app.replace("  loadDisplayedRate();\n", '')
          app = re.sub(r"\n  window\.addEventListener\('tree:wallet-changed', \(event\) => \{[\s\S]*?\n  \}\);\n\n  window\.addEventListener\('load'", "\n  window.addEventListener('tree:wallet-changed', () => { syncWalletButtons(); });\n\n  window.addEventListener('load'", app, count=1)
          if "document.getElementById('swapSui')" in app or 'function loadDisplayedRate' in app or 'function buyTree' in app:
              raise SystemExit('Legacy swap handlers remain in dapp/app.js.')
          app_path.write_text(app, encoding='utf-8')
          PY

