name: Compare TREE routes (read-only, opt-in)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/tree-comparison-session.test.ts tests/tree-split-study.test.ts tests/tree-composition-validation.test.ts
      - run: node --experimental-strip-types scripts/compare-tree-routes.mjs --read-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-route-comparison
          path: artifacts/tree-comparisons/
