name: Apply single-panel TREE Command Center navigation

on:
  push:
    branches:
      - feature/tree-navigation-v2
    paths:
      - '.github/workflows/apply-dapp-tabbed-navigation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-navigation-v2
          fetch-depth: 0

      - name: Convert the Command Center into a single-panel app
        shell: bash
        run: |
          set -euo pipefail
          cat > dapp/panel-router.js <<'JS'
          const PANEL_IDS = [
            'swap',
            'limit',
            'earn',
            'v3',
            'stats',
            'removed',
            'canopy-draw',
            'leaderboard',
            'profile-studio',
            'documents',
          ];

          const PANEL_LABELS = {
            swap: 'Swap',
            limit: 'Limit',
            earn: 'Earn',
            v3: 'V3',
            stats: 'Stats',
            removed: 'Burn',
            'canopy-draw': 'Raffle',
            leaderboard: 'Board',
            'profile-studio': 'Profile Studio',
            documents: 'Documents',
          };

          const panels = new Map(
            PANEL_IDS
              .map((id) => [id, document.getElementById(id)])
              .filter(([, panel]) => panel),
          );
          const nav = document.querySelector('.app-nav');
          const navLinks = [...(nav?.querySelectorAll('a[href^="#"]') || [])];
          let activePanelId = null;

          function resolvePanelId(hash = location.hash) {
            const id = decodeURIComponent(String(hash || '').replace(/^#/, ''));
            if (panels.has(id)) return id;
            const target = id ? document.getElementById(id) : null;
            const containingPanel = target?.closest('section[id]');
            if (containingPanel && panels.has(containingPanel.id)) return containingPanel.id;
            return 'swap';
          }

          function updateNav(panelId) {
            navLinks.forEach((link, index) => {
              const targetId = link.getAttribute('href')?.slice(1);
              const selected = targetId === panelId;
              link.classList.toggle('active', selected);
              link.setAttribute('aria-selected', selected ? 'true' : 'false');
              link.setAttribute('tabindex', selected ? '0' : '-1');
              link.setAttribute('role', 'tab');
              if (!link.id) link.id = `tree-tab-${targetId || index}`;
              if (targetId && panels.has(targetId)) link.setAttribute('aria-controls', targetId);
            });
          }

          function showPanel(panelId, options = {}) {
            const selectedId = panels.has(panelId) ? panelId : 'swap';
            panels.forEach((panel, id) => {
              const selected = id === selectedId;
              panel.hidden = !selected;
              panel.classList.toggle('active-panel', selected);
              panel.setAttribute('aria-hidden', selected ? 'false' : 'true');
              panel.setAttribute('role', 'tabpanel');
              panel.setAttribute('tabindex', '-1');
              const controllingTab = navLinks.find((link) => link.getAttribute('href') === `#${id}`);
              if (controllingTab?.id) panel.setAttribute('aria-labelledby', controllingTab.id);
            });
            activePanelId = selectedId;
            updateNav(selectedId);
            document.body.dataset.activePanel = selectedId;
            document.title = `TREE Command Center | ${PANEL_LABELS[selectedId] || 'TREE'}`;

            if (options.scrollTop !== false) window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
            window.dispatchEvent(new CustomEvent('tree:panel-shown', { detail: { panelId: selectedId } }));
            window.dispatchEvent(new Event('resize'));
            return selectedId;
          }

          function activateFromLocation() {
            const rawId = decodeURIComponent(location.hash.replace(/^#/, ''));
            const panelId = showPanel(resolvePanelId(location.hash), { scrollTop: PANEL_IDS.includes(rawId) || !rawId });
            if (rawId && rawId !== panelId) {
              requestAnimationFrame(() => document.getElementById(rawId)?.scrollIntoView({ block: 'start' }));
            }
          }

          nav?.setAttribute('role', 'tablist');
          nav?.setAttribute('aria-label', 'TREE utility navigation');

          navLinks.forEach((link, index) => {
            link.addEventListener('click', (event) => {
              const panelId = link.getAttribute('href')?.slice(1);
              if (!panelId || !panels.has(panelId)) return;
              event.preventDefault();
              if (location.hash === `#${panelId}`) showPanel(panelId);
              else history.pushState({ panelId }, '', `#${panelId}`);
              showPanel(panelId);
            });
            link.addEventListener('keydown', (event) => {
              if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
              event.preventDefault();
              let nextIndex = index;
              if (event.key === 'ArrowRight') nextIndex = (index + 1) % navLinks.length;
              if (event.key === 'ArrowLeft') nextIndex = (index - 1 + navLinks.length) % navLinks.length;
              if (event.key === 'Home') nextIndex = 0;
              if (event.key === 'End') nextIndex = navLinks.length - 1;
              navLinks[nextIndex]?.focus();
              navLinks[nextIndex]?.click();
            });
          });

          document.addEventListener('click', (event) => {
            const link = event.target.closest('a[href^="#"]');
            if (!link || nav?.contains(link)) return;
            const rawId = link.getAttribute('href')?.slice(1);
            if (!rawId) return;
            const target = document.getElementById(rawId);
            const targetPanel = panels.has(rawId) ? rawId : target?.closest('section[id]')?.id;
            if (!targetPanel || !panels.has(targetPanel) || targetPanel === activePanelId) return;
            event.preventDefault();
            history.pushState({ panelId: targetPanel }, '', `#${rawId}`);
            showPanel(targetPanel);
            requestAnimationFrame(() => target?.scrollIntoView({ block: 'start' }));
          });

          const documentGrid = document.querySelector('#documents .document-grid');
          if (documentGrid && !documentGrid.querySelector('[data-profile-studio-card]')) {
            const article = document.createElement('article');
            article.className = 'card document-tile';
            article.dataset.profileStudioCard = 'true';
            article.innerHTML = '<span class="card-icon">◎</span><h3>Profile Studio</h3><p>Create a TREE profile image locally in your browser.</p><a class="button secondary" href="#profile-studio">Open Profile Studio</a>';
            documentGrid.append(article);
          }

          window.addEventListener('hashchange', activateFromLocation);
          window.addEventListener('popstate', activateFromLocation);
          document.documentElement.classList.add('app-tabbed');
          activateFromLocation();

          window.TREE_PANEL_ROUTER = Object.freeze({
            panels: [...panels.keys()],
            showPanel,
            get activePanelId() { return activePanelId; },
          });
          JS

          cat > dapp/panel-router.css <<'CSS'
          html.app-tabbed{scroll-padding-top:0}
          .app-tabbed body{min-height:100vh}
          .app-tabbed .app-nav{grid-template-columns:repeat(9,minmax(74px,1fr))}
          .app-tabbed main{width:min(1060px,calc(100% - 30px));min-height:calc(100vh - 170px);padding:24px 0 64px}
          .app-tabbed main>.section{margin-top:0}
          .app-tabbed .app-panel[hidden]{display:none!important}
          .app-tabbed .app-panel.active-panel{display:block;animation:treePanelIn .18s ease-out}
          .app-tabbed .app-panel:focus{outline:none}
          .app-tabbed .app-nav a[aria-selected="true"]{color:var(--text);border-color:var(--cyan);background:linear-gradient(180deg,rgba(53,200,255,.1),transparent)}
          .app-tabbed .app-nav a[aria-selected="true"] span{color:var(--cyan);filter:drop-shadow(0 0 8px rgba(53,200,255,.55))}
          .app-tabbed .documents-section .document-grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
          @keyframes treePanelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
          @media(max-width:760px){
            .app-tabbed main{width:min(100% - 18px,1060px);padding-top:14px}
            .app-tabbed .app-nav{grid-template-columns:repeat(9,minmax(70px,1fr));justify-content:flex-start}
            .app-tabbed .app-nav a{min-height:58px;padding:7px 5px}
          }
          @media(prefers-reduced-motion:reduce){.app-tabbed .app-panel.active-panel{animation:none}}
          CSS

          python <<'PY'
          from pathlib import Path
          import re

          path = Path('dapp/index.html')
          text = path.read_text(encoding='utf-8')

          if '<link rel="stylesheet" href="panel-router.css">' not in text:
              text = text.replace('<link rel="stylesheet" href="styles.css">', '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="panel-router.css">', 1)

          text = text.replace('      <a href="#profile-studio"><span aria-hidden="true">◎</span><b>Studio</b></a>\n', '', 1)

          text = re.sub(r'\n    <section class="command-banner" id="overview"[\s\S]*?\n    </section>\n', '\n', text, count=1)
          text = re.sub(r'\n    <section class="command-launcher"[\s\S]*?\n    </section>\n', '\n', text, count=1)
          text = re.sub(r'\n    <section class="section" id="nftree-next"[\s\S]*?</section>\n', '\n', text, count=1)
          text = re.sub(r'\n    <section class="command-bottom-metrics"[\s\S]*?\n    </section>\n', '\n', text, count=1)

          text = text.replace('href="/#about"', 'href="/about/"')
          text = text.replace('href="/#tokenomics"', 'href="/tokenomics/"')
          text = text.replace('href="/#roadmap"', 'href="/roadmap/"')
          text = text.replace('href="/#faq"', 'href="/faq/"')

          if '<script type="module" src="panel-router.js"></script>' not in text:
              text = text.replace('  <script type="module" src="../scripts/profile-studio.js"></script>\n', '  <script type="module" src="../scripts/profile-studio.js"></script>\n  <script type="module" src="panel-router.js"></script>\n', 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-dapp-tabbed-navigation.yml
          git diff --check

      - name: Validate code and existing safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node --check dapp/panel-router.js
          node --check scripts/wallet.js
          node tests/wallet-manager-core.test.mjs
          node tests/wallet-manager-source.test.mjs
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          import re
          markup = Path('dapp/index.html').read_text(encoding='utf-8')
          router = Path('dapp/panel-router.js').read_text(encoding='utf-8')
          css = Path('dapp/panel-router.css').read_text(encoding='utf-8')
          labels = re.findall(r'<b>(Swap|Limit|Earn|V3|Stats|Burn|Raffle|Board|Docs)</b>', markup)
          assert labels == ['Swap','Limit','Earn','V3','Stats','Burn','Raffle','Board','Docs'], labels
          assert '<b>Studio</b>' not in markup
          assert 'class="command-banner"' not in markup
          assert 'class="command-launcher"' not in markup
          assert 'class="command-bottom-metrics"' not in markup
          assert 'id="nftree-next"' not in markup
          assert 'panel-router.css' in markup and 'panel-router.js' in markup
          for panel in ['swap','limit','earn','v3','stats','removed','canopy-draw','leaderboard','profile-studio','documents']:
              assert f'id="{panel}"' in markup
          for route in ['/about/','/tokenomics/','/roadmap/','/faq/']:
              assert f'href="{route}"' in markup
          assert 'window.TREE_PANEL_ROUTER' in router
          assert 'history.pushState' in router
          assert '.app-panel[hidden]' in css
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in Path('dapp/app.js').read_text(encoding='utf-8')
          PY
          git diff --check

      - name: Verify one-panel navigation in a real browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core@24
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tree-panel-router.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const BASE = 'http://127.0.0.1:4173';
          const EXPECTED = ['swap','limit','earn','v3','stats','removed','canopy-draw','leaderboard','documents'];
          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            const results = [];
            for (const viewport of [{width:1440,height:1000},{width:390,height:844},{width:360,height:800}]) {
              const page = await browser.newPage();
              await page.setViewport(viewport);
              await page.goto(`${BASE}/dapp/#swap`, { waitUntil:'domcontentloaded', timeout:120000 });
              await page.waitForSelector('html.app-tabbed', { timeout:60000 });
              for (const id of EXPECTED) {
                await page.click(`.app-nav a[href="#${id}"]`);
                await page.waitForFunction((target) => document.body.dataset.activePanel === target, {}, id);
                const state = await page.evaluate((target) => ({
                  hash: location.hash,
                  active: document.body.dataset.activePanel,
                  visible: [...document.querySelectorAll('main > section[id]')].filter((node) => !node.hidden).map((node) => node.id),
                  selected: [...document.querySelectorAll('.app-nav a[aria-selected="true"]')].map((node) => node.getAttribute('href')),
                  overflow: document.documentElement.scrollWidth - innerWidth,
                  scrollY,
                }), id);
                if (state.hash !== `#${id}` || state.active !== id || state.visible.join('|') !== id || state.selected.join('|') !== `#${id}`) throw new Error(`Panel switch failed: ${JSON.stringify(state)}`);
                if (state.overflow > 1 || state.scrollY > 2) throw new Error(`Panel layout failed: ${JSON.stringify(state)}`);
              }
              await page.click('.app-nav a[href="#documents"]');
              await page.click('#documents a[href="#profile-studio"]');
              await page.waitForFunction(() => document.body.dataset.activePanel === 'profile-studio');
              const profileState = await page.evaluate(() => ({ active: document.body.dataset.activePanel, visible: [...document.querySelectorAll('main > section[id]')].filter((node) => !node.hidden).map((node) => node.id), hash: location.hash }));
              if (profileState.active !== 'profile-studio' || profileState.visible.join('|') !== 'profile-studio') throw new Error(`Secondary tool routing failed: ${JSON.stringify(profileState)}`);
              results.push({viewport, profileState});
              await page.close();
            }
            await browser.close();
            console.log(JSON.stringify({classification:'TREE_SINGLE_PANEL_NAV_VALID',results},null,2));
          })().catch((error)=>{console.error(error);process.exit(1)});
          NODE

      - name: Commit and push the single-panel app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Show one TREE utility panel at a time"
          git push origin HEAD:feature/tree-navigation-v2