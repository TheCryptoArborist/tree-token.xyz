name: TREE Telegram bot

on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/telegram-bot/**'
      - 'supabase/migrations/*tree_telegram_notifications.sql'
      - '.github/workflows/tree-telegram-bot.yml'
  push:
    branches: [main, feat/tree-telegram-bot]
    paths:
      - 'integrations/telegram-bot/**'
      - 'supabase/migrations/*tree_telegram_notifications.sql'
      - '.github/workflows/tree-telegram-bot.yml'

permissions:
  contents: read

jobs:
  telegram-notifications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/telegram-bot/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run preview
      - run: npm run once
