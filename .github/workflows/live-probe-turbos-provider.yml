name: Run live Turbos TREE exposure verification

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/live-probe-turbos-provider.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Verify current mainnet Turbos TREE exposure
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/live-probe-turbos-provider.ts <<'TS'
          import { scanTurbosTreeLp } from '../netlify/lib/turbos-tree-lp-provider.ts';

          const result = await scanTurbosTreeLp();
          console.log(JSON.stringify({
            outcome: result.outcome,
            provider: result.provider,
            methodologyVersion: result.methodologyVersion,
            generatedAt: result.generatedAt,
            publishedWallets: result.positions.length,
            publishedPositionCount: result.positions.reduce((sum, item) => sum + item.positionCount, 0),
            publishedPrincipalTreeRaw: result.positions.reduce((sum, item) => sum + BigInt(item.lpTreeRaw), 0n).toString(),
            coverage: result.coverage,
            warnings: result.warnings,
          }, null, 2));
          if (result.outcome !== 'complete') process.exitCode = 1;
          TS
          npx --yes tsx scripts/live-probe-turbos-provider.ts

      - name: Remove temporary live probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/live-probe-turbos-provider.yml scripts/live-probe-turbos-provider.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete live Turbos exposure verification"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
