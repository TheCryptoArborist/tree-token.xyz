name: Verify protected state after blocked enablement
on:
  push:
    branches: ['feat/bnb-generation-custody']
concurrency:
  group: tree-production-preservation-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[check bnb enablement recovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix contracts/bnb-generation
      - run: node --test tests/bnb-run-enablement.test.mjs
      - name: Verify restored flags and retire unpublished incomplete upload
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/check-bnb-run-enablement-recovery.mjs
