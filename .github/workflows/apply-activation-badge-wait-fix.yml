name: Apply TREE activation badge wait fix

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/apply-activation-badge-wait-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activate-command-center-production
          fetch-depth: 0

      - name: Correct the bootstrap wait variable
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('netlify/lib/tree-badge-background-worker.ts')
          text = path.read_text(encoding='utf-8')
          old_name = "const waitForExposure = context === 'deploy-preview' || enabled(getEnv('TREE_BADGE_AUTO_BOOTSTRAP'));"
          old_use = 'const waitMs = waitForExposure ? 5 * 60 * 1000 : 0;'
          if old_name not in text or old_use not in text:
              raise SystemExit('Expected production badge bootstrap wait variables were not found.')
          text = text.replace(old_name, "const shouldWaitForExposure = context === 'deploy-preview' || enabled(getEnv('TREE_BADGE_AUTO_BOOTSTRAP'));", 1)
          text = text.replace(old_use, 'const waitMs = shouldWaitForExposure ? 5 * 60 * 1000 : 0;', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-activation-badge-wait.yml
          git diff --check

      - name: Validate all safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check dapp/app.js
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          grep -q 'const shouldWaitForExposure' netlify/lib/tree-badge-background-worker.ts
          grep -q "const leaderboardUrl = '/api/tree-exposure'" dapp/app.js
          grep -q 'DAPP_SWAP_EXECUTION_ENABLED = false' dapp/app.js
          git diff --check

      - name: Commit and push correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Fix production badge bootstrap wait"
          git push origin HEAD:feature/activate-command-center-production
