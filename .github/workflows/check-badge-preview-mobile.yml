name: Run TREE badge preview browser QA

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-badge-preview-mobile.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser driver
        shell: bash
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Validate desktop and mobile layouts
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('node:fs');
          const path = require('node:path');
          const url = 'https://deploy-preview-6--tree-token.netlify.app/dapp/#leaderboard';
          const viewports = [
            { width: 1440, height: 1000 },
            { width: 1024, height: 900 },
            { width: 768, height: 900 },
            { width: 390, height: 844 },
            { width: 360, height: 800 },
          ];
          const browser = await puppeteer.launch({
            headless: true,
            executablePath: process.env.CHROME,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const results = [];
          for (const viewport of viewports) {
            const page = await browser.newPage();
            await page.setViewport(viewport);
            const consoleErrors = [];
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('pageerror', (error) => consoleErrors.push(error.message));
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 120000 });
            await page.waitForFunction(() => document.querySelectorAll('.leader-card').length === 50, { timeout: 120000 });
            await new Promise((resolve) => setTimeout(resolve, 1000));
            const metrics = await page.evaluate(() => {
              const overflow = [...document.querySelectorAll('body *')]
                .filter((element) => {
                  const style = getComputedStyle(element);
                  if (style.position === 'fixed' || style.position === 'sticky') return false;
                  const rect = element.getBoundingClientRect();
                  return rect.left < -1 || rect.right > innerWidth + 1;
                })
                .slice(0, 20)
                .map((element) => {
                  const rect = element.getBoundingClientRect();
                  return {
                    tag: element.tagName,
                    id: element.id,
                    className: String(element.className || ''),
                    left: Math.round(rect.left),
                    right: Math.round(rect.right),
                  };
                });
              const badgeLabels = [...document.querySelectorAll('.leader-badge')].map((element) => element.textContent.trim());
              return {
                viewportWidth: innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                bodyWidth: document.body.scrollWidth,
                cardCount: document.querySelectorAll('.leader-card').length,
                exposureCardCount: document.querySelectorAll('.leader-card.exposure-card').length,
                badgeCount: badgeLabels.length,
                badgeLabels: [...new Set(badgeLabels)],
                leaderboardState: document.querySelector('#leaderboardState')?.textContent?.trim() || null,
                overflow,
              };
            });
            const filename = `/tmp/tree-badge-preview-${viewport.width}.png`;
            await page.screenshot({ path: filename, fullPage: true });
            const failures = [];
            if (metrics.documentWidth > metrics.viewportWidth + 1 || metrics.bodyWidth > metrics.viewportWidth + 1) failures.push('page horizontal overflow');
            if (metrics.cardCount !== 50 || metrics.exposureCardCount !== 50) failures.push('leaderboard card count');
            for (const label of ['LP Provider', 'LP Maxi', 'Diamond Hands', 'Burned']) {
              if (!metrics.badgeLabels.some((value) => value.includes(label))) failures.push(`missing visible ${label}`);
            }
            if (metrics.leaderboardState !== 'Current Exposure Snapshot') failures.push('leaderboard state');
            if (consoleErrors.length) failures.push(`console errors: ${consoleErrors.join(' | ')}`);
            if (failures.length) {
              console.error(JSON.stringify({ viewport, failures, metrics }, null, 2));
              await browser.close();
              process.exit(1);
            }
            results.push({ viewport, metrics, screenshot: filename });
            await page.close();
          }
          await browser.close();
          console.log(JSON.stringify({ classification: 'SUCCESS', results }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: tree-badge-preview-screenshots
          path: /tmp/tree-badge-preview-*.png
          retention-days: 7
