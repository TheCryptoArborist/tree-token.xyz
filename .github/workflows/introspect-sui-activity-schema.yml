name: Inspect Sui activity GraphQL schema

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/introspect-sui-activity-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve TREE package creation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const query = `query PackageCreation($address: SuiAddress!) {
            object(address: $address) {
              address
              version
              digest
              previousTransaction {
                digest
                effects { status timestamp checkpoint { sequenceNumber timestamp } }
              }
            }
          }`;
          const variables = { address: '0x6c5a609f6d0288523ce4a6ed87d19ae127f62073ab75fd9b0b1c9b455d4895cf' };
          const response = await fetch('https://graphql.mainnet.sui.io/graphql', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ query, variables }),
          });
          console.log(JSON.stringify(await response.json(), null, 2));
          NODE
