name: Inspect Sui activity GraphQL schema

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/introspect-sui-activity-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Introspect transaction and checkpoint filter types
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const query = `query Introspect {
            txFilter: __type(name: "TransactionFilter") {
              inputFields { name type { kind name ofType { kind name ofType { kind name } } } }
            }
            checkpointFilter: __type(name: "CheckpointFilter") {
              inputFields { name type { kind name ofType { kind name ofType { kind name } } } }
            }
            tx: __type(name: "Transaction") {
              fields { name type { kind name ofType { kind name } } }
            }
            effects: __type(name: "TransactionEffects") {
              fields { name type { kind name ofType { kind name } } }
            }
            pageInfo: __type(name: "PageInfo") {
              fields { name type { kind name ofType { kind name } } }
            }
          }`;
          const response = await fetch('https://graphql.mainnet.sui.io/graphql', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ query }),
          });
          const payload = await response.json();
          console.log(JSON.stringify({
            errors: payload.errors || [],
            transactionFilter: payload.data?.txFilter,
            checkpointFilter: payload.data?.checkpointFilter,
            transactionFields: payload.data?.tx?.fields,
            effectsFields: payload.data?.effects?.fields,
            pageInfoFields: payload.data?.pageInfo?.fields,
          }, null, 2));
          NODE
