name: Inspect Sui activity GraphQL schema

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/introspect-sui-activity-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect package object and history fields
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const query = `query Introspect {
            queryType: __type(name: "Query") {
              fields { name args { name type { kind name ofType { kind name } } } }
            }
            objectType: __type(name: "Object") {
              fields { name type { kind name ofType { kind name } } }
            }
            movePackage: __type(name: "MovePackage") {
              fields { name type { kind name ofType { kind name } } }
            }
          }`;
          const response = await fetch('https://graphql.mainnet.sui.io/graphql', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ query }),
          });
          const payload = await response.json();
          const queryFields = (payload.data?.queryType?.fields || []).filter((field) => ['object','owner','address'].includes(field.name));
          const objectFields = (payload.data?.objectType?.fields || []).filter((field) => /previous|transaction|version|address|digest|asMovePackage/i.test(field.name));
          console.log(JSON.stringify({ errors: payload.errors || [], queryFields, objectFields, movePackageFields: payload.data?.movePackage?.fields }, null, 2));
          NODE
