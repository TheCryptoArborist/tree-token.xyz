name: Probe Turbos TREE pool position index

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/probe-turbos-pool-dynamic-fields.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Enumerate dynamic fields directly under the active Turbos TREE pool
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/probe-turbos-pool-dynamic-fields.ts <<'TS'
          import { ChannelCredentials } from '@grpc/grpc-js';
          import { GrpcTransport } from '@protobuf-ts/grpc-transport';
          import { SuiGrpcClient } from '@mysten/sui/grpc';

          const POOL_ID = '0xaa133ce1f8fd55d85b6fc87c1b3054cb717d83be477ef3635c661c21fbdfa0ee';
          const KNOWN_NFT = '0x4b0bcbb056dfba0ef2c3f195c7fd2483aec8410d0f454a173620819b20ba2eaf';
          const client = new SuiGrpcClient({
            network: 'mainnet',
            transport: new GrpcTransport({
              host: 'fullnode.mainnet.sui.io:443',
              channelCredentials: ChannelCredentials.createSsl(),
            }),
          });

          const fields: any[] = [];
          let cursor: string | undefined;
          let pages = 0;
          for (let page = 0; page < 100; page += 1) {
            const result = await client.core.listDynamicFields({
              parentId: POOL_ID,
              cursor,
              limit: 1000,
            });
            pages = page + 1;
            fields.push(...(result.dynamicFields || []));
            if (!result.cursor) break;
            cursor = result.cursor;
          }

          const summary = fields.map((field: any) => ({
            fieldId: field.fieldId || null,
            dynamicFieldKind: field.dynamicFieldKind || field.kind || null,
            nameType: field.name?.type || null,
            nameJson: field.name?.json ?? null,
            valueType: field.valueType || field.value?.type || null,
            childObjectId: field.childObjectId || field.value?.objectId || null,
            containsKnownNft: JSON.stringify(field).toLowerCase().includes(KNOWN_NFT.slice(2)),
          }));
          const grouped = Object.entries(summary.reduce((acc: Record<string, number>, item) => {
            const key = `${item.dynamicFieldKind || 'unknown'}|${item.nameType || 'unknown'}|${item.valueType || 'unknown'}`;
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {})).sort((left, right) => right[1] - left[1]);
          const known = summary.filter((item) => item.containsKnownNft);
          console.log('TURBOS_POOL_DYNAMIC_FIELDS=' + JSON.stringify({
            poolId: POOL_ID,
            pages,
            reachedEnd: !cursor,
            fieldCount: fields.length,
            grouped,
            known,
            samples: summary.slice(0, 30),
          }));
          TS
          npx --yes tsx scripts/probe-turbos-pool-dynamic-fields.ts

      - name: Remove temporary probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-turbos-pool-dynamic-fields.yml scripts/probe-turbos-pool-dynamic-fields.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Turbos TREE pool position index discovery"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
