name: Preserve and repair BNB deployment handoff
on:
  push:
    branches: ['feat/bnb-generation-custody']
permissions:
  contents: read
  actions: read
concurrency:
  group: tree-production-preservation-release
  cancel-in-progress: false
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[prepare bnb handoff]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix contracts/bnb-generation
      - run: |
          node --test contracts/nftree-generation/scripts/*.test.mjs tools/generation-publication/core.test.mjs tools/generation-slot/*.test.mjs tests/generation-publication-release.test.mjs tests/bnb-generation-release.test.mjs contracts/bnb-generation/test/handoff.test.mjs
          node tools/bnb-generation/build.mjs
          git diff --exit-code -- tools/bnb-generation/app.js
      - name: Capture current production and prepare exact new candidate
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/release-bnb-generation.mjs prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-generation-candidate
          path: .netlify/bnb-generation-release
          include-hidden-files: true
          if-no-files-found: warn
  publish:
    if: contains(github.event.head_commit.message, '[publish bnb handoff]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix contracts/bnb-generation
      - name: Read reviewed candidate run
        id: control
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('production/bnb-generation-publish.json'));
          assert(/^\d+$/.test(String(c.runId)));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${c.runId}\n`);
          JS
      - uses: actions/download-artifact@v4
        with:
          name: bnb-generation-candidate
          path: .netlify/bnb-generation-release
          run-id: ${{ steps.control.outputs.run }}
          github-token: ${{ github.token }}
      - run: node --test contracts/nftree-generation/scripts/*.test.mjs tools/generation-publication/core.test.mjs tools/generation-slot/*.test.mjs tests/generation-publication-release.test.mjs tests/bnb-generation-release.test.mjs contracts/bnb-generation/test/handoff.test.mjs
      - name: Verify preserved candidate, wait for all builds, publish and lock
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/release-bnb-generation.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-generation-publication
          path: .netlify/bnb-generation-release
          include-hidden-files: true
          if-no-files-found: error
