name: Probe Turbos position creation events

on:
  push:
    branches:
      - feature/leaderboard-exposure-v1
    paths:
      - '.github/workflows/probe-turbos-position-events.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaderboard-exposure-v1
          fetch-depth: 0

      - name: Inspect known Turbos TREE position creation metadata and events
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > scripts/probe-turbos-position-events.ts <<'TS'
          import { ChannelCredentials } from '@grpc/grpc-js';
          import { GrpcTransport } from '@protobuf-ts/grpc-transport';
          import { SuiGrpcClient } from '@mysten/sui/grpc';

          const NFT_ID = '0x4b0bcbb056dfba0ef2c3f195c7fd2483aec8410d0f454a173620819b20ba2eaf';
          const POSITION_ID = '0x8c92da6d4b0440558df7d13322bbb42a19954e01d9e036eb434fc3cedd504478';
          const GRAPHQL = 'https://graphql.mainnet.sui.io/graphql';
          const client = new SuiGrpcClient({
            network: 'mainnet',
            transport: new GrpcTransport({
              host: 'fullnode.mainnet.sui.io:443',
              channelCredentials: ChannelCredentials.createSsl(),
            }),
          });
          const core = client.core as any;
          console.log('CORE_METHODS', JSON.stringify(Object.getOwnPropertyNames(Object.getPrototypeOf(core)).sort()));
          for (const objectId of [NFT_ID, POSITION_ID]) {
            try {
              const result = await core.getObject({ objectId, include: { json: true, content: true } });
              console.log(`GRPC_OBJECT_${objectId}`, JSON.stringify(result, null, 2));
            } catch (error) {
              console.log(`GRPC_OBJECT_ERROR_${objectId}`, error instanceof Error ? error.message : String(error));
            }
          }

          async function gql(label: string, query: string, variables: Record<string, unknown> = {}) {
            try {
              const response = await fetch(GRAPHQL, {
                method: 'POST',
                headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables }),
              });
              console.log(label, response.status, JSON.stringify(await response.json(), null, 2));
            } catch (error) {
              console.log(`${label}_ERROR`, error instanceof Error ? error.message : String(error));
            }
          }

          await gql('OBJECT_TYPE_INTROSPECTION', `query {
            objectType: __type(name: "Object") { fields { name type { kind name ofType { kind name } } } }
            moveObjectType: __type(name: "MoveObject") { fields { name type { kind name ofType { kind name } } } }
            transactionType: __type(name: "TransactionBlock") { fields { name type { kind name ofType { kind name } } } }
            eventType: __type(name: "Event") { fields { name type { kind name ofType { kind name } } } }
          }`);

          await gql('OBJECT_PREVIOUS_TX', `query ObjectPrevious($address: SuiAddress!) {
            object(address: $address) {
              address
              version
              digest
              previousTransactionBlock { digest }
              asMoveObject { contents { json } }
            }
          }`, { address: NFT_ID });
          TS
          npx --yes tsx scripts/probe-turbos-position-events.ts

      - name: Remove temporary probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-turbos-position-events.yml scripts/probe-turbos-position-events.ts
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Turbos position event discovery"
            git push origin HEAD:feature/leaderboard-exposure-v1
          fi
