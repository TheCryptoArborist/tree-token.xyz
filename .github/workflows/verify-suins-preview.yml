name: Verify SuiNS leaderboard preview

on:
  push:
    branches:
      - feature/command-center-ui-v2
    paths:
      - '.github/workflows/verify-suins-preview.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-center-ui-v2
          fetch-depth: 0

      - name: Verify live preview endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://deploy-preview-2--tree-token.netlify.app/api/tree-leaderboard-preview'
          temp_json="$(mktemp)"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 60 "$endpoint" -o "$temp_json"; then
              if python - "$temp_json" <<'PY'
          import json, sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          entries = payload.get('entries') or []
          identity = payload.get('identityResolution') or {}
          assert payload.get('status') in {'ok', 'stale'}, payload.get('status')
          assert len(entries) == 50, len(entries)
          assert identity.get('provider') == 'sui-graphql-default-suins-name', identity
          assert identity.get('requestedCount') == 50, identity
          assert isinstance(identity.get('resolvedCount'), int), identity
          assert identity.get('complete') is True, identity
          assert all('suinsName' in entry for entry in entries), 'Every entry must carry a nullable suinsName field.'
          assert all(entry.get('wallet') for entry in entries), 'Wallet identity must remain present.'
          print(json.dumps({
              'status': payload.get('status'),
              'refreshState': payload.get('refreshState'),
              'entries': len(entries),
              'requestedNames': identity.get('requestedCount'),
              'resolvedNames': identity.get('resolvedCount'),
              'resolutionComplete': identity.get('complete'),
              'provider': identity.get('provider'),
          }, indent=2))
          PY
              then
                break
              fi
            fi
            if [ "$attempt" -eq 18 ]; then
              echo 'SuiNS preview verification did not reach a valid state.' >&2
              exit 1
            fi
            sleep 10
          done
          rm -f "$temp_json"

      - name: Remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-suins-preview.yml
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add .github/workflows/verify-suins-preview.yml
          git commit -m "Confirm SuiNS leaderboard preview"
          git push origin HEAD:feature/command-center-ui-v2
