name: Probe TREE activation Deploy Preview state

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/probe-activation-preview.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read corrected exposure and badge states
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://deploy-preview-7--tree-token.netlify.app'
          curl --silent --show-error --location --max-time 60 "$BASE/api/tree-exposure?probe_state=2" -o /tmp/exposure.json
          curl --silent --show-error --location --max-time 60 "$BASE/api/tree-badges?probe_state=2" -o /tmp/badges.json
          node <<'NODE'
          const exposure = require('/tmp/exposure.json');
          const badges = require('/tmp/badges.json');
          console.log(JSON.stringify({
            exposure: {
              status: exposure.status,
              refreshState: exposure.refreshState,
              refreshStatus: exposure.refreshStatus,
              snapshotGeneratedAt: exposure.snapshotGeneratedAt,
              displayedCount: exposure.displayedCount,
              warnings: exposure.warnings,
              message: exposure.message,
            },
            badges: {
              status: badges.status,
              refreshState: badges.refreshState,
              refreshStatus: badges.refreshStatus,
              snapshotGeneratedAt: badges.snapshotGeneratedAt,
              exposureSnapshotGeneratedAt: badges.exposureSnapshotGeneratedAt,
              displayedCount: badges.displayedCount,
              source: badges.source,
              summary: badges.summary,
              warnings: badges.warnings,
              message: badges.message,
            },
          }, null, 2));
          NODE
