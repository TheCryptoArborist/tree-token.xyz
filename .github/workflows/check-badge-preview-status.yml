name: Check TREE badge preview status

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-badge-preview-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read corrected Deploy Preview state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://deploy-preview-6--tree-token.netlify.app'
          for endpoint in tree-exposure tree-badges; do
            curl --silent --show-error --location --max-time 60 \
              "$BASE/api/$endpoint?mobile_fix_bootstrap=1" \
              -o "/tmp/$endpoint.json"
          done
          node <<'NODE'
          const exposure = require('/tmp/tree-exposure.json');
          const badges = require('/tmp/tree-badges.json');
          console.log(JSON.stringify({
            exposure: {
              status: exposure.status,
              refreshState: exposure.refreshState,
              stage: exposure.refreshStatus?.stage,
              snapshotGeneratedAt: exposure.snapshotGeneratedAt,
              displayedCount: exposure.displayedCount,
              message: exposure.message,
            },
            badges: {
              status: badges.status,
              refreshState: badges.refreshState,
              stage: badges.refreshStatus?.stage,
              activityOutcome: badges.refreshStatus?.activityOutcome,
              burnOutcome: badges.refreshStatus?.burnOutcome,
              snapshotGeneratedAt: badges.snapshotGeneratedAt,
              displayedCount: badges.displayedCount,
              message: badges.message,
            },
          }, null, 2));
          NODE
