name: Check TREE badge preview status

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-badge-preview-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read compact TREE badge Deploy Preview state
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location --max-time 60 \
            'https://deploy-preview-6--tree-token.netlify.app/api/tree-badges?status_check=2' \
            -o /tmp/tree-badges.json
          node <<'NODE'
          const p = require('/tmp/tree-badges.json');
          console.log(JSON.stringify({
            status: p.status,
            refreshState: p.refreshState,
            refreshStatus: p.refreshStatus,
            snapshotGeneratedAt: p.snapshotGeneratedAt,
            exposureSnapshotGeneratedAt: p.exposureSnapshotGeneratedAt,
            displayedCount: p.displayedCount,
            source: p.source,
            summary: p.summary,
            warnings: p.warnings,
            message: p.message,
          }, null, 2));
          NODE
