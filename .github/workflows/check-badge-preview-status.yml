name: Check TREE badge preview status

on:
  push:
    branches:
      - review/phase1
    paths:
      - '.github/workflows/check-badge-preview-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read post-fix Deploy Preview badge state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://deploy-preview-6--tree-token.netlify.app'
          curl --silent --show-error --location --max-time 60 \
            "$BASE/api/tree-badges?profile_fix_bootstrap=2" \
            -o /tmp/tree-badges.json
          node <<'NODE'
          const badges = require('/tmp/tree-badges.json');
          console.log(JSON.stringify({
            status: badges.status,
            refreshState: badges.refreshState,
            refreshStatus: badges.refreshStatus,
            snapshotGeneratedAt: badges.snapshotGeneratedAt,
            exposureSnapshotGeneratedAt: badges.exposureSnapshotGeneratedAt,
            displayedCount: badges.displayedCount,
            source: badges.source,
            summary: badges.summary,
            warnings: badges.warnings,
            message: badges.message,
          }, null, 2));
          NODE
