name: Apply TREE navigation and homepage reorganization

on:
  push:
    branches:
      - feature/tree-navigation-v2
    paths:
      - '.github/workflows/apply-tree-navigation-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-navigation-v2
          fetch-depth: 0

      - name: Apply homepage and Command Center organization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-navigation-v2.py
          python <<'PY'
          from pathlib import Path
          import re

          index_path = Path('dapp/index.html')
          text = index_path.read_text(encoding='utf-8')
          text = text.replace('<a href="#swap"><span aria-hidden="true">↕</span><b>Swap</b></a>', '<a class="active" href="#swap"><span aria-hidden="true">↕</span><b>Swap</b></a>', 1)
          text = text.replace('<h2 id="canopy-title">TREE Canopy Draw</h2>', '<h2 id="canopy-title">TREE Canopy Draw Raffle</h2>', 1)

          board_pattern = re.compile(r'\n    <section class="section leaderboard-section" id="leaderboard"[\s\S]*?\n    </section>\n')
          board_match = board_pattern.search(text)
          if not board_match:
              raise SystemExit('Could not isolate the Canopy Board section for reordering.')
          board = board_match.group(0)
          text = text[:board_match.start()] + text[board_match.end():]

          draw_pattern = re.compile(r'(\n    <section class="section" id="canopy-draw"[\s\S]*?\n    </section>\n)')
          draw_match = draw_pattern.search(text)
          if not draw_match:
              raise SystemExit('Could not find the Canopy Draw section for board placement.')
          text = text[:draw_match.end()] + board + text[draw_match.end():]
          index_path.write_text(text, encoding='utf-8')

          app_path = Path('dapp/app.js')
          app = app_path.read_text(encoding='utf-8')
          old = "document.querySelector('[data-derived=\"removalPercent\"]').textContent = removal === null ? 'Not available' : `${removal.toFixed(2)}%`;"
          new = "document.querySelectorAll('[data-derived=\"removalPercent\"]').forEach((element) => { element.textContent = removal === null ? 'Not available' : `${removal.toFixed(2)}%`; });"
          if old not in app:
              raise SystemExit('Could not update all removal-percentage displays.')
          app_path.write_text(app.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f scripts/apply-navigation-v2.py .github/workflows/apply-tree-navigation-v2.yml
          git diff --check

      - name: Validate build, logic, and existing safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --check scripts/home-v2.js
          node --check dapp/app.js
          node --check scripts/wallet.js
          node tests/wallet-manager-core.test.mjs
          node tests/wallet-manager-source.test.mjs
          node tests/dashboard-cache.test.mjs
          node tests/leaderboard-ui-state.test.mjs
          for test in tests/*.ts; do npx --yes tsx "$test"; done
          python <<'PY'
          from pathlib import Path
          home = Path('index.html').read_text(encoding='utf-8')
          home_js = Path('scripts/home-v2.js').read_text(encoding='utf-8')
          dapp = Path('dapp/index.html').read_text(encoding='utf-8')
          styles = Path('dapp/styles.css').read_text(encoding='utf-8')
          app = Path('dapp/app.js').read_text(encoding='utf-8')
          assert 'styles/home-v2.css' in home
          assert 'scripts/home-v2.js' in home
          for anchor in ['about', 'ecosystem', 'tokenomics', 'roadmap', 'faq', 'documents']:
              assert f'href="#{anchor}"' in home_js
          assert 'tree.launchPopupDismissedAt' in home_js
          assert "document.querySelector('.fab-group')?.remove()" in home_js
          for label in ['Swap', 'Limit', 'Earn', 'V3', 'Stats', 'Burn', 'Raffle', 'Board', 'Studio', 'Docs']:
              assert f'<b>{label}</b>' in dapp
          for section in ['limit', 'earn', 'v3', 'stats', 'removed', 'canopy-draw', 'leaderboard', 'profile-studio', 'documents']:
              assert f'id="{section}"' in dapp
          assert dapp.index('id="swap"') < dapp.index('id="limit"') < dapp.index('id="earn"') < dapp.index('id="v3"') < dapp.index('id="stats"') < dapp.index('id="removed"') < dapp.index('id="canopy-draw"') < dapp.index('id="leaderboard"') < dapp.index('id="documents"')
          assert '.command-action-grid' in styles
          assert '.command-bottom-metrics' in styles
          assert 'DAPP_SWAP_EXECUTION_ENABLED = false' in app
          assert "querySelectorAll('[data-derived=\"removalPercent\"]')" in app
          PY
          git diff --check

      - name: Verify homepage and Command Center in a real browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core@24
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tree-navigation-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const BASE = 'http://127.0.0.1:4173';
          (async () => {
            const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const results = [];
            for (const viewport of [{ width: 1440, height: 1000 }, { width: 390, height: 844 }, { width: 360, height: 800 }]) {
              const home = await browser.newPage();
              await home.setViewport(viewport);
              await home.goto(`${BASE}/?navigation_v2=1`, { waitUntil: 'domcontentloaded', timeout: 120000 });
              await home.waitForSelector('html.home-v2', { timeout: 60000 });
              await home.waitForFunction(() => document.querySelectorAll('.home-action-card').length === 10, { timeout: 60000 });
              const homeState = await home.evaluate(() => {
                const ids = ['ecosystem','about','tokenomics','roadmap','impact','faq','documents','get-started','numbers'];
                return {
                  navLabels: [...document.querySelectorAll('#mobile-nav nav a')].map((node) => node.textContent.trim()),
                  launchButtons: document.querySelectorAll('.header-launch').length,
                  walletHidden: document.querySelector('#wallet-btn')?.hidden === true,
                  actionCards: document.querySelectorAll('.home-action-card').length,
                  heroActions: document.querySelectorAll('.hero-actions .btn').length,
                  popupPresent: Boolean(document.querySelector('.launch-popup')),
                  fabPresent: Boolean(document.querySelector('.fab-group')),
                  sectionPositions: ids.map((id) => ({ id, top: document.getElementById(id)?.getBoundingClientRect().top + scrollY })),
                  documentWidth: document.documentElement.scrollWidth,
                  viewportWidth: innerWidth,
                };
              });
              if (homeState.navLabels.join('|') !== 'About|Ecosystem|Tokenomics|Roadmap|FAQ|Documents') throw new Error(`Homepage nav mismatch: ${JSON.stringify(homeState)}`);
              if (homeState.launchButtons !== 1 || !homeState.walletHidden) throw new Error(`Homepage header controls invalid: ${JSON.stringify(homeState)}`);
              if (homeState.actionCards !== 10 || homeState.heroActions !== 3) throw new Error(`Homepage action hierarchy invalid: ${JSON.stringify(homeState)}`);
              if (homeState.popupPresent || homeState.fabPresent) throw new Error(`Legacy homepage clutter remained: ${JSON.stringify(homeState)}`);
              if (homeState.sectionPositions.some((item) => !Number.isFinite(item.top))) throw new Error(`Homepage section missing: ${JSON.stringify(homeState)}`);
              const tops = homeState.sectionPositions.map((item) => item.top);
              if (!tops.every((top, index) => index === 0 || top > tops[index - 1])) throw new Error(`Homepage sections out of order: ${JSON.stringify(homeState)}`);
              if (homeState.documentWidth > homeState.viewportWidth + 1) throw new Error(`Homepage overflow: ${JSON.stringify(homeState)}`);
              if (viewport.width <= 390) {
                await home.click('#nav-toggle');
                const open = await home.$eval('#mobile-nav', (node) => node.classList.contains('open'));
                if (!open) throw new Error('Mobile homepage navigation did not open.');
              }
              await home.close();

              const dapp = await browser.newPage();
              await dapp.setViewport(viewport);
              await dapp.goto(`${BASE}/dapp/?navigation_v2=1`, { waitUntil: 'domcontentloaded', timeout: 120000 });
              await dapp.waitForSelector('.command-action-grid', { timeout: 60000 });
              const dappState = await dapp.evaluate(() => ({
                navLabels: [...document.querySelectorAll('.app-nav b')].map((node) => node.textContent.trim()),
                actionCards: document.querySelectorAll('.command-action-grid a').length,
                sections: ['swap','limit','earn','v3','stats','removed','canopy-draw','leaderboard','profile-studio','documents'].map((id) => Boolean(document.getElementById(id))),
                bottomMetrics: document.querySelectorAll('.command-bottom-metrics article').length,
                documentWidth: document.documentElement.scrollWidth,
                viewportWidth: innerWidth,
              }));
              if (dappState.navLabels.join('|') !== 'Swap|Limit|Earn|V3|Stats|Burn|Raffle|Board|Studio|Docs') throw new Error(`Command nav mismatch: ${JSON.stringify(dappState)}`);
              if (dappState.actionCards !== 10 || !dappState.sections.every(Boolean) || dappState.bottomMetrics !== 6) throw new Error(`Command structure invalid: ${JSON.stringify(dappState)}`);
              if (dappState.documentWidth > dappState.viewportWidth + 1) throw new Error(`Command Center overflow: ${JSON.stringify(dappState)}`);
              results.push({ viewport, home: homeState, dapp: dappState });
              await dapp.close();
            }
            await browser.close();
            console.log(JSON.stringify({ classification: 'TREE_NAVIGATION_V2_VALID', results }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and push the organized experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add -A
          git commit -m "Organize TREE around clear investor and utility paths"
          git push origin HEAD:feature/tree-navigation-v2
